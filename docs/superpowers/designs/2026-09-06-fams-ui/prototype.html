<script>
'use strict';
const pages=[
['P01','登录','员工身份 / 系统入口','账号绑定企业员工；初次改密、停用与锁定明确反馈。','企业员工'],
['P02','工作台','任务入口 / 兼岗合并','共享待审批、待领取与我处理中分区；指标可下钻，异常有下一步。','资产管理员 + 库管员'],
['P03','资产列表','台账 / 查找与筛选','固定身份列；正式责任、实物去向和业务占用同时可理解。','库管员'],
['P04','资产详情','台账 / 唯一资产入口','常驻概要与九页签；待交接不作为资产生命周期。','资产管理员'],
['P05','单个与复制建卡','台账 / 建卡表单','基础身份、仓库位置与扩展资料分区；不采集资产原值。','库管员'],
['P06','导入与后台任务','台账 / 批次向导','错误定位至原始行；离开页面后台任务继续。','库管员'],
['P07','期初初始化','台账 / 受控核验发布','库管准备、管理员核验；原状态与未结承接资料成组展示。','资产管理员'],
['P08','标签打印','台账 / 标签任务','只打印正式发布卡片；重打不改变身份。','库管员'],
['P09','共享审批池','工作台 / 管理决定','任意一名管理员决定；仅查看不占用；兼岗批准不自动认领。','资产管理员'],
['P10','库管执行池','工作台 / 共享执行','查看不占用；开始处理后整单独占；他人处理只读。','库管员'],
['P11','统一业务详情','业务 / 单据与后续','需求、执行、实物阶段和原单后续在同一入口可追溯。','资产管理员 + 库管员'],
['P12','分配与交出','业务 / 库管执行','申请 3 件、分配 2 件、1 件无法满足；逐项交出与接收。','当前处理库管'],
['P13','入库与退还验收','业务 / 实物验收模板','正常、损坏、缺件和归还遗失有明确后续；不伪造归还。','当前处理库管'],
['P14','调拨与目标变更','业务 / 前后对比','跨仓库分组提示；整单一个库管，实际目标人接收。','当前处理库管'],
['P15','盘点任务','盘点 / 组织与封存','范围、人员、进度、未盘原因与未同步情况；终态不重开。','资产管理员'],
['P16','差异与证据复核','盘点 / 复核裁决','快照、现场证据、当前资产对照；多个差异分别闭环。','资产管理员'],
['P17','报修与返厂','维修 / 轮次与去向','科技意见、原责任、实物去向、多轮返厂与最终返还分开。','当前处理库管'],
['P18','科技协助','维修 / 被邀请意见','只追加被邀请工单的意见，不取得整单执行权。','科技协助人员'],
['P19','报失与找回','异常 / 查找与责任','确认遗失后仍保留原责任与后续跟进。','当前处理库管'],
['P20','报废与处置','退出 / 执行与纠正','批准、报废执行和处置三种事实；受控冲正不覆盖历史。','当前处理库管'],
['P21','交接异常与代确认','交接 / 真实凭证','库管申请、单管理员决定、当前库管执行，再通知生效责任人。','当前处理库管'],
['P22','受控转派','异常 / 整单处理交接','核对实物、原处理人、未同步情况，转派不解锁资产。','资产管理员'],
['P23','报表与抽样','统计 / 可追溯口径','20 类报表共用模板；保留分子分母、抽样来源与补录前结果。','审计只读 / 抽样登记另授权'],
['P24','基础资料与人员交接','基础 / 组织责任','员工调岗不重写资产；停用即时撤权，遗留责任正式交接。','系统管理员 / 交接另需业务角色'],
['P25','角色与系统设置','系统 / 显式授权','配置角色不等于拥有业务权限；恢复成员后原待办仍保留。','系统管理员'],
['P26','消息中心','全局 / 站内结果','业务结果与个人阅读分开；外部触达不决定业务完成。','资产管理员 + 库管员'],
['M01','绑定与资料异常','账号 / 初次绑定','工号与企业登记手机号短信验证；未登录也有内部支持入口。','普通员工'],
['M02','首页','现场 / 当前待办','优先待接收、借用临期和盘点；不放全企业指标。','普通员工'],
['M03','申请中心','申请 / 按业务变化的表单','领借按需求申请，退还等选择本人或代办范围资产。','普通员工'],
['M04','我的申请与进度','申请 / 数量与后续','明确已完成、待交接与无法满足；重新申请保留来源。','普通员工'],
['M05','我的资产','保管 / 在用与借用','个人资产与公用资产分开；借用申请完成仍需归还。','普通员工'],
['M06','部门公用资产','部门 / 公用概要','普通员工可报修；接收仅指定责任人。','普通员工'],
['M07','部门资产与代办','部门 / 资产员工作','个人和公用必要明细均可代申请；不能代个人接收。','部门资产员'],
['M08','扫码与资产概要','扫码 / 情境识别','扫码只识别身份，按当前权限和业务阶段提供动作。','普通员工'],
['M09','待接收与实物核对','交接 / 实际接收','仅已交出且本人可接收项；确认或反馈不符，拒收不解锁。','实际接收人'],
['M10','我的盘点任务','盘点 / 执行入口','任务进度与待上传分别显示；可确认已完成同步。','被分配执行人'],

const offlineCases={
  normal:{label:'正常上传 · 任务进行中',valid:true,sealed:false,hours:1,receipt:false},
  late:{label:'T+71h · 已封存后补传',valid:true,sealed:true,hours:71,receipt:false},

function setOfflineCase(key){
  state.offlineCase=key;state.offlineOutcome=null;state.local=2;state.uploaded=false;state.accepted=offlineCases[key].receipt?29:28;state.inventoryCounted=offlineCases[key].receipt;
  if(key==='invalid'||key==='expired')receiveOffline();
}
function receiveOffline(){
  const c=offlineCases[state.offlineCase];
  if(!c.valid){state.offlineOutcome={status:'明确拒绝',text:'账号或绑定已失效，禁止补传；已清理本设备缓存。即使以前有成功回执也不能恢复访问。',retry:false};state.local=0;return;}
  if(state.offlineOutcome)return;
  if(c.receipt){state.offlineOutcome={status:'已接受 · 原回执',text:'此前已在有效期内成功接收。本次返回原结果，不增加完成数，不改变原报告。',retry:true};}
  else if(c.hours===null){state.offlineOutcome={status:'时间异常待复核',text:'无法核实事件时间，仅进入复核；不自动采信、不延长期限。',retry:true};}
  else if(c.hours>=72){state.offlineOutcome={status:'过期失效',text:'已达到首次保存后72小时；此批待上传记录已过期清理。不能补传为原任务迟到证据，请通知管理员补盘。',retry:false};state.local=0;return;}
  else if(c.sealed){state.offlineOutcome={status:'迟到待复核',text:'仅追加迟到证据，完成数、封存报告及最近盘点日期均不改变。',retry:true};}
  else if(c.old){state.offlineOutcome={status:'旧分配证据待复核',text:'任务已重分配，原记录只作待复核证据，不计为本次完成。',retry:true};}
  else if(state.inventoryCounted){state.offlineOutcome={status:'重复',text:'同一资产本轮已计入，保留本次证据，不再次增加完成数。',retry:true};}
  else{state.offlineOutcome={status:'已接受',text:'本条记录已计入一次。最近盘点日期仍需复核接受后更新；重复获取回执不会再次计数。',retry:true};state.accepted++;state.inventoryCounted=true;}
  state.local=Math.max(0,state.local-1);state.uploaded=state.local===0;
}

case 'M14':return head('我的','林晓 · 工号 DEMO-001 · 产品部')+panel('我的记录',`<div class="phone-actions">${go('M05','我的资产与借用')}${go('M04','我的申请 / 报修 / 历史')}${go('M06','部门公用资产')}${go('M12',`待上传 ${state.local} 条`)}</div>`)+panel('账号与绑定',`<p>已绑定企业员工身份</p><div class="phone-actions">${note('换绑','重新短信验证；管理员核验后可受审计解绑，不能直接为员工建立新的微信绑定。旧会话立即失效。','更换绑定')}${act('logout','退出登录')}</div>`)+banner('退出或解绑将清理本设备未同步数据；可先同步。停用立即撤销访问，不因资产未清保留账号。');
default:return '';
}}
function productNav(id,role){let nav=[['P02','工作台'],['P03','资产台账'],['P13','入库管理'],['P11','使用管理'],['P15','盘点管理'],['P17','报修与返厂'],['P20','报废管理'],['P23','统计分析']];if(role==='科技协助人员')nav=[['P18','我协助的报修']];else if(role.startsWith('系统管理员'))nav=[['P24','基础资料'],['P25','系统管理']];else if(role.startsWith('审计'))nav=[['P03','资产台账'],['P11','业务记录'],['P23','统计分析']];else if(role.includes('库管')&&!role.includes('管理员'))nav=nav.filter(n=>n[0]!=='P15');return nav.map(([p,n])=>`<button data-go="${p}" class="${p===id?'active':''}">${n}</button>`).join('');}
function render(){const p=byId[state.page];state.platform=p[0][0];$('#catalogItems').innerHTML=pages.filter(x=>x[0][0]===state.platform).map(x=>`<button data-go="${x[0]}" class="${x[0]===state.page?'active':''}" ${x[0]===state.page?'aria-current="page"':''}><span>${x[0]}</span>${x[1]}</button>`).join('');$('#pcTab').classList.toggle('active',state.platform==='P');$('#miniTab').classList.toggle('active',state.platform==='M');$('#pageMeta').textContent=p[0]+' / '+p[2];$('#reviewHeading').textContent=p[1];$('#reviewDescription').textContent=p[3];$('#phase').value=state.phase;$('#contextTools').innerHTML=(state.page==='P09'?note('审批冲突 · 独立评审示例','假设另一管理员已先批准：该申请已由陈琳于14:20处理，本次未保存，展示最新只读结果。此示例不是当前画布申请的真实状态。','预览审批竞争文案'):'')+(['M11','M12'].includes(state.page)?offlineReviewTools():'')+(state.page==='M11'?`<label for="invMode">识别示例</label><select id="invMode"><option value="normal" ${state.invMode==='normal'?'selected':''}>本任务资产</option><option value="difference" ${state.invMode==='difference'?'selected':''}>责任差异</option><option value="unknown" ${state.invMode==='unknown'?'selected':''}>离线未知</option><option value="outside" ${state.invMode==='outside'?'selected':''}>已登记任务外</option></select>`:'');if(['P02','P23'].includes(state.page))$('#reviewDescription').textContent+=' 汇总与抽样数字为固定虚构样例，不随领用情境联动。';if(state.page==='M11')$('#reviewDescription').textContent+=' 用301/302演示换房间，不限制产品可配置位置数。';if(['P24','P25'].includes(state.page))$('#reviewDescription').textContent+=' 本页配置入口按系统管理员权限展示；业务角色不自动获得。';$('#canvas').innerHTML=state.platform==='P'?`<div class="frame"><div class="appbar"><strong>示例企业 · 固定资产</strong><div class="right">${go('P26','消息')}${go('P06','后台任务')}<span>${p[4]}</span></div></div><div class="pcbody"><nav class="appnav" aria-label="产品导航">${productNav(p[0],p[4])}</nav><section class="content"><div class="crumb">${p[2]}</div>${pcContent(p[0])}</section></div></div>`:`<div class="mobile-layout"><div class="mobile frame"><div class="statusbar"><span>9:41</span><span>信号 ▰ 电量</span></div><div class="mobilehead"><button data-go="M02" aria-label="返回首页">‹</button><strong>${p[1]}</strong><span>···</span></div><section class="mobilecontent">${miniContent(p[0])}</section>${p[0]==='M01'?'':`<nav class="bottomnav" aria-label="小程序导航">${[['M02','首页'],['M08','扫码'],['M14','我的'],['M13','消息']].map(([a,b])=>`<button data-go="${a}" class="${a===p[0]?'active':''}">${b}</button>`).join('')}</nav>`}</div><aside class="annotation"><h2>此页视角</h2><p>${p[4]}</p><h2>评审关注</h2><p>${p[3]}</p><h2>结构原则</h2><ol><li>当前进度先于历史。</li><li>主要触控目标至少 44 px。</li><li>状态用文字表达。</li><li>提交后说明结果及下一步。</li></ol><h2>草图边界</h2><p>相机、短信、微信、附件与服务端均未连接。此处评审页面结构和局部示例动作。</p></aside></div>`;document.title=`${p[0]} ${p[1]} · 固定资产草图`;}
function navigate(id){if(!byId[id])return;state.page=id;history.replaceState(null,'','#'+id);render();window.scrollTo({top:0,behavior:'instant'});}
function toast(msg){$('#toast').textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3500);}
function dialog(title,body,callback,label='确认'){confirmAction=callback||null;$('#dialogTitle').textContent=title;$('#dialogBody').textContent=body;$('#dialogConfirm').hidden=!callback;$('#dialogConfirm').textContent=label;$('#dialog').showModal();}
$('#dialogClose').onclick=()=>$('#dialog').close();$('#dialogConfirm').onclick=()=>{const cb=confirmAction;$('#dialog').close();confirmAction=null;if(cb)cb();};
function phase(n){state.phase=n;state.received=n>=6?['101','102']:n===5?['101']:[];state.other=false;render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){navigate(b.dataset.go);return;}if(b.dataset.platform){navigate(b.dataset.platform==='P'?'P02':'M02');return;}if(b.dataset.note){dialog(b.dataset.noteTitle,b.dataset.note);return;}const a=b.dataset.action;if(!a)return;switch(a){
case 'reset':Object.assign(state,{phase:0,received:[],other:false,proxy:0,proxyContext:false,reapply:false,local:2,accepted:28,inventory:1,offlineCase:'normal',offlineOutcome:null,inventoryCounted:false,disposalMethod:'实物移交',uploaded:false,review:'open',scrap:false,disposed:false});render();toast('示例已重置为待管理员确认');break;
case 'login':if(!$('#account').value||!$('#password').value)toast('请填写账号和密码；此草图不验证真实账号');else dialog('登录结构示意','正式产品需服务端验证企业身份。此处可预览首次登录后的工作台。',()=>navigate('P02'),'查看工作台');break;
case 'bind':if(!$('#employeeNo').value||!$('#phoneNo').value||!$('#smsCode').value)toast('请填写工号、企业登记手机号与验证码');else dialog('绑定结构示意','这里没有发送或验证短信，不会建立真实绑定。',()=>navigate('M02'),'预览首页');break;
case 'approve':dialog('批准本次需求','办公笔记本 3 台 / 林晓 / 个人使用 / 产品部301。\n批准后交库管领取，不会自动分配、交出或建立个人责任。',()=>{phase(1);toast('示例已批准，可主动进入执行池');},'批准申请');break;
case 'reject':dialog('驳回申请','正式产品要求填写具体理由，保留已驳回记录；重新申请产生新版本和新的审批。此草图展示该分支说明。');break;
case 'claim':if(state.phase!==1)return;phase(2);navigate('P12');toast('示例：整单由你负责');break;
case 'other':if(state.phase<2)phase(2);state.other=!state.other;render();break;
case 'allocate':if(state.phase!==2||state.other)return;phase(3);toast('分配2台，1台无法满足；尚未交出');break;
case 'handover':if(state.phase!==3)return;dialog('记录实物交出','将本次2台资产记录为已交出待接收。\n正式保管仍保持原值，林晓确认收到后更新。',()=>phase(4),'记录交出');break;
case 'receive':{const ids=[...document.querySelectorAll('input[name=receive]:checked')].map(x=>x.value);if(!ids.length){$('#receiveError').innerHTML='<p class="inline-error">请先勾选已核对且实际收到的资产。</p>';return;}dialog('确认本次收到的资产',ids.map(v=>'FA-2026-00'+v).join('\n')+'\n接收后登记为个人使用 / 林晓 / 产品部301。',()=>{state.received=[...new Set([...state.received,...ids])];state.phase=state.received.length===2?6:5;render();toast('本地示例已接收，原申请保留履行结果');},'确认收到');break;}
case 'receive-error':dialog('未收到或资产不符','正式产品填写具体原因并通知当前库管核实；保留待交接与资产占用，不直接取消或释放库存。');break;
case 'help':toast('示例：已通知管理员，同一业务重复求助不新增工单');break;
case 'reapply':state.kind='领用';state.reapply=true;navigate('M03');break;
case 'submit-request':{if(['领用','借用'].includes(state.kind)){const n=Number($('#requestQty').value);if(!Number.isInteger(n)||n<1||state.reapply&&n>1){$('#formError').innerHTML='<p class="inline-error">数量须为正整数；从本无法满足行重申最多1件。</p>';return;}}if(['借用','延期'].includes(state.kind)&&$('#dueDate').value<='2026-09-06'){$('#formError').innerHTML='<p class="inline-error">预计归还日须晚于当前示例日期2026-09-06。</p>';return;}dialog('提交结构预览',state.reapply?'新申请关联原无法满足行，重新等待管理员确认；原行不重开。本草图展示来源关系，不生成真实单据。':'表单提交需要服务端校验当前权限、状态与范围。这里仅跳转固定的领用示例，不保存输入为真实申请。',()=>navigate('M04'),'查看进度草图');break;}
case 'request-return':state.kind='退库';state.reapply=false;navigate('M03');break;
case 'request-borrow-return':state.kind='归还';state.reapply=false;navigate('M03');break;
case 'request-repair':state.kind='报修';state.reapply=false;navigate('M03');break;
case 'request-scrap':state.kind='报废';state.reapply=false;navigate('M03');break;
case 'request-transfer':state.kind='调拨';state.reapply=false;navigate('M03');break;
case 'request-extend':state.kind='延期';state.reapply=false;navigate('M03');break;
case 'asset-tab':state.detailTab=Number(b.dataset.index);render();break;
case 'explain-tab':dialog('页签筛选规格','正式产品在同一列表按所选状态筛选，保留搜索条件和返回位置。本低保真页展示代表性内容。');break;
case 'acceptance-tab':dialog('验收模板差异',['归还：正常时关闭借用并入库；损坏关联维修；遗失不关闭借用。','退库：正常清空当前使用责任并入库；损坏按批准范围关联维修；缺件明确处理。','入库：只验收待入库且已批准的资产；核对身份、仓库、位置，完成后进入在库。'][Number(b.dataset.index)]);break;
case 'acceptance':{let v=$('#acceptanceResult').value;dialog(v+'验收结果预览',v==='正常'?'验收入库并关闭原借用；保留历史逾期。':v==='损坏'?'在已批准损坏处理范围内：验收、关闭借用、生成以在库为返回目标的维修并转移业务占用。':v==='遗失'?'归还明细为已转后续，关联报失待审批，借用仍未关闭；原归还页显示后续进度。':'缺少附件须明确补交、接受缺项或关联处理结果；不能静默结案。');break;}
case 'search':state.search=$('#assetSearch').value;render();if(!stockRows().some(r=>r.join('').includes(state.search)))toast('筛选无结果，可清除筛选');break;
case 'clear-search':state.search='';render();break;
case 'import':state.imported=true;render();toast('导入结果为本地示例，不创建真实卡片');break;
case 'publish':dialog('本批次尚不能发布','第14行缺寄出凭证，第15行须确认对应模块可承接。请由批次库管先补资料或整理独立可发布批次，再提交管理员核验。\n发布以确认批次为单位，相关卡片、承接、处理权和待办同时建立；任何失败不能留下部分结果。');break;
case 'review-transfer':dialog('转正式调拨','本次保存差异处理方式、后续单据和必要待办；后续调拨仍按既有审批执行。\n在调拨实际完成前，该位置差异保持处理中。',()=>{state.review='linked';render();},'预览关联结果');break;
case 'review-conflict':dialog('该差异已被处理','该位置差异已由陈琳于14:20转正式调拨，当前处理中。\n本次未保存；请查看最新结果。责任人差异仍单独未处理，不受覆盖。');break;
case 'room':dialog('切换实际房间','请确认已经进入另一个房间。后续记录使用新房间，已保存记录不改变。',()=>{state.inventory=state.inventory?0:1;render();},'确认切换房间');break;
case 'unknown-fact':state.invMode='difference';render();toast('实际责任可选择不确定并填写原因');break;
case 'save-inventory':if(!offlineCases[state.offlineCase].valid||offlineCases[state.offlineCase].sealed)return;state.local++;state.offlineOutcome=null;state.uploaded=false;render();toast('本地示例已记录，待上传；尚未增加已盘数');break;
case 'upload':receiveOffline();render();toast('已展示本条记录回执，同一回执不重复计数');break;
case 'proxy-submit':state.phase=5;state.received=['101'];state.proxy=1;state.proxyContext=true;render();break;
case 'proxy-review':state.proxyContext=true;navigate('P09');break;
case 'proxy-approve':state.proxy=2;state.proxyContext=false;navigate('P21');break;
case 'proxy-reject':state.proxy=0;state.proxyContext=false;navigate('P21');toast('示例驳回，原交接仍未完成');break;
case 'proxy-execute':dialog('执行异常代确认','核对已获批凭证、有效目标林晓及资产00102。执行成功后告知林晓实际责任；不要求再次接收。',()=>{state.proxy=3;state.phase=6;state.received=['101','102'];render();},'执行代确认');break;
case 'scrap':if(state.disposalMethod==='遗失核销'){dialog('不能提交','没有已确认遗失证据，不能按遗失核销处理。');break;}dialog('执行报废','资产 FA-2025-00412 / 1 台。批准范围和实物已核对。执行后已报废，并建立待处置责任；尚未实际处置。',()=>{state.scrap=true;render();},'预览已报废状态');break;
case 'dispose':if(state.disposalMethod==='遗失核销'){dialog('不能提交遗失核销','本资产没有已确认遗失证据，须返回原业务核实。');break;}dialog('处置结构示例','正式产品须有实际日期、方式、对象、经办人与关联凭证。本草图只预览已处置状态，不提交任何真实处置。',()=>{state.disposed=true;render();},'预览已处置状态');break;
case 'reassign':dialog('整单转派核对','原处理人赵明 → 新处理人周宁。整单处理权变更，批准范围及资产占用不变。旧页面未保存内容不能重放。',()=>toast('示例：转派完成，旧处理页立即只读'),'预览转派结果');break;
case 'restore-admin':state.adminRestored=true;render();toast('示例：恢复成员，保留原申请与时限');break;
case 'scan':toast('此页展示固定示例资产；相机和编码服务未连接');break;
case 'logout':dialog('退出登录',`本设备还有${state.local}条待上传示例记录。正式退出将清理本设备缓存；你可以取消，先回去同步。`,()=>{state.local=0;navigate('M01');},'确认退出');break;
}});
document.addEventListener('change',e=>{if(e.target.id==='phase'){phase(Number(e.target.value));state.proxyContext=false;}if(e.target.id==='requestKind'){state.kind=e.target.value;render();}if(e.target.id==='offlineCase'){setOfflineCase(e.target.value);render();}if(e.target.id==='disposalMethod'){state.disposalMethod=e.target.value;render();}if(e.target.id==='invMode'){state.invMode=e.target.value;render();}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId[id]){state.page=id;render();}});
if(byId[location.hash.slice(1)])state.page=location.hash.slice(1);render();
</script>
