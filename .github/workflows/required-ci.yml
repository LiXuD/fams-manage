name: FAMS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Development checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out candidate and commit history
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.7+6'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Install locked verification tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fams-ci-bin"
          cd "$RUNNER_TEMP/fams-ci-bin"
          curl -fsSL https://github.com/rtk-ai/rtk/releases/download/v1.1.0/rtk-x86_64-unknown-linux-musl.tar.gz -o rtk.tar.gz
          echo '9454ad1b9489daa57ab0a9f4ebe2faaf4dc82b8a0f26c9e5135151abd7c9378d  rtk.tar.gz' | sha256sum -c -
          tar -xzf rtk.tar.gz rtk
          rtk_path="$PWD/rtk"
          "$rtk_path" proxy curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.37.0/oasdiff_1.37.0_linux_amd64.tar.gz -o oasdiff.tar.gz
          echo 'eac87307d31d08c36800c58a409c247f1c5db37fbb72e2544402f22a87cbca3c  oasdiff.tar.gz' | "$rtk_path" proxy sha256sum -c -
          "$rtk_path" proxy tar -xzf oasdiff.tar.gz oasdiff
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Install locked project dependencies
        id: dependencies
        run: |
          rtk proxy npm install --global npm@11.16.0
          rtk proxy npm ci
          rtk proxy npm ci --prefix tools/git
          rtk proxy python3 -m pip install -r scripts/requirements-d6-02c.txt
      - name: Check all newly introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          commits=$(rtk proxy git rev-list --reverse "$BASE_SHA..$HEAD_SHA")
          test -n "$commits"
          message="$RUNNER_TEMP/fams-commit-message.txt"
          while IFS= read -r sha; do
            rtk proxy git show --no-patch --format=%B "$sha" > "$message"
            echo "Checking $sha"
            rtk proxy .githooks/commit-msg "$message"
          done <<< "$commits"
      - name: Check secrets and quality policies
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          rtk proxy python3 - <<'PY'
          import runpy
          gate = runpy.run_path("scripts/verify-d6-03a.py")
          gate["verify_tool_versions"]()
          gate["verify_static_configuration"]()
          gate["verify_current_head_secrets"]()
          PY
      - name: Check OpenAPI compatibility against the base
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          spec=contracts/fams-core-v1.yaml
          rtk proxy git show "$BASE_SHA:$spec" > "$RUNNER_TEMP/fams-base-contract.yaml"
          normalized_base="$RUNNER_TEMP/fams-base-normalized.yaml"
          rtk proxy python3 scripts/normalize-ci-contract.py "$RUNNER_TEMP/fams-base-contract.yaml" "$normalized_base"
          rtk proxy oasdiff breaking --fail-on ERR "$normalized_base" "$spec"
      - name: Validate contract, examples and generated types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: rtk proxy python3 -u scripts/verify-d6-02c.py
      - name: Verify Java, MySQL, clients and recovery
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: rtk proxy python3 -u scripts/verify-product-development.py

  required-ci:
    name: required-ci
    runs-on: ubuntu-24.04
    needs: checks
    if: ${{ always() }}
    steps:
      - name: Require successful execution
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
