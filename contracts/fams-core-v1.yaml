      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimInboundRequest'
      responses:
        '200':
          description: Receipt with the current executor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundReceipt'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inbound-receipts/{receiptId}/acceptance:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    post:
      tags: [Inbound]
      operationId: acceptInboundReceipt
      summary: Execute an approved receipt under its claimed warehouse lock.
      x-business-write: true
      x-actor:
        required: true
        roles: [WAREHOUSE]
      x-version:
        required: true
        precondition: Current executor, approved scope, location, and receipt version match.
      x-transaction:
        boundary: Validate all rows, create assets, transition receipt, release executor lock, and audit atomically.
      x-audit-event:
        event: INBOUND_RECEIPT_ACCEPTED
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundAcceptanceRequest'
      responses:
        '200':
          description: Completed inbound receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundReceipt'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same key and payload returns the original result; a different payload conflicts.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit CSRF token paired with the secure session cookie.
      schema:
        type: string
        minLength: 16
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      description: Optimistic version precondition for an existing aggregate.
      schema:
        type: integer
        format: int64
        minimum: 0
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ParameterId:
      name: parameterId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    WarehouseQuery:
      name: warehouseId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AssetStatus'
    UsageModeQuery:
      name: usageMode
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UsageMode'
    InboundStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InboundStatus'
  responses:
    BadRequest:
      description: Request validation or state precondition failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Session is absent, expired, or disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role or data/business relation is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist in the caller's visible scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version, uniqueness, idempotency, or persistent lock conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Id:
      type: string
      pattern: '^[0-9]+$'
      description: Signed MySQL BIGINT represented as a decimal JSON string.
      example: '9007199254740993'
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Decimal money text with explicit two-place scale.
      example: '1200.00'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          writeOnly: true
    SessionResponse:
      type: object
      required: [sessionId, csrfToken, expiresAt, requiresInitialPasswordChange]
      properties:
        sessionId:
          type: string
          format: uuid
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        requiresInitialPasswordChange:
          type: boolean
    CurrentUser:
      type: object
      required: [id, username, status, roles, requiresInitialPasswordChange]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Role'
        requiresInitialPasswordChange:
          type: boolean
    PermissionSnapshot:
      type: object
      required: [userId, permissions, dataScopes]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        permissions:
          type: array
          items:
            type: string
        dataScopes:
          type: array
          items:
            type: string
    OrganizationInput:
      type: object
      required: [code, name, status]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: '#/components/schemas/ReferenceStatus'
        parentId:
          $ref: '#/components/schemas/Id'
    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationInput'
        - type: object
          required: [id, version]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
    EmployeeInput:
      type: object
      required: [employeeNo, displayName, organizationId, status]
      properties:
        employeeNo:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        organizationId:
          $ref: '#/components/schemas/Id'
        phone:
          type: string
          maxLength: 32
        status:
          $ref: '#/components/schemas/ReferenceStatus'
    Employee:
      allOf:
        - $ref: '#/components/schemas/EmployeeInput'
        - type: object
          required: [id, version]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
    CategoryInput:
      type: object
      required: [code, name, status]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        parentId:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/ReferenceStatus'
    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          required: [id, version]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
    WarehouseInput:
      type: object
      required: [code, name, status]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: '#/components/schemas/ReferenceStatus'
    Warehouse:
      allOf:
        - $ref: '#/components/schemas/WarehouseInput'
        - type: object
          required: [id, version]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
    LocationInput:
      type: object
      required: [warehouseId, code, name, status]
      properties:
        warehouseId:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: '#/components/schemas/ReferenceStatus'
    Location:
      allOf:
        - $ref: '#/components/schemas/LocationInput'
        - type: object
          required: [id, version]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
    BrandInput:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: '#/components/schemas/ReferenceStatus'
    Brand:
      allOf:
        - $ref: '#/components/schemas/BrandInput'
        - type: object
          required: [id, version]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
    VendorInput:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: '#/components/schemas/ReferenceStatus'
        contact:
          type: string
          maxLength: 128
    Vendor:
      allOf:
        - $ref: '#/components/schemas/VendorInput'
        - type: object
          required: [id, version]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
    NumberingRuleInput:
      type: object
      required: [prefix, nextNumber, width, status]
      properties:
        prefix:
          type: string
          minLength: 1
          maxLength: 16
        nextNumber:
          type: integer
          format: int64
          minimum: 1
        width:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
        status:
          $ref: '#/components/schemas/ReferenceStatus'
    NumberingRule:
      allOf:
        - $ref: '#/components/schemas/NumberingRuleInput'
        - type: object
          required: [id, version]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
    BusinessParameterInput:
      type: object
      required: [key, value, status]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
        value:
          type: string
          minLength: 1
          maxLength: 512
        status:
          $ref: '#/components/schemas/ReferenceStatus'
    BusinessParameter:
      allOf:
        - $ref: '#/components/schemas/BusinessParameterInput'
        - type: object
          required: [id, version]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
    AssetInput:
      type: object
      required: [assetCode, name, categoryId, status, usageMode, quantity, businessDate]
      properties:
        assetCode:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 256
        categoryId:
          $ref: '#/components/schemas/Id'
        brandId:
          $ref: '#/components/schemas/Id'
        vendorId:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/AssetStatus'
        abnormalStatus:
          $ref: '#/components/schemas/AbnormalStatus'
        usageMode:
          $ref: '#/components/schemas/UsageMode'
        responsibleEmployeeId:
          $ref: '#/components/schemas/Id'
        warehouseId:
          $ref: '#/components/schemas/Id'
        locationId:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          format: int32
          minimum: 0
        businessDate:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        serialNumbers:
          type: array
          items:
            type: string
          uniqueItems: true
        note:
          type: string
          nullable: true
    Asset:
      allOf:
        - $ref: '#/components/schemas/AssetInput'
        - type: object
          required: [id, version, qrAccessId, createdAt, updatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
            qrAccessId:
              type: string
              minLength: 20
              maxLength: 128
              description: Opaque random identifier; never an encoded business id.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AssetCopyRequest:
      type: object
      required: [assetCode, businessDate]
      properties:
        assetCode:
          type: string
          minLength: 1
          maxLength: 64
        businessDate:
          type: string
          format: date
        note:
          type: string
          nullable: true
    LabelPrintRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [REPRINT, REPLACE]
    LabelPrintResult:
      type: object
      required: [assetId, qrAccessId, mode, printedAt]
      properties:
        assetId:
          $ref: '#/components/schemas/Id'
        qrAccessId:
          type: string
        mode:
          type: string
          enum: [REPRINT, REPLACE]
        printedAt:
          type: string
          format: date-time
    InboundReceiptInput:
      type: object
      required: [receiptNumber, warehouseId, receiptDate, items]
      properties:
        receiptNumber:
          type: string
          minLength: 1
          maxLength: 64
        warehouseId:
          $ref: '#/components/schemas/Id'
        receiptDate:
          type: string
          format: date
        vendorId:
          $ref: '#/components/schemas/Id'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InboundItem'
    InboundReceipt:
      allOf:
        - $ref: '#/components/schemas/InboundReceiptInput'
        - type: object
          required: [id, version, status, createdAt, updatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
            status:
              $ref: '#/components/schemas/InboundStatus'
            approvedScope:
              type: string
              description: Frozen approval scope snapshot.
            currentExecutorId:
              $ref: '#/components/schemas/Id'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    InboundItem:
      type: object
      required: [lineNo, assetName, quantity]
      properties:
        lineNo:
          type: integer
          format: int32
          minimum: 1
        assetName:
          type: string
          minLength: 1
          maxLength: 256
        categoryId:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          format: int32
          minimum: 1
        amount:
          $ref: '#/components/schemas/Money'
    InboundDecisionRequest:
      type: object
      required: [decision, comment]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comment:
          type: string
          minLength: 1
          maxLength: 1000
    ClaimInboundRequest:
      type: object
      required: [warehouseId]
      properties:
        warehouseId:
          $ref: '#/components/schemas/Id'
    InboundAcceptanceRequest:
      type: object
      required: [receiptDate, locationId, items]
      properties:
        receiptDate:
          type: string
          format: date
        locationId:
          $ref: '#/components/schemas/Id'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AcceptanceItem'
    AcceptanceItem:
      type: object
      required: [lineNo, quantity]
      properties:
        lineNo:
          type: integer
          format: int32
          minimum: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
        serialNumbers:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    AuditEvent:
      type: object
      required: [eventId, eventType, actorId, occurredAt]
      properties:
        eventId:
          $ref: '#/components/schemas/Id'
        eventType:
          type: string
        actorId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          type: string
          format: date-time
        aggregateId:
          $ref: '#/components/schemas/Id'
    PageMeta:
      type: object
      required: [page, pageSize, totalElements]
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
    PageOrganization:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Organization' } } } }]
    PageEmployee:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Employee' } } } }]
    PageCategory:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Category' } } } }]
    PageWarehouse:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Warehouse' } } } }]
    PageLocation:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Location' } } } }]
    PageBrand:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Brand' } } } }]
    PageVendor:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Vendor' } } } }]
    PageNumberingRule:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/NumberingRule' } } } }]
    PageBusinessParameter:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BusinessParameter' } } } }]
    PageAsset:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Asset' } } } }]
    PageLocationEntry:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Location' } } } }]
    PageInboundReceipt:
      allOf: [{ $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/InboundReceipt' } } } }]
    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED, LOCKED]
    ReferenceStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    Role:
      type: string
      enum: [SYSTEM_ADMIN, ASSET_ADMIN, WAREHOUSE, TECH, AUDIT, EMPLOYEE]
    AssetStatus:
      type: string
      enum: [DRAFT, PENDING_INBOUND, IN_STOCK, IN_USE, BORROWED, UNDER_REPAIR, FACTORY_REPAIR, PENDING_DISPOSAL, DISPOSED]
    AbnormalStatus:
      type: string
      enum: [NORMAL, SEARCHING, LOST]
    UsageMode:
      type: string
      enum: [PERSONAL, SHARED]
    InboundStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, REJECTED, APPROVED, PROCESSING, COMPLETED]
