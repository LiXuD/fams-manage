        roles: [WAREHOUSE_OPERATOR]
      x-version:
        required: true
        precondition: >-
          If-Match-Version must equal the WAITING_WAREHOUSE_CLAIM receipt version and
          current processing ownership must still be absent.
      x-transaction:
        boundary: >-
          Atomically compare the receipt version and empty ownership, persist the one
          current processor for the whole receipt, close the shared active claim todo,
          compute the first-execution deadline, advance to WAREHOUSE_PROCESSING, and audit.
      x-audit-event:
        event: INBOUND_WAREHOUSE_CLAIMED
      x-error-codes:
