    Id:
      type: string
      pattern: '^[0-9]+$'
      description: Signed MySQL BIGINT represented as a decimal JSON string.
      example: '9007199254740993'
    Instant:
      type: string
      format: date-time
      description: Java Instant on the wire as an RFC 3339 value normalized to UTC Z.
      example: '2026-09-13T08:15:00Z'
    BusinessDate:
      type: string
      format: date
      description: Calendar date with no timezone conversion.
      example: '2026-09-13'
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Decimal money text with explicit two-place scale.
      example: '1200.00'
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    MiniPhoneCorrectionRequest:
      type: object
      additionalProperties: false
      required: [phone, verificationMethod, reason]
      properties:
        phone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
        verificationMethod: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    MiniPhoneCorrectionResult:
      type: object
      additionalProperties: false
      required: [employeeId, version]
      properties:
        employeeId: { $ref: '#/components/schemas/Id' }
        version: { type: integer, format: int64, minimum: 0 }
    MiniBindingChallengeRequest:
      type: object
      additionalProperties: false
      required: [code, employeeNo, phone, deviceId, action]
      properties:
        code: { type: string, minLength: 1, maxLength: 256 }
        employeeNo: { type: string, minLength: 1, maxLength: 64 }
        phone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
        deviceId: { type: string, format: uuid }
        action: { type: string, enum: [BIND, REBIND] }
    MiniBindingChallenge:
      type: object
      additionalProperties: false
      required: [challengeToken, expiresAt, resendAfterSeconds]
      properties:
        challengeToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time }
        resendAfterSeconds: { type: integer, minimum: 60 }
    MiniBindingVerifyRequest:
      type: object
      additionalProperties: false
      required: [code, challengeToken, deviceId, otp]
      properties:
        code: { type: string, minLength: 1, maxLength: 256 }
        challengeToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        deviceId: { type: string, format: uuid }
        otp: { type: string, pattern: '^[0-9]{6}$' }
    MiniBindingResult:
      type: object
      additionalProperties: false
      required: [accountId, bindingId, bindingVersion]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        bindingId: { $ref: '#/components/schemas/Id' }
        bindingVersion: { type: integer, format: int64, minimum: 0 }
    MiniUnbindRequest:
      type: object
      additionalProperties: false
      required: [reason, verificationMethod]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        verificationMethod: { type: string, minLength: 1, maxLength: 128 }
    MiniBindingSupport:
      type: object
      additionalProperties: false
      required: [supportText]
      properties:
        supportText: { type: string, maxLength: 500 }
    MiniLoginRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 256 }
    MiniSessionGrant:
      type: object
      additionalProperties: false
      required: [bindingStatus, sessionToken, accountId, bindingId, idleExpiresAt, absoluteExpiresAt]
      properties:
        bindingStatus: { type: string, enum: [BOUND, UNBOUND] }
        sessionToken: { type: string, nullable: true, pattern: '^[A-Za-z0-9_-]{43}$' }
        accountId: { type: string, nullable: true, pattern: '^[1-9][0-9]*$' }
        bindingId: { type: string, nullable: true, pattern: '^[1-9][0-9]*$' }
        idleExpiresAt: { type: string, format: date-time, nullable: true }
        absoluteExpiresAt: { type: string, format: date-time, nullable: true }
    MiniSessionView:
      type: object
      additionalProperties: false
      required: [bindingStatus, accountId, bindingId, bindingVersion, idleExpiresAt, absoluteExpiresAt]
      properties:
        bindingStatus: { type: string, enum: [BOUND] }
        accountId: { $ref: '#/components/schemas/Id' }
        bindingId: { $ref: '#/components/schemas/Id' }
        bindingVersion: { type: integer, format: int64, minimum: 0 }
        idleExpiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }
