    LocationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: PATCH fields; status changes use the explicit enable or disable operation.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/LocationType'
        parentLocation:
          $ref: '#/components/schemas/CatalogReference'
          description: Omit to retain the parent; id and version are required when supplied.
        warehouse:
          $ref: '#/components/schemas/CatalogReference'
          description: Omit to retain the warehouse; id and version are required when supplied.
        description:
          type: string
          maxLength: 500
    Location:
      type: object
      additionalProperties: false
      required: [id, code, name, type, status, version]
