openapi: 3.0.4
info:
  title: FAMS core first-slice contract
  version: 1.0.0
  description: >-
    Public wire foundation and authentication boundary for the first FAMS design
    package. Master data, asset, and inbound paths are added in later bounded
    contract increments.
servers:
  - url: /api/v1
    description: Versioned FAMS API root.
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: System-account authentication and session boundaries.
  - name: MasterData
    description: Organization, employee, and system-account configuration boundaries.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FAMS_SESSION
      description: Secure, HttpOnly session cookie; bearer tokens are not accepted.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token paired with the session cookie.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same key and payload returns the original result; a different payload conflicts.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit CSRF token paired with the secure session cookie.
      schema:
        type: string
        minLength: 16
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      description: Optimistic version precondition for an existing aggregate.
      schema:
        type: integer
        format: int64
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadRequest:
      description: Request validation or state precondition failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Session is absent, expired, or disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role, CSRF, or data/business relation is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version, uniqueness, idempotency, or lock conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Login or other request rate limit has been reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Id:
      type: string
      pattern: '^[0-9]+$'
      description: Signed MySQL BIGINT represented as a decimal JSON string.
      example: '9007199254740993'
    Instant:
      type: string
      format: date-time
      description: Java Instant on the wire as an RFC 3339 value normalized to UTC Z.
      example: '2026-09-13T08:15:00Z'
    BusinessDate:
      type: string
      format: date
      description: Calendar date with no timezone conversion.
      example: '2026-09-13'
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Decimal money text with explicit two-place scale.
      example: '1200.00'
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    AuditEvent:
      type: object
      required: [eventId, eventType, actorId, occurredAt]
      properties:
        eventId:
          $ref: '#/components/schemas/Id'
        eventType:
          type: string
        actorId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          $ref: '#/components/schemas/Instant'
        aggregateId:
          $ref: '#/components/schemas/Id'
    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED, LOCKED]
    Role:
      type: string
      enum: [EMPLOYEE, DEPARTMENT_ASSET_MANAGER, ASSET_ADMIN, WAREHOUSE_OPERATOR, TECH_ASSISTANT, AUDIT_READ_ONLY, SYSTEM_ADMIN]
    ReferenceStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    UsageMode:
      type: string
      enum: [PERSONAL, SHARED]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          writeOnly: true
    SessionResponse:
      type: object
      required: [csrfToken, idleExpiresAt, absoluteExpiresAt, requiresInitialPasswordChange, user]
      properties:
        csrfToken:
          type: string
        idleExpiresAt:
          $ref: '#/components/schemas/Instant'
        absoluteExpiresAt:
          $ref: '#/components/schemas/Instant'
        requiresInitialPasswordChange:
          type: boolean
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, username, status, roles, requiresInitialPasswordChange]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Role'
        requiresInitialPasswordChange:
          type: boolean
    PermissionSnapshot:
      type: object
      required: [userId, permissions, dataScopes]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        permissions:
          type: array
          items:
            type: string
        dataScopes:
          type: array
          items:
            type: string
    OrganizationInput:
      type: object
      required: [code, name, status]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        parentId:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/ReferenceStatus'
    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationInput'
        - type: object
          required: [id, version, createdAt, updatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
            createdAt:
              $ref: '#/components/schemas/Instant'
            updatedAt:
              $ref: '#/components/schemas/Instant'
    PageOrganization:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Organization'
    DisableOrganizationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    EmployeeInput:
      type: object
      required: [employeeNo, displayName, organizationId, status]
      properties:
        employeeNo:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        organizationId:
          $ref: '#/components/schemas/Id'
        phone:
          type: string
          maxLength: 32
          x-sensitive: true
        status:
          $ref: '#/components/schemas/ReferenceStatus'
    Employee:
      allOf:
        - $ref: '#/components/schemas/EmployeeInput'
        - type: object
          required: [id, version, createdAt, updatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              type: integer
              format: int64
              minimum: 0
            createdAt:
              $ref: '#/components/schemas/Instant'
            updatedAt:
              $ref: '#/components/schemas/Instant'
    PageEmployee:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Employee'
    DisableEmployeeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Establish a session with a system account.
      security: []
      x-business-write: false
      x-exception-rationale: Version and idempotency are N/A because authentication has no existing business aggregate; the login attempt is still audited.
      x-non-applicable: [version, idempotency]
      x-transaction:
        boundary: Create or rotate the session and record the security audit atomically.
      x-audit-event:
        event: AUTH_LOGIN_ATTEMPT
      x-security-failure-policy: Unknown, disabled, locked, and wrong-password attempts use the same externally visible failure shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session metadata.
          headers:
            Set-Cookie:
              description: FAMS_SESSION cookie with Secure; HttpOnly; SameSite=Lax; Path=/api attributes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password:
    post:
      tags: [Auth]
      operationId: changeInitialPassword
      summary: Complete the mandatory initial password change for an enabled session.
      x-business-write: true
      x-actor:
        required: true
        source: Current enabled session user.
      x-version:
        required: true
        precondition: Current enabled session is valid and the initial password change is still required.
      x-transaction:
        boundary: Rotate the session, invalidate the old session, update password state, and audit atomically.
      x-audit-event:
        event: AUTH_INITIAL_PASSWORD_CHANGED
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Rotated SessionResponse; the old session is invalidated after the initial password change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Read the current system account and role snapshot.
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/permissions:
    get:
      tags: [Auth]
      operationId: getMyPermissions
      summary: Read effective permissions and data scope.
      responses:
        '200':
          description: Effective permission snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSnapshot'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session.
      x-business-write: false
      x-exception-rationale: Version and idempotency are N/A because logout invalidates the session rather than changing a business aggregate.
      x-non-applicable: [version, idempotency]
      x-transaction:
        boundary: Invalidate the current session, clear its cookie, and record the security audit atomically.
      x-audit-event:
        event: AUTH_LOGOUT
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session ended and the FAMS_SESSION cookie is cleared with Max-Age=0.
          headers:
            Set-Cookie:
              description: FAMS_SESSION=; Max-Age=0; Secure; HttpOnly; SameSite=Lax; Path=/api.
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organizations:
    get:
      tags: [MasterData]
      operationId: listOrganizations
      summary: List organizations with one-based stable pagination.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Organization page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrganization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MasterData]
      operationId: createOrganization
      summary: Create an organization tree node.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: Parent organization version is current when supplied.
      x-transaction:
        boundary: Insert organization and its audit event atomically.
      x-audit-event:
        event: ORGANIZATION_CREATED
      x-error-codes: [ORGANIZATION_CODE_CONFLICT, ORGANIZATION_PARENT_NOT_FOUND, ORGANIZATION_CYCLE]
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Created organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [MasterData]
      operationId: getOrganization
      summary: Read an organization tree node.
      responses:
        '200':
          description: Organization details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MasterData]
      operationId: updateOrganization
      summary: Update an organization without rewriting asset responsibility.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the stored organization version.
      x-transaction:
        boundary: Conditional tree update and audit event are one short transaction.
      x-audit-event:
        event: ORGANIZATION_UPDATED
      x-error-codes: [ORGANIZATION_CODE_CONFLICT, ORGANIZATION_PARENT_NOT_FOUND, ORGANIZATION_CYCLE, ORGANIZATION_HAS_RESPONSIBILITY]
      x-invariants: Parent changes must be cycle-safe; changing an organization never silently rewrites asset responsibility or asset records.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{organizationId}/disable:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [MasterData]
      operationId: disableOrganization
      summary: Disable an organization only after dependent responsibility is resolved.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the stored organization version.
      x-transaction:
        boundary: Validate dependencies, disable organization, and audit atomically.
      x-audit-event:
        event: ORGANIZATION_DISABLED
      x-error-codes: [ORGANIZATION_HAS_ASSETS, ORGANIZATION_HAS_RESPONSIBILITY, ORGANIZATION_ALREADY_DISABLED]
      x-invariants: Disable is rejected while active assets or responsibility relations depend on the organization; history is retained.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableOrganizationRequest'
      responses:
        '200':
          description: Disabled organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees:
    get:
      tags: [MasterData]
      operationId: listEmployees
      summary: List employees with sensitive fields protected by permission.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Employee page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEmployee'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MasterData]
      operationId: createEmployee
      summary: Create an employee and its system-account relation seed.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN, ASSET_ADMIN]
      x-version:
        required: true
        precondition: Organization version is current and employee number is not reused.
      x-transaction:
        boundary: Insert employee relation and audit event atomically.
      x-audit-event:
        event: EMPLOYEE_CREATED
      x-error-codes: [EMPLOYEE_NO_CONFLICT, EMPLOYEE_ORGANIZATION_NOT_FOUND]
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '201':
          description: Created employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [MasterData]
      operationId: getEmployee
      summary: Read an employee and permission-filtered contact fields.
      responses:
        '200':
          description: Employee details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MasterData]
      operationId: updateEmployee
      summary: Update employee relations without changing asset responsibility.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN, ASSET_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the stored employee version.
      x-transaction:
        boundary: Conditional employee update and audit event are one short transaction.
      x-audit-event:
        event: EMPLOYEE_UPDATED
      x-error-codes: [EMPLOYEE_NO_CONFLICT, EMPLOYEE_ORGANIZATION_NOT_FOUND]
      x-invariants: Transfer changes the employee relation only; it never rewrites current asset responsibility, and the old relation remains in history.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '200':
          description: Updated employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees/{employeeId}/disable:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    post:
      tags: [MasterData]
      operationId: disableEmployee
      summary: Disable an employee and revoke access immediately while retaining history.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN, ASSET_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the stored employee version.
      x-transaction:
        boundary: Disable employee, revoke sessions and upload permission, retain history, and audit atomically.
      x-audit-event:
        event: EMPLOYEE_DISABLED
      x-error-codes: [EMPLOYEE_ALREADY_DISABLED, EMPLOYEE_HAS_PENDING_SECURITY_ACTION]
      x-side-effects: Disabling immediately revokes sessions and upload permission; employee, asset responsibility, and operation history are retained.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableEmployeeRequest'
      responses:
        '200':
          description: Disabled employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
