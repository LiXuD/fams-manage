          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MasterData]
      operationId: updateCategory
      summary: Rename or disable a category without deleting history.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match version must equal the stored category version.
      x-transaction:
        boundary: Conditional category update and audit event are one transaction.
      x-audit-event:
        event: CATEGORY_UPDATED
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /warehouses:
    get:
      tags: [MasterData]
      operationId: listWarehouses
      summary: List warehouses.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Warehouse page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageWarehouse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MasterData]
      operationId: createWarehouse
      summary: Create a warehouse.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: Warehouse code is unique and not reused.
      x-transaction:
        boundary: Insert warehouse and audit event atomically.
      x-audit-event:
        event: WAREHOUSE_CREATED
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseInput'
      responses:
        '201':
          description: Created warehouse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /warehouses/{warehouseId}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      tags: [MasterData]
      operationId: getWarehouse
      summary: Read a warehouse.
      responses:
        '200':
          description: Warehouse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MasterData]
      operationId: updateWarehouse
      summary: Update or disable a warehouse only when no assets depend on it.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match version must equal the stored warehouse version.
      x-transaction:
        boundary: Conditional warehouse update and audit event are one transaction.
      x-audit-event:
        event: WAREHOUSE_UPDATED
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseInput'
      responses:
        '200':
          description: Updated warehouse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /locations:
    get:
      tags: [MasterData]
      operationId: listLocations
      summary: List locations in a warehouse.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/WarehouseQuery'
      responses:
        '200':
          description: Location page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageLocation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MasterData]
      operationId: createLocation
      summary: Create a warehouse location.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: Warehouse version is current and location code is unique.
      x-transaction:
        boundary: Insert location and audit event atomically.
      x-audit-event:
        event: LOCATION_CREATED
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: Created location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /locations/{locationId}:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    get:
      tags: [MasterData]
      operationId: getLocation
      summary: Read a location.
      responses:
        '200':
          description: Location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MasterData]
      operationId: updateLocation
      summary: Update or disable a location when no assets depend on it.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match version must equal the stored location version.
      x-transaction:
        boundary: Conditional location update and audit event are one transaction.
      x-audit-event:
        event: LOCATION_UPDATED
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '200':
          description: Updated location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /brands:
    get:
      tags: [MasterData]
      operationId: listBrands
      summary: List brands.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Brand page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBrand'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MasterData]
      operationId: createBrand
      summary: Create a brand.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: Brand name is unique.
      x-transaction:
        boundary: Insert brand and audit event atomically.
      x-audit-event:
        event: BRAND_CREATED
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '201':
          description: Created brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /brands/{brandId}:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [MasterData]
      operationId: getBrand
      summary: Read a brand.
      responses:
        '200':
          description: Brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MasterData]
      operationId: updateBrand
      summary: Rename or disable a brand without deleting history.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match version must equal the stored brand version.
      x-transaction:
        boundary: Conditional brand update and audit event are one transaction.
      x-audit-event:
        event: BRAND_UPDATED
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '200':
          description: Updated brand.
          content:
            application/json:
