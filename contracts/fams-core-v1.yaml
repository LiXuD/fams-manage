          $ref: '#/components/schemas/ReferenceStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        description:
          type: string
    PageLocation:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Location'
    LocationActiveReference:
      type: object
      additionalProperties: false
      required: [id, code, name, version]
      description: Minimal active selector; office locations may omit warehouse.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        type:
          $ref: '#/components/schemas/LocationType'
        warehouse:
          $ref: '#/components/schemas/CatalogReference'
        parentLocation:
          $ref: '#/components/schemas/CatalogReference'
    LocationActiveReferencePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LocationActiveReference'
    NumberingTarget:
      type: string
      enum: [ASSET, INBOUND_RECEIPT]
    NumberingMode:
      type: string
      enum: [ENTERPRISE, CATEGORY_PREFIX]
    NumberingDatePart:
      type: string
      enum: [NONE, YYYY, YYYYMM, YYYYMMDD]
    NumberingRuleCreateRequest:
      type: object
      additionalProperties: false
      required: [code, target, mode, datePart, sequenceLength]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Permanent rule identifier; a disabled rule code cannot be reused.
        target:
          $ref: '#/components/schemas/NumberingTarget'
        mode:
          $ref: '#/components/schemas/NumberingMode'
          description: ENTERPRISE uses one company namespace; CATEGORY_PREFIX reads current category prefixes.
        fixedPrefix:
          type: string
          maxLength: 32
          description: >-
            Optional fixed prefix for ENTERPRISE. CATEGORY_PREFIX is only valid for
            ASSET, must omit fixedPrefix, and reads the active AssetCategory.numberingPrefix.
        datePart:
          $ref: '#/components/schemas/NumberingDatePart'
        sequenceLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
    NumberingRuleUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: PATCH fields; rule code and status changes use dedicated operations.
      properties:
        target:
          $ref: '#/components/schemas/NumberingTarget'
        mode:
          $ref: '#/components/schemas/NumberingMode'
        fixedPrefix:
          type: string
          maxLength: 32
          description: >-
            Optional only for ENTERPRISE. CATEGORY_PREFIX is only valid for ASSET,
            must omit fixedPrefix, and reads the active AssetCategory.numberingPrefix.
        datePart:
          $ref: '#/components/schemas/NumberingDatePart'
        sequenceLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
    NumberingRule:
      type: object
      additionalProperties: false
      required: [id, code, target, mode, datePart, sequenceLength, status, version]
      description: >-
        A permanent numbering-rule identity. Rule changes apply only to allocations
        after the change; existing asset codes and business numbers never change.
        Backend allocation is internal to a short transaction, and a failed or
        cancelled batch may leave a gap that is never reused; clients cannot specify
        codes or reserve a number through preview.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        target:
          $ref: '#/components/schemas/NumberingTarget'
        mode:
          $ref: '#/components/schemas/NumberingMode'
        fixedPrefix:
          type: string
          description: >-
            Present only for ENTERPRISE. CATEGORY_PREFIX is only valid for ASSET,
            omits fixedPrefix, and derives its prefix from the active
            AssetCategory.numberingPrefix.
        datePart:
          $ref: '#/components/schemas/NumberingDatePart'
        sequenceLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
        status:
          $ref: '#/components/schemas/ReferenceStatus'
        version:
          type: integer
          format: int64
          minimum: 0
    PageNumberingRule:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NumberingRule'
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Establish a session with a system account.
      security: []
      x-business-write: false
      x-exception-rationale: Version and idempotency are N/A because authentication has no existing business aggregate; the login attempt is still audited.
      x-non-applicable: [version, idempotency]
      x-transaction:
        boundary: Create or rotate the session and record the security audit atomically.
      x-audit-event:
        event: AUTH_LOGIN_ATTEMPT
      x-security-failure-policy: Unknown, disabled, locked, and wrong-password attempts use the same externally visible failure shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session metadata.
          headers:
            Set-Cookie:
              description: FAMS_SESSION cookie with Secure; HttpOnly; SameSite=Lax; Path=/api attributes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password:
    post:
      tags: [Auth]
      operationId: changeInitialPassword
      summary: Complete the mandatory initial password change for an enabled session.
      x-business-write: true
      x-actor:
        required: true
        source: Current enabled session user.
      x-version:
        required: true
        precondition: Current enabled session is valid and the initial password change is still required.
      x-transaction:
        boundary: Rotate the session, invalidate the old session, update password state, and audit atomically.
      x-audit-event:
        event: AUTH_INITIAL_PASSWORD_CHANGED
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Rotated SessionResponse; the old session is invalidated after the initial password change.
          headers:
            Set-Cookie:
              description: Rotated FAMS_SESSION cookie with Secure; HttpOnly; SameSite=Lax; Path=/api attributes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Read the current system account and role snapshot.
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/permissions:
    get:
      tags: [Auth]
      operationId: getMyPermissions
      summary: Read effective permissions and data scope.
      responses:
        '200':
          description: Effective permission snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSnapshot'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session.
      x-business-write: false
      x-exception-rationale: Version and idempotency are N/A because logout invalidates the session rather than changing a business aggregate.
      x-non-applicable: [version, idempotency]
      x-transaction:
        boundary: Invalidate the current session, clear its cookie, and record the security audit atomically.
      x-audit-event:
        event: AUTH_LOGOUT
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session ended and the FAMS_SESSION cookie is cleared with Max-Age=0.
          headers:
            Set-Cookie:
              description: FAMS_SESSION=; Max-Age=0; Secure; HttpOnly; SameSite=Lax; Path=/api.
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organizations:
    get:
      tags: [MasterData]
      operationId: listOrganizations
      summary: List organizations with one-based stable pagination.
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Organization page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrganization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MasterData]
      operationId: createOrganization
      summary: Create an organization tree node.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: Parent organization version is current when supplied.
      x-transaction:
        boundary: Insert organization and its audit event atomically.
      x-audit-event:
        event: ORGANIZATION_CREATED
      x-error-codes: [ORGANIZATION_CODE_CONFLICT, ORGANIZATION_PARENT_NOT_FOUND, ORGANIZATION_CYCLE]
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCreateRequest'
      responses:
        '201':
          description: Created organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [MasterData]
      operationId: getOrganization
      summary: Read an organization tree node.
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      responses:
        '200':
          description: Organization details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MasterData]
      operationId: updateOrganization
      summary: Update an organization without rewriting asset responsibility.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the stored organization version.
      x-transaction:
        boundary: Conditional tree update and audit event are one short transaction.
      x-audit-event:
        event: ORGANIZATION_UPDATED
      x-error-codes: [ORGANIZATION_CODE_CONFLICT, ORGANIZATION_PARENT_NOT_FOUND, ORGANIZATION_CYCLE, ORGANIZATION_HAS_RESPONSIBILITY]
      x-invariants: Parent changes must be cycle-safe; changing an organization never silently rewrites asset responsibility or asset records.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUpdateRequest'
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{organizationId}/disable:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [MasterData]
      operationId: disableOrganization
      summary: Disable an organization only after dependent responsibility is resolved.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the stored organization version.
      x-transaction:
        boundary: Validate dependencies, disable organization, and audit atomically.
      x-audit-event:
        event: ORGANIZATION_DISABLED
      x-error-codes: [ORGANIZATION_HAS_ASSETS, ORGANIZATION_HAS_RESPONSIBILITY, ORGANIZATION_ALREADY_DISABLED]
      x-invariants: Disable is rejected while active assets or responsibility relations depend on the organization; history is retained.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableOrganizationRequest'
      responses:
        '200':
          description: Disabled organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees:
    get:
      tags: [MasterData]
      operationId: listEmployees
      summary: List employees with sensitive fields protected by permission.
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Employee page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEmployee'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MasterData]
      operationId: createEmployee
      summary: Create an employee and its system-account relation seed.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: Organization version is current and employee number is not reused.
      x-transaction:
        boundary: Insert employee relation and audit event atomically.
      x-audit-event:
        event: EMPLOYEE_CREATED
      x-error-codes: [EMPLOYEE_NO_CONFLICT, EMPLOYEE_ORGANIZATION_NOT_FOUND]
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '201':
          description: Created employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [MasterData]
      operationId: getEmployee
      summary: Read an employee and permission-filtered contact fields.
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      responses:
        '200':
          description: Employee details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MasterData]
      operationId: updateEmployee
      summary: Update employee relations without changing asset responsibility.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the stored employee version.
      x-transaction:
        boundary: Conditional employee update and audit event are one short transaction.
      x-audit-event:
        event: EMPLOYEE_UPDATED
      x-error-codes: [EMPLOYEE_NO_CONFLICT, EMPLOYEE_ORGANIZATION_NOT_FOUND]
      x-invariants: Transfer changes the employee relation only; it never rewrites current asset responsibility, and the old relation remains in history.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateRequest'
      responses:
        '200':
          description: Updated employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees/{employeeId}/disable:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    post:
      tags: [MasterData]
      operationId: disableEmployee
      summary: Disable an employee and revoke access immediately while retaining history.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the stored employee version.
      x-transaction:
        boundary: Disable employee, revoke sessions, upload permission, and account access, retain responsibility, history, and todos, and audit atomically.
      x-audit-event:
        event: EMPLOYEE_DISABLED
      x-error-codes: [EMPLOYEE_ALREADY_DISABLED]
      x-side-effects: Disabling immediately revokes sessions, upload permission, and account access; employee, asset responsibility, operation history, and pending todos are retained. This action is never blocked by business or security todo.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableEmployeeRequest'
      responses:
        '200':
          description: Disabled employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees/{employeeId}/enable:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    post:
      tags: [MasterData]
      operationId: enableEmployee
      summary: Re-enable an employee without restoring roles or account access.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the stored employee version.
      x-transaction:
        boundary: Restore only the employee enabled state and audit atomically.
      x-audit-event:
        event: EMPLOYEE_ENABLED
      x-error-codes: [EMPLOYEE_ALREADY_ENABLED]
      x-invariants: Enabling only restores the employee enabled state; it does not automatically restore revoked roles and does not automatically grant business permissions. The system account status remains controlled by its separate operation; responsibility and history remain unchanged.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
