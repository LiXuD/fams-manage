          description: ENTERPRISE uses one company namespace; CATEGORY_PREFIX reads current category prefixes.
        fixedPrefix:
          type: string
          maxLength: 32
          description: >-
            Optional fixed prefix for ENTERPRISE. CATEGORY_PREFIX is only valid for
            ASSET, must omit fixedPrefix, and reads the active AssetCategory.numberingPrefix.
