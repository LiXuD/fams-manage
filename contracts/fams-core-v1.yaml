              properties:
                file: { type: string, format: binary }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: Registered quarantined attachment, or the original idempotent result.
          content:
            application/json:
              schema:
                type: object
                required: [objectId, filename, contentType, sizeBytes, scanStatus, businessVersion]
                properties:
                  objectId: { type: string, format: uuid }
                  filename: { type: string }
                  contentType: { type: string }
                  sizeBytes: { type: integer, format: int64 }
                  scanStatus: { type: string, enum: [CLEAN, INFECTED, UNAVAILABLE] }
                  businessVersion: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: Multipart request exceeds the upload limit.
        '503':
          description: Quarantine storage could not accept the upload.
  /inbound-receipts:
    get:
      tags: [Inbound]
      operationId: listInboundReceipts
      summary: List inbound receipts within the fixed role and relationship scopes.
      x-actor:
        required: true
        roles: [ASSET_ADMIN, WAREHOUSE_OPERATOR, AUDIT_READ_ONLY]
      x-data-scope: >-
        A WAREHOUSE_OPERATOR creator sees its own receipt at every stage: DRAFT,
        PENDING_ADMIN_DECISION, REJECTED, WAITING_WAREHOUSE_CLAIM, WAREHOUSE_PROCESSING,
        COMPLETED, or CANCELLED. This relationship preserves necessary progress, result,
        history, current version, and response unknown recovery without granting new write
        permission. Any other warehouse operator sees only approved receipts and execution
        status. ASSET_ADMIN sees every submitted receipt and its history; AUDIT_READ_ONLY
        requires an explicit scope. SYSTEM_ADMIN has no automatic inbound business access.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/InboundReceiptStatusFilter'
        - $ref: '#/components/parameters/InboundReceiptNumberFilter'
      responses:
        '200':
          description: Scoped inbound-receipt page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInboundReceipt'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Inbound]
      operationId: createInboundReceipt
      summary: Create a creator-owned inbound receipt draft with a server business number.
      x-business-write: true
      x-actor:
        required: true
        roles: [WAREHOUSE_OPERATOR]
      x-version:
        required: true
        precondition: Every asset, warehouse, and location reference version must be current.
      x-transaction:
        boundary: >-
          Validate creator-owned DRAFT assets, duplicate selection, active warehouse and
          location versions, and warehouse membership; allocate the permanent server
          business number, persist target snapshots, and audit in one short transaction.
          Draft creation does not acquire an asset business lock.
      x-audit-event:
        event: INBOUND_DRAFT_CREATED
      x-error-codes:
        - INBOUND_ASSET_NOT_FOUND
        - INBOUND_ASSET_NOT_CREATOR
        - INBOUND_ASSET_NOT_DRAFT
        - INBOUND_ASSET_LOCKED
        - INBOUND_DUPLICATE_ASSET
        - INBOUND_REFERENCE_VERSION_CONFLICT
        - INBOUND_MASTER_DATA_DISABLED
        - INBOUND_WAREHOUSE_LOCATION_MISMATCH
        - INBOUND_NUMBERING_RULE_UNAVAILABLE
        - INBOUND_IDEMPOTENCY_CONFLICT
      x-invariants: >-
        Only the creator may place their unsubmitted asset card in this DRAFT receipt.
        Every asset must be cardStage DRAFT, lifecycle WAITING_INBOUND, exception NORMAL,
        and free of an active business lock. The server allocates the permanent business
        number. Each effective warehouse and location is explicit and saved with an
        immutable code/name snapshot; defaults may be overridden per item.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundReceiptCreateRequest'
      responses:
        '201':
          description: Created creator-owned inbound receipt draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundReceipt'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inbound-receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/InboundReceiptId'
    get:
      tags: [Inbound]
      operationId: getInboundReceipt
      summary: Read an inbound receipt within its fixed role and relationship scope.
      x-actor:
        required: true
        roles: [ASSET_ADMIN, WAREHOUSE_OPERATOR, AUDIT_READ_ONLY]
      x-data-scope: >-
        A WAREHOUSE_OPERATOR creator sees its own receipt at every stage: DRAFT,
        PENDING_ADMIN_DECISION, REJECTED, WAITING_WAREHOUSE_CLAIM, WAREHOUSE_PROCESSING,
        COMPLETED, or CANCELLED. This relationship preserves necessary progress, result,
        history, current version, and response unknown recovery without granting new write
        permission. Any other warehouse operator sees only approved receipts and execution
        status. ASSET_ADMIN sees every submitted receipt and its history; AUDIT_READ_ONLY
        requires an explicit scope. SYSTEM_ADMIN has no automatic inbound business access.
      responses:
        '200':
          description: Scoped inbound-receipt detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundReceipt'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Inbound]
      operationId: updateInboundReceipt
      summary: Update a creator-owned inbound receipt while it remains a draft.
      x-business-write: true
      x-actor:
        required: true
        roles: [WAREHOUSE_OPERATOR]
      x-version:
        required: true
        precondition: >-
          If-Match-Version must equal the receipt version and every supplied asset,
          warehouse, and location reference version must be current.
      x-transaction:
        boundary: >-
          Validate creator ownership, DRAFT state, receipt version, asset lock state,
          duplicate selection, active warehouse/location versions and membership; replace
          the resolved items and snapshots, advance the version, and audit atomically.
      x-audit-event:
        event: INBOUND_DRAFT_UPDATED
      x-error-codes:
        - INBOUND_NOT_FOUND
        - INBOUND_NOT_CREATOR
        - INBOUND_NOT_DRAFT
