        '409': { $ref: '#/components/responses/Conflict' }

  /inbound-receipts/{receiptId}/decision:
    parameters:
      - $ref: '#/components/parameters/InboundReceiptId'
    post:
      tags: [Inbound]
      operationId: decideInboundReceipt
      summary: Record the one effective administrator decision for a submitted receipt.
      x-business-write: true
      x-actor:
        required: true
        roles: [ASSET_ADMIN]
      x-version:
        required: true
        precondition: >-
          If-Match-Version must equal the PENDING_ADMIN_DECISION receipt version and
          competes with every other administrator decision and creator cancellation.
      x-transaction:
        boundary: >-
          Atomically win the receipt-version race and persist the one effective decision
          with its approved scope. Approval closes the administrator todo, opens exactly
          one shared warehouse todo and stores its deadline. Rejection closes the todo,
          releases every receipt asset lock and restores every card to DRAFT. Any failure
          rolls back the receipt, decision, todo, lock, card, and audit effects together.
      x-audit-event:
        event: INBOUND_ADMIN_DECIDED
      x-error-codes:
        - INBOUND_NOT_FOUND
        - INBOUND_NOT_PENDING_DECISION
        - INBOUND_VERSION_CONFLICT
        - INBOUND_DECISION_ALREADY_EFFECTIVE
        - INBOUND_CANCELLATION_ALREADY_EFFECTIVE
        - INBOUND_DECISION_REASON_REQUIRED
        - INBOUND_LOCK_RELEASE_CONFLICT
        - INBOUND_IDEMPOTENCY_CONFLICT
      x-invariants: >-
        All asset administrators can view the shared pending request, and view does not
        reserve it. The first legal decision on the current receipt version becomes the
        one effective decision; every losing request receives the actual effective
        decision and creates no duplicate todo or audit success. The immutable approved
        scope captures the submitted receipt version and every item target. APPROVED moves
        the receipt to WAITING_WAREHOUSE_CLAIM, retains each asset business lock and
        PENDING_INBOUND card, leaves current processor unset, and opens the shared
        warehouse pool. REJECTED records its reason, releases every lock, restores each
        card to DRAFT, and opens no warehouse task. A dual-role administrator approval
        does not claim warehouse processing ownership. The same idempotent request returns
        its original result; a different payload under the same key conflicts.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundDecisionRequest'
      responses:
        '200':
          description: Effective approval or rejection, including an idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundReceipt'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

