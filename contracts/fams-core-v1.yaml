        '409': { $ref: '#/components/responses/Conflict' }

  /inbound-receipts/{receiptId}/items/{itemId}/accept:
    parameters:
      - $ref: '#/components/parameters/InboundReceiptId'
      - $ref: '#/components/parameters/InboundReceiptItemId'
    post:
      tags: [Inbound]
      operationId: acceptInboundReceiptItem
      summary: Accept one physical asset into storage as the current receipt processor.
      x-business-write: true
      x-actor:
        required: true
        roles: [WAREHOUSE_OPERATOR]
      x-version:
        required: true
        precondition: >-
          If-Match-Version supplies the current receipt version; the request supplies the
          current asset version and active lock version for this receipt item.
      x-transaction:
        boundary: >-
          In one item short transaction, verify processing ownership and approved scope,
          record the immutable acceptance, update the asset and storage custody, release
          exactly that business lock, update item and receipt versions, and write audit.
          Any failure causes full rollback with no partial item, asset, custody, lock,
          receipt, ownership, or success-audit effect.
      x-audit-event:
        event: INBOUND_ITEM_ACCEPTED
      x-error-codes:
        - INBOUND_NOT_FOUND
        - INBOUND_ITEM_NOT_FOUND
        - INBOUND_NOT_CURRENT_PROCESSOR
        - INBOUND_NOT_PROCESSING
        - INBOUND_ITEM_ALREADY_ACCEPTED
        - INBOUND_ACCEPTANCE_VERSION_CONFLICT
        - INBOUND_APPROVED_SCOPE_MISMATCH
        - INBOUND_OBSERVED_ASSET_CODE_MISMATCH
        - INBOUND_ASSET_STATE_CONFLICT
        - INBOUND_ASSET_INCOMPLETE
        - INBOUND_ASSET_LOCK_CONFLICT
        - INBOUND_TARGET_INACTIVE
        - INBOUND_WAREHOUSE_LOCATION_MISMATCH
        - INBOUND_ACCEPTANCE_ATOMIC_ROLLBACK
        - INBOUND_IDEMPOTENCY_CONFLICT
      x-invariants: >-
        Only the current processor may accept one item; every other warehouse operator
        remains read-only. The service compares receipt version, asset version, lock version,
        observed asset code, approved scope, asset completeness, active warehouse, active
        location, and warehouse membership. The asset must be lifecycle WAITING_INBOUND,
        cardStage PENDING_INBOUND, exception NORMAL, and locked by this exact item. Success
        changes it to lifecycle IN_STOCK and cardStage ACTIVE, creates STORAGE custody from
        the approved warehouse/location, records inbound business date and acceptance fact,
        and releases only that business lock. With remaining items, the receipt stays
        WAREHOUSE_PROCESSING and ownership remains active. The last item moves the receipt
        to COMPLETED, archives processing ownership, marks the ownership archived, and makes
        the completed receipt read-only;
        it cannot be deleted or edited. This one-item API has no partial batch outcome. The
        same idempotent request after response loss returns the original result; a different
        key or payload against an accepted item returns its actual acceptance. Transaction
        failure performs rollback and leaves the item safely retryable.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundAcceptanceRequest'
      responses:
        '200':
          description: Accepted item, post-state asset, and updated receipt or idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundAcceptanceResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

