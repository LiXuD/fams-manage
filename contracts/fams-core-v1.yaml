              schema:
                $ref: '#/components/schemas/PageNumberingRule'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MasterData]
      operationId: createNumberingRule
      summary: Create a numbering rule for an asset or inbound-receipt namespace.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: Namespace is new; the selected category configuration snapshot is current when category-prefix mode is selected.
      x-transaction:
        boundary: Validate the namespace and rule configuration, then persist the rule and audit in one short transaction.
      x-audit-event:
        event: NUMBERING_RULE_CREATED
      x-error-codes: [NUMBERING_RULE_CODE_CONFLICT, NUMBERING_RULE_TARGET_CONFLICT, NUMBERING_CATEGORY_PREFIX_MISSING, NUMBERING_CATEGORY_PREFIX_CONFLICT, NUMBERING_MODE_NOT_ALLOWED_FOR_TARGET, NUMBERING_RULE_FIXED_PREFIX_NOT_ALLOWED]
      x-allowed-target-modes: ['ASSET:ENTERPRISE', 'ASSET:CATEGORY_PREFIX', 'INBOUND_RECEIPT:ENTERPRISE']
      x-rejected-target-modes: ['INBOUND_RECEIPT:CATEGORY_PREFIX']
      x-rejected-prefix-combinations: ['CATEGORY_PREFIX:fixedPrefix']
      x-combination-validation: >-
        CATEGORY_PREFIX is valid only for ASSET and derives its prefix from the
        active AssetCategory.numberingPrefix. INBOUND_RECEIPT is valid only with
        ENTERPRISE mode because its business number uses an independent enterprise
        sequence. CATEGORY_PREFIX must omit fixedPrefix; ENTERPRISE may optionally
        carry fixedPrefix. Any rejected target or mode combination returns 400.
      x-invariants: Rule code and rule identity are permanent and never reused; only one current rule may be effective for a target; category prefixes are read from AssetCategory and are not copied per category.
      x-allocation-policy:
        internal-only: true
        batch-reservation: >-
          Backend batch creation reserves a number segment inside the same short transaction as its business write.
        failure-gap: >-
          A failed or cancelled batch may leave a gap or tombstone; the gap is never returned to a later allocation.
        client-input: Clients cannot specify an asset code or business number.
        preview: No preview endpoint reserves a number or occupies a sequence value.
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberingRuleCreateRequest'
      responses:
        '201':
          description: Created numbering rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberingRule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

