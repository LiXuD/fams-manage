        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: Patch allowed asset-card fields under stage and creator policy.
      x-business-write: true
      x-actor:
        required: true
        roles: [WAREHOUSE_OPERATOR]
      x-version:
        required: true
        precondition: If-Match-Version must equal the stored asset version and all supplied references must be current.
      x-transaction:
        boundary: Validate stage, creator, reference versions, and descriptive-correction policy, then update and audit in one short transaction.
      x-audit-event:
        event: ASSET_UPDATED
      x-error-codes: [ASSET_NOT_FOUND, ASSET_NOT_CREATOR, ASSET_DRAFT_LOCKED, ASSET_PENDING_INBOUND, ASSET_REFERENCE_VERSION_CONFLICT, ASSET_MASTER_DATA_DISABLED, ASSET_FIELD_NOT_EDITABLE, ASSET_VERSION_CONFLICT, ASSET_SERIAL_NUMBER_CONFLICT]
      x-stage-field-policy:
        DRAFT:
          allowed: All fields in AssetUpdateRequest may be changed by the creating warehouse operator while cardStage is DRAFT.
        PENDING_INBOUND:
          allowed: []
          rejection: Direct updates are forbidden while awaiting inbound submission; use the later inbound business flow.
        ACTIVE:
          allowed: [name, model, unit, brand, manufacturer, serialNumber, acquisitionDate, warrantyExpiryDate, serviceProvider, serviceContact, servicePhone, source, notes, attachments, extensionValues]
          descriptive-correction: A warehouse operator may correct these descriptive fields with version and audit controls.
          lock-policy: A business lock does not block a descriptive correction unrelated to custody or responsibility.
          forbidden: [assetCode, category, organization, plannedInboundWarehouse, plannedInboundLocation, lifecycle, exception, currentCustody, usageMode, responsibleEmployee]
          rejection: Identity, ownership, lifecycle, exception, location, usage mode, and responsibility corrections use controlled business processes.
      x-invariants: A disabled or expired reference is rejected; status, assetCode, lifecycle, exception, formal custody, and responsibility are never directly changed by this PATCH.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdateRequest'
      responses:
        '200':
          description: Updated asset card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

