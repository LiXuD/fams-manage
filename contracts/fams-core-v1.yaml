openapi: 3.0.4
info:
  title: FAMS core first-slice contract
  version: 1.0.0
  description: >-
    Public wire foundation, authentication, identity/account administration, and MasterData
    boundaries for the first FAMS design package. Asset, inbound, and later
    product paths are added in bounded contract increments.
servers:
  - url: /api/v1
    description: Versioned FAMS API root.
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: System-account authentication and session boundaries.
  - name: MiniIdentitySupport
  - name: MiniBinding
  - name: MiniAuth
    description: Mini-program opaque header sessions; verified binding issuance is a later slice.
  - name: MasterData
    description: Organization, employee, and catalog configuration boundaries.
  - name: AccountAdmin
    description: System-account, fixed-role, and controlled-authorization configuration boundaries.
  - name: Assets
    description: Asset-card and ledger read boundaries; business mutations remain scoped to warehouse operators.
  - name: AssetImport
    description: Warehouse-operator asset import upload and row preflight boundaries.
  - name: Inbound
    description: Inbound receipt draft and lifecycle boundaries; approval and warehouse execution are later slices.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FAMS_SESSION
      description: Secure, HttpOnly session cookie; bearer tokens are not accepted.
    miniSession:
      type: apiKey
      in: header
      name: X-FAMS-Mini-Session
      description: HTTPS only; opaque server credential bound to current employee and binding. Never a WeChat code or session_key.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token paired with the session cookie.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same key and payload returns the original result; a different payload conflicts.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit CSRF token paired with the secure session cookie.
      schema:
        type: string
        minLength: 16
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      description: Optimistic version precondition for an existing aggregate.
      schema:
        type: integer
        format: int64
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SystemAccountId:
      name: systemAccountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoleName:
      name: role
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Role'
    AssetCategoryId:
      name: assetCategoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ManufacturerId:
      name: manufacturerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    NumberingRuleId:
      name: numberingRuleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BusinessParameterVersionId:
      name: parameterVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ConfigurationAnomalyId:
      name: anomalyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AssetSavedFilterId:
      name: savedFilterId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    QrToken:
      name: token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AssetQrToken'
    PrintJobId:
      name: printJobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InboundReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InboundReceiptItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InboundReceiptStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InboundReceiptStatus'
    InboundReceiptNumberFilter:
      name: receiptNumber
      in: query
      required: false
      schema:
        type: string
    AssetCodeFilter:
      name: assetCode
      in: query
      required: false
      schema:
        type: string
    AssetNameFilter:
      name: name
      in: query
      required: false
      schema:
        type: string
    SerialNumberFilter:
      name: serialNumber
      in: query
      required: false
      schema:
        type: string
    AssetCategoryFilter:
      name: assetCategoryId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetLifecycleFilter:
      name: lifecycle
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AssetLifecycle'
    AssetExceptionFilter:
      name: exception
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AssetException'
    AssetWarehouseFilter:
      name: warehouseId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetLocationFilter:
      name: locationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetOrganizationFilter:
      name: organizationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetUsageModeFilter:
      name: usageMode
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UsageMode'
    AssetUsingOrganizationFilter:
      name: usingOrganizationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetResponsibleEmployeeFilter:
      name: responsibleEmployeeId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetDepartmentResponsibleEmployeeFilter:
      name: departmentResponsibleEmployeeId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetCurrentProcessorFilter:
      name: currentProcessorId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetBusinessReferenceFilter:
      name: businessReference
      in: query
      required: false
      description: Exact business receipt id or business number.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AssetInboundDateFromFilter:
      name: inboundDateFrom
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusinessDate'
    AssetInboundDateToFilter:
      name: inboundDateTo
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusinessDate'
    AssetLastInventoryDateFromFilter:
      name: lastInventoryDateFrom
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusinessDate'
    AssetLastInventoryDateToFilter:
      name: lastInventoryDateTo
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusinessDate'
    AssetBorrowOverdueFilter:
      name: borrowOverdue
      in: query
      required: false
      schema:
        type: boolean
    AssetLongUninventoriedFilter:
      name: longUninventoried
      in: query
      required: false
      schema:
        type: boolean
    AssetTimelineEventTypeFilter:
      name: eventType
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: Request validation or state precondition failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Session is absent, expired, or disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role, CSRF, or data/business relation is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version, uniqueness, idempotency, or lock conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested identity or account resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Login or other request rate limit has been reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    InventoryClockRequest: {"type": "object", "additionalProperties": false, "required": ["deviceId", "clientTime"], "properties": {"deviceId": {"type": "string", "format": "uuid"}, "clientTime": {"type": "string", "format": "date-time", "description": "UTC instant with millisecond precision."}}}
    InventoryClockReceipt: {"type": "object", "additionalProperties": false, "required": ["calibrationId", "serverTime", "clientTime"], "properties": {"calibrationId": {"type": "string", "format": "uuid"}, "serverTime": {"type": "string", "format": "date-time", "description": "UTC instant with millisecond precision."}, "clientTime": {"type": "string", "format": "date-time", "description": "UTC instant with millisecond precision."}}}
    InventoryIdentificationRequest: {"type": "object", "additionalProperties": false, "required": ["source", "value"], "properties": {"source": {"type": "string", "enum": ["SCAN", "CODE"]}, "value": {"type": "string", "minLength": 1, "maxLength": 256}}}
    InventoryAssignedIdentification: {"type": "object", "additionalProperties": false, "required": ["kind", "itemId", "assignmentVersion", "recheckGeneration", "assetVersion", "snapshot"], "properties": {"kind": {"type": "string", "enum": ["ASSIGNED"]}, "itemId": {"$ref": "#/components/schemas/Id"}, "assignmentVersion": {"type": "integer", "format": "int64", "minimum": 0}, "recheckGeneration": {"type": "integer", "format": "int64", "minimum": 0}, "assetVersion": {"type": "integer", "format": "int64", "minimum": 0}, "snapshot": {"$ref": "#/components/schemas/InventorySnapshot"}}}
    InventoryOutsideIdentification: {"type": "object", "additionalProperties": false, "required": ["kind", "assetCode", "name"], "properties": {"kind": {"type": "string", "enum": ["TASK_OUTSIDE"]}, "assetCode": {"type": "string"}, "name": {"type": "string"}}}
    InventoryUnverifiedIdentification: {"type": "object", "additionalProperties": false, "required": ["kind", "message"], "properties": {"kind": {"type": "string", "enum": ["UNVERIFIED", "NOT_ASSIGNED", "INVALID_TAG"]}, "message": {"type": "string"}}}
    InventoryIdentification: {"oneOf": [{"$ref": "#/components/schemas/InventoryAssignedIdentification"}, {"$ref": "#/components/schemas/InventoryOutsideIdentification"}, {"$ref": "#/components/schemas/InventoryUnverifiedIdentification"}]}
    InventoryObservedFacts: {"type": "object", "additionalProperties": false, "required": ["condition"], "properties": {"locationId": {"type": "string", "nullable": true, "pattern": "^[1-9][0-9]*$"}, "locationHint": {"type": "string", "nullable": true, "maxLength": 500}, "custodyType": {"type": "string", "nullable": true, "enum": ["STORAGE", "PERSONAL", "SHARED"]}, "responsibleEmployeeId": {"type": "string", "nullable": true, "pattern": "^[1-9][0-9]*$"}, "responsibilityHint": {"type": "string", "nullable": true, "maxLength": 500}, "condition": {"type": "string", "enum": ["GOOD", "DAMAGED", "UNKNOWN"]}, "unknownReason": {"type": "string", "nullable": true, "maxLength": 1000}, "description": {"type": "string", "nullable": true, "maxLength": 2000}}}
    InventoryObservationEvidence: {"type": "object", "additionalProperties": false, "required": ["eventId", "assignmentVersion", "recheckGeneration", "deviceId", "source", "actual", "rawObservedAt", "firstPersistedAt", "expiresAt", "clockAnomaly", "photoIds"], "properties": {"eventId": {"type": "string", "format": "uuid"}, "itemId": {"type": "string", "nullable": true, "pattern": "^[1-9][0-9]*$"}, "assignmentVersion": {"type": "integer", "format": "int64", "minimum": 0}, "recheckGeneration": {"type": "integer", "format": "int64", "minimum": 0}, "assetVersion": {"type": "integer", "format": "int64", "nullable": true, "minimum": 0}, "deviceId": {"type": "string", "format": "uuid"}, "source": {"type": "string", "enum": ["SCAN", "CODE", "MANUAL"]}, "assetCode": {"type": "string", "nullable": true, "maxLength": 128}, "manualReason": {"type": "string", "nullable": true, "maxLength": 1000}, "actual": {"$ref": "#/components/schemas/InventoryObservedFacts"}, "rawObservedAt": {"type": "string", "format": "date-time", "description": "UTC instant with millisecond precision."}, "firstPersistedAt": {"type": "string", "format": "date-time", "description": "UTC instant with millisecond precision."}, "expiresAt": {"type": "string", "format": "date-time", "description": "UTC instant with millisecond precision."}, "calibrationId": {"type": "string", "format": "uuid", "nullable": true}, "clockAnomaly": {"type": "boolean"}, "photoIds": {"type": "array", "maxItems": 9, "uniqueItems": true, "items": {"type": "string", "format": "uuid"}}, "rawScannedAt": {"type": "string", "format": "date-time", "nullable": true, "description": "Original scan completion time; never replaced by save or receive time."}}}
    InventoryObservationReceipt: {"type": "object", "additionalProperties": false, "required": ["eventId", "outcome", "counted", "differences", "receivedAt", "recollectionRequired"], "properties": {"eventId": {"type": "string", "format": "uuid"}, "outcome": {"type": "string", "enum": ["ACCEPTED", "DIFFERENCE_REVIEW", "DUPLICATE", "CONFLICT_REVIEW", "LATE_REVIEW", "FINDING_REVIEW", "OLD_ASSIGNMENT_REVIEW", "TIME_REVIEW", "EXPIRED"]}, "counted": {"type": "boolean", "description": "Unique observation candidate for this verification round, never final administrator acceptance or sealed completion."}, "differences": {"type": "array", "items": {"type": "string", "enum": ["LOCATION", "USAGE_MODE", "RESPONSIBILITY", "CONDITION", "UNKNOWN", "PERIOD_MOVEMENT"]}}, "receivedAt": {"type": "string", "format": "date-time", "description": "UTC instant with millisecond precision."}, "recollectionRequired": {"type": "boolean"}}}
    InventoryPhotoReceipt: {"type": "object", "additionalProperties": false, "required": ["objectId", "photoId"], "properties": {"objectId": {"type": "string", "format": "uuid"}, "photoId": {"type": "string", "format": "uuid"}}}
    InventoryReferenceChoice: {"type": "object", "required": ["id", "name", "status"], "additionalProperties": false, "properties": {"id": {"$ref": "#/components/schemas/Id"}, "name": {"type": "string"}, "status": {"type": "string", "enum": ["ACTIVE", "DISABLED"]}}}
    InventoryRange: {"type": "object", "required": [], "properties": {"usingOrganizationId": {"type": "string", "nullable": true, "pattern": "^[1-9][0-9]*$"}, "owningOrganizationId": {"type": "string", "nullable": true, "pattern": "^[1-9][0-9]*$"}, "categoryId": {"type": "string", "nullable": true, "pattern": "^[1-9][0-9]*$"}, "warehouseId": {"type": "string", "nullable": true, "pattern": "^[1-9][0-9]*$"}, "locationId": {"type": "string", "nullable": true, "pattern": "^[1-9][0-9]*$"}, "responsibleEmployeeId": {"type": "string", "nullable": true, "pattern": "^[1-9][0-9]*$"}, "lifecycle": {"type": "string", "nullable": true, "enum": ["IN_STOCK", "IN_USE", "BORROWED", "UNDER_REPAIR", "FACTORY_REPAIR", "PENDING_SCRAP", "SCRAPPED"]}, "exception": {"type": "string", "nullable": true, "enum": ["NORMAL", "SEARCHING", "LOST"]}}, "additionalProperties": false}
    InventoryDraft: {"type": "object", "required": ["name", "range", "startsAt", "dueAt"], "properties": {"name": {"type": "string", "minLength": 1, "maxLength": 128}, "range": {"$ref": "#/components/schemas/InventoryRange"}, "startsAt": {"type": "string", "format": "date-time"}, "dueAt": {"type": "string", "format": "date-time"}}, "additionalProperties": false}
    InventoryPreview: {"type": "object", "required": ["count", "digest"], "properties": {"count": {"type": "integer", "format": "int64", "minimum": 0}, "digest": {"type": "string", "pattern": "^[a-f0-9]{64}$"}}}
    InventoryPublication: {"type": "object", "required": ["expectedCount", "previewDigest"], "properties": {"expectedCount": {"type": "integer", "format": "int64", "minimum": 1}, "previewDigest": {"type": "string", "pattern": "^[a-f0-9]{64}$"}}, "additionalProperties": false}
    InventoryAssignment: {"type": "object", "required": ["itemIds", "executorAccountId", "recheck", "reason"], "properties": {"itemIds": {"type": "array", "minItems": 1, "maxItems": 500, "uniqueItems": true, "items": {"$ref": "#/components/schemas/Id"}}, "executorAccountId": {"$ref": "#/components/schemas/Id"}, "recheck": {"type": "boolean"}, "reason": {"type": "string", "minLength": 1, "maxLength": 1000}}, "additionalProperties": false}
    InventoryReason: {"type": "object", "required": ["reason"], "properties": {"reason": {"type": "string", "minLength": 1, "maxLength": 1000}}}
    InventoryFindingTarget: {"type": "object", "required": ["kind", "assetId", "assetCode", "ownerVersion"], "properties": {"kind": {"type": "string", "enum": ["DUPLICATE_ASSET", "FORMAL_INBOUND"]}, "assetId": {"$ref": "#/components/schemas/Id"}, "assetCode": {"type": "string"}, "ownerVersion": {"type": "integer", "format": "int64", "minimum": 0}, "assetName": {"type": "string"}, "inboundReceiptId": {"$ref": "#/components/schemas/Id"}, "receiptNumber": {"type": "string"}, "status": {"type": "string"}}}
    InventoryFindingDecision: {"type": "object", "additionalProperties": false, "required": ["subjectVersion", "method", "reason", "evidence"], "properties": {"subjectVersion": {"type": "integer", "format": "int64", "minimum": 0}, "method": {"type": "string", "enum": ["NON_ENTERPRISE", "DUPLICATE_ASSET", "LINK_INBOUND", "REFRESH_INBOUND"]}, "assetId": {"$ref": "#/components/schemas/Id", "nullable": true}, "inboundReceiptId": {"$ref": "#/components/schemas/Id", "nullable": true}, "ownerVersion": {"type": "integer", "format": "int64", "minimum": 0, "nullable": true}, "reason": {"type": "string", "minLength": 3, "maxLength": 1000}, "evidence": {"type": "string", "minLength": 10, "maxLength": 2000}}}
    InventoryFindingResult: {"type": "object", "required": ["taskId", "observationId", "version", "subjectVersion", "status"], "properties": {"taskId": {"$ref": "#/components/schemas/Id"}, "observationId": {"$ref": "#/components/schemas/Id"}, "version": {"type": "integer", "format": "int64", "minimum": 0}, "subjectVersion": {"type": "integer", "format": "int64", "minimum": 0}, "status": {"type": "string", "enum": ["OPEN", "PROCESSING", "CLOSED"]}}}
    InventoryFindingRecollection: {"type": "object", "additionalProperties": false, "required": ["subjectVersion", "counterObservationId", "reason", "evidence"], "properties": {"subjectVersion": {"type": "integer", "format": "int64", "minimum": 0}, "counterObservationId": {"$ref": "#/components/schemas/Id"}, "reason": {"type": "string", "minLength": 3, "maxLength": 1000}, "evidence": {"type": "string", "minLength": 10, "maxLength": 2000}}}
    InventoryFindingRecollectionResult: {"type": "object", "required": ["taskId", "observationId", "version", "subjectVersion", "status", "method", "counterObservationId", "originalTimeConfidence"], "properties": {"taskId": {"$ref": "#/components/schemas/Id"}, "observationId": {"$ref": "#/components/schemas/Id"}, "counterObservationId": {"$ref": "#/components/schemas/Id"}, "version": {"type": "integer", "format": "int64"}, "subjectVersion": {"type": "integer", "format": "int64"}, "status": {"type": "string", "enum": ["CLOSED"]}, "method": {"type": "string", "enum": ["RECOLLECTED"]}, "originalTimeConfidence": {"type": "string", "enum": ["UNVERIFIED"]}}}
    InventoryFindingView: {"type": "object", "required": ["taskVersion", "observation", "subject", "history", "historyTotal"], "properties": {"taskVersion": {"type": "integer", "format": "int64", "minimum": 0}, "observation": {"$ref": "#/components/schemas/InventoryReviewObservation"}, "subject": {"type": "object", "additionalProperties": true}, "history": {"type": "array", "maxItems": 100, "items": {"type": "object", "additionalProperties": true}}, "historyTotal": {"type": "integer", "format": "int64", "minimum": 0}, "timeSubject": {"type": "array", "maxItems": 1, "items": {"type": "object", "additionalProperties": true}}, "recollections": {"type": "array", "maxItems": 100, "items": {"type": "object", "additionalProperties": true}}}}
    InventoryReviewState: {"type": "object", "required": ["version"], "properties": {"version": {"type": "integer", "format": "int64", "minimum": 0}, "item_id": {"$ref": "#/components/schemas/Id"}, "task_id": {"$ref": "#/components/schemas/Id"}, "recheck_generation": {"type": "integer", "format": "int64", "minimum": 0}, "observation_id": {"type": "string", "pattern": "^[1-9][0-9]*$", "nullable": true}, "review_status": {"type": "string", "enum": ["SELECTED", "ACCEPTED", "NOT_OBSERVED"]}, "verified_observed_at": {"type": "string", "format": "date-time", "nullable": true}, "reviewed_asset_version": {"type": "integer", "format": "int64", "minimum": 0}, "reviewer_account_id": {"$ref": "#/components/schemas/Id"}, "reviewer_username": {"type": "string"}, "reviewed_at": {"type": "string", "format": "date-time"}, "reason": {"type": "string"}, "evidence": {"type": "string"}}}
    InventoryReviewObservation: {"type": "object", "required": ["id", "client_event_id", "outcome", "facts_json", "received_at"], "properties": {"id": {"$ref": "#/components/schemas/Id"}, "task_id": {"$ref": "#/components/schemas/Id"}, "item_id": {"type": "string", "pattern": "^[1-9][0-9]*$", "nullable": true}, "actor_account_id": {"$ref": "#/components/schemas/Id"}, "binding_id": {"type": "string", "pattern": "^[1-9][0-9]*$", "nullable": true}, "client_event_id": {"type": "string", "format": "uuid"}, "device_id": {"type": "string", "format": "uuid"}, "assignment_version": {"type": "integer", "format": "int64", "minimum": 0}, "recheck_generation": {"type": "integer", "format": "int64", "minimum": 0}, "snapshot_asset_version": {"type": "integer", "format": "int64", "minimum": 0, "nullable": true}, "source": {"type": "string", "enum": ["SCAN", "CODE", "MANUAL"]}, "asset_code": {"type": "string", "nullable": true}, "raw_observed_at": {"type": "string", "format": "date-time"}, "first_persisted_at": {"type": "string", "format": "date-time"}, "client_expires_at": {"type": "string", "format": "date-time"}, "received_at": {"type": "string", "format": "date-time"}, "calibrated_observed_at": {"type": "string", "format": "date-time", "nullable": true}, "calibrated_persisted_at": {"type": "string", "format": "date-time", "nullable": true}, "calibration_id": {"type": "string", "format": "uuid", "nullable": true}, "payload_sha256": {"type": "string"}, "fact_sha256": {"type": "string"}, "outcome": {"type": "string", "enum": ["ACCEPTED", "DIFFERENCE_REVIEW", "DUPLICATE", "CONFLICT_REVIEW", "OLD_ASSIGNMENT_REVIEW", "TIME_REVIEW", "FINDING_REVIEW", "LATE_REVIEW", "EXPIRED"]}, "facts_json": {"oneOf": [{"$ref": "#/components/schemas/InventoryObservationEvidence"}, {"type": "object", "maxProperties": 0}], "description": "Original immutable facts, nested IDs normalized to strings; expired first upload retains only empty facts."}, "receipt_json": {"$ref": "#/components/schemas/InventoryObservationReceipt"}}}
