openapi: 3.0.4
info:
  title: FAMS core first-slice contract
  version: 1.0.0
  description: >-
    Public wire foundation, authentication, and identity/account MasterData
    boundaries for the first FAMS design package. Asset, inbound, and later
    product paths are added in bounded contract increments.
servers:
  - url: /api/v1
    description: Versioned FAMS API root.
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: System-account authentication and session boundaries.
  - name: MasterData
    description: Organization, employee, and system-account configuration boundaries.
  - name: Assets
    description: Asset-card and ledger read boundaries; business mutations remain scoped to warehouse operators.
  - name: Inbound
    description: Inbound receipt draft and lifecycle boundaries; approval and warehouse execution are later slices.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FAMS_SESSION
      description: Secure, HttpOnly session cookie; bearer tokens are not accepted.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token paired with the session cookie.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same key and payload returns the original result; a different payload conflicts.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit CSRF token paired with the secure session cookie.
      schema:
        type: string
        minLength: 16
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      description: Optimistic version precondition for an existing aggregate.
      schema:
        type: integer
        format: int64
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SystemAccountId:
      name: systemAccountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoleName:
      name: role
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Role'
    AssetCategoryId:
      name: assetCategoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ManufacturerId:
      name: manufacturerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    NumberingRuleId:
      name: numberingRuleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BusinessParameterVersionId:
      name: parameterVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ConfigurationAnomalyId:
      name: anomalyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    QrToken:
      name: token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AssetQrToken'
    PrintJobId:
      name: printJobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InboundReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InboundReceiptItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InboundReceiptStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InboundReceiptStatus'
    InboundReceiptNumberFilter:
      name: receiptNumber
      in: query
      required: false
      schema:
        type: string
    AssetCodeFilter:
      name: assetCode
      in: query
      required: false
      schema:
        type: string
    AssetNameFilter:
      name: name
      in: query
      required: false
      schema:
        type: string
    SerialNumberFilter:
      name: serialNumber
      in: query
      required: false
      schema:
        type: string
    AssetCategoryFilter:
      name: assetCategoryId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetLifecycleFilter:
      name: lifecycle
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AssetLifecycle'
    AssetExceptionFilter:
      name: exception
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AssetException'
    AssetWarehouseFilter:
      name: warehouseId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetLocationFilter:
      name: locationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetOrganizationFilter:
      name: organizationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadRequest:
      description: Request validation or state precondition failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Session is absent, expired, or disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role, CSRF, or data/business relation is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version, uniqueness, idempotency, or lock conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested identity or account resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Login or other request rate limit has been reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Id:
      type: string
      pattern: '^[0-9]+$'
      description: Signed MySQL BIGINT represented as a decimal JSON string.
      example: '9007199254740993'
    Instant:
      type: string
      format: date-time
      description: Java Instant on the wire as an RFC 3339 value normalized to UTC Z.
      example: '2026-09-13T08:15:00Z'
    BusinessDate:
      type: string
      format: date
      description: Calendar date with no timezone conversion.
      example: '2026-09-13'
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Decimal money text with explicit two-place scale.
      example: '1200.00'
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    AuditEvent:
      type: object
      required: [eventId, eventType, actorId, occurredAt]
      properties:
        eventId:
          $ref: '#/components/schemas/Id'
        eventType:
          type: string
        actorId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          $ref: '#/components/schemas/Instant'
        aggregateId:
          $ref: '#/components/schemas/Id'
    Role:
      type: string
      enum: [EMPLOYEE, DEPARTMENT_ASSET_MANAGER, ASSET_ADMIN, WAREHOUSE_OPERATOR, TECH_ASSISTANT, AUDIT_READ_ONLY, SYSTEM_ADMIN]
    ReferenceStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    UsageMode:
      type: string
      enum: [PERSONAL, SHARED]
    AssetLifecycle:
      type: string
      enum: [WAITING_INBOUND, IN_STOCK, IN_USE, BORROWED, UNDER_REPAIR, FACTORY_REPAIR, PENDING_SCRAP, SCRAPPED]
    AssetException:
      type: string
      enum: [NORMAL, SEARCHING, LOST]
    AssetCardStage:
      type: string
      enum: [DRAFT, PENDING_INBOUND, ACTIVE, CANCELLED]
    AssetCreatorReference:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
    AttachmentReference:
      type: object
      additionalProperties: false
      required: [id, version]
      description: Versioned attachment identity; attachment content and export permissions are separate concerns.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
    AssetCustodySummary:
      type: object
      description: >-
        Read-only formal custody summary. STORAGE is an in-warehouse custody with
        warehouse and location only; PERSONAL has one responsible employee and a
        using organization; SHARED has one department responsible employee and a
        fixed location. Owning organization is kept on the Asset and is distinct
        from usingOrganization. These custody variants are mutually exclusive.
        Planned inbound targets are not current custody.
      oneOf:
        - type: object
          additionalProperties: false
          required: [custodyType, warehouse, location]
          properties:
            custodyType:
              type: string
              enum: [STORAGE]
            warehouse:
              $ref: '#/components/schemas/CatalogReference'
            location:
              $ref: '#/components/schemas/CatalogReference'
        - type: object
          additionalProperties: false
          required: [custodyType, usingOrganization, responsibleEmployee, location]
          properties:
            custodyType:
              type: string
              enum: [PERSONAL]
            usingOrganization:
              $ref: '#/components/schemas/OrganizationReference'
            responsibleEmployee:
              $ref: '#/components/schemas/EmployeeReference'
            location:
              $ref: '#/components/schemas/CatalogReference'
        - type: object
          additionalProperties: false
          required: [custodyType, usingOrganization, departmentResponsibleEmployee, location]
          properties:
            custodyType:
              type: string
              enum: [SHARED]
            usingOrganization:
              $ref: '#/components/schemas/OrganizationReference'
            departmentResponsibleEmployee:
              $ref: '#/components/schemas/EmployeeReference'
            location:
              $ref: '#/components/schemas/CatalogReference'
    AssetBusinessSummary:
      type: object
      additionalProperties: false
      required: [unsettledBusinessCount, overdueBusinessCount]
      description: Read-only summary of formal custody and current unsettled business relations.
      properties:
        unsettledBusinessCount:
          type: integer
          format: int32
          minimum: 0
        overdueBusinessCount:
          type: integer
          format: int32
          minimum: 0
        latestBusinessReference:
          $ref: '#/components/schemas/Id'
    Asset:
      type: object
      additionalProperties: false
      required: [id, assetCode, name, lifecycle, exception, cardStage, version, createdBusinessDate, createdAt, parameterVersionId]
      description: >-
        Asset card and ledger read model. planned inbound warehouse and location are
        not formal custody; currentCustody is established only after inbound acceptance.
        Sensitive service fields, attachments, and export are separately authorized.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        assetCode:
          type: string
          description: Server-assigned enterprise-unique permanent code; never reused.
        name:
          type: string
        category:
          $ref: '#/components/schemas/CatalogReference'
        model:
          type: string
        unit:
          type: string
        organization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Owning organization; distinct from any usingOrganization in formal custody.
        plannedInboundWarehouse:
          $ref: '#/components/schemas/CatalogReference'
        plannedInboundLocation:
          $ref: '#/components/schemas/CatalogReference'
        brand:
          $ref: '#/components/schemas/CatalogReference'
        manufacturer:
          $ref: '#/components/schemas/CatalogReference'
        serialNumber:
          type: string
        acquisitionDate:
          $ref: '#/components/schemas/BusinessDate'
        warrantyExpiryDate:
          $ref: '#/components/schemas/BusinessDate'
        serviceProvider:
          type: string
        serviceContact:
          type: string
        servicePhone:
          type: string
          x-sensitive: true
        source:
          type: string
        notes:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentReference'
          x-sensitive: true
        extensionValues:
          type: object
          additionalProperties: true
        lifecycle:
          $ref: '#/components/schemas/AssetLifecycle'
        exception:
          $ref: '#/components/schemas/AssetException'
        cardStage:
          $ref: '#/components/schemas/AssetCardStage'
        version:
          type: integer
          format: int64
          minimum: 0
        createdBusinessDate:
          $ref: '#/components/schemas/BusinessDate'
        createdAt:
          $ref: '#/components/schemas/Instant'
        parameterVersionId:
          $ref: '#/components/schemas/Id'
        creator:
          $ref: '#/components/schemas/AssetCreatorReference'
        currentCustody:
          $ref: '#/components/schemas/AssetCustodySummary'
        openBusinessSummary:
          $ref: '#/components/schemas/AssetBusinessSummary'
    PageAsset:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Asset'
    AssetCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: >-
        Warehouse-operator draft input. Only name is required; non-critical fields
        may be completed before inbound submission and all references carry id/version.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        category:
          $ref: '#/components/schemas/CatalogReference'
        model:
          type: string
          maxLength: 128
        unit:
          type: string
          maxLength: 32
        organization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Owning organization reference; distinct from formal custody usage.
        plannedInboundWarehouse:
          $ref: '#/components/schemas/CatalogReference'
        plannedInboundLocation:
          $ref: '#/components/schemas/CatalogReference'
        brand:
          $ref: '#/components/schemas/CatalogReference'
        manufacturer:
          $ref: '#/components/schemas/CatalogReference'
        serialNumber:
          type: string
          maxLength: 128
        acquisitionDate:
          $ref: '#/components/schemas/BusinessDate'
        warrantyExpiryDate:
          $ref: '#/components/schemas/BusinessDate'
        serviceProvider:
          type: string
          maxLength: 256
        serviceContact:
          type: string
          maxLength: 128
        servicePhone:
          type: string
          maxLength: 32
          x-sensitive: true
        source:
          type: string
          maxLength: 128
        notes:
          type: string
          maxLength: 2000
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentReference'
          x-sensitive: true
        extensionValues:
          type: object
          additionalProperties: true
    AssetUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        PATCH draft fields. A DRAFT creator may update all fields listed here. After
        inbound submission only descriptive fields are eligible for a warehouse
        operator correction; status, identity, ownership, custody, and responsibility
        changes use controlled business processes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        category:
          $ref: '#/components/schemas/CatalogReference'
        model:
          type: string
          maxLength: 128
        unit:
          type: string
          maxLength: 32
        organization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Owning organization reference; distinct from formal custody usage.
        plannedInboundWarehouse:
          $ref: '#/components/schemas/CatalogReference'
        plannedInboundLocation:
          $ref: '#/components/schemas/CatalogReference'
        brand:
          $ref: '#/components/schemas/CatalogReference'
        manufacturer:
          $ref: '#/components/schemas/CatalogReference'
        serialNumber:
          type: string
          maxLength: 128
        acquisitionDate:
          $ref: '#/components/schemas/BusinessDate'
        warrantyExpiryDate:
          $ref: '#/components/schemas/BusinessDate'
        serviceProvider:
          type: string
          maxLength: 256
        serviceContact:
          type: string
          maxLength: 128
        servicePhone:
          type: string
          maxLength: 32
          x-sensitive: true
        source:
          type: string
          maxLength: 128
        notes:
          type: string
          maxLength: 2000
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentReference'
          x-sensitive: true
        extensionValues:
          type: object
          additionalProperties: true
    AssetCopyRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AssetCopyResult:
      type: object
      additionalProperties: false
      required: [assets]
      properties:
        assets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Asset'
    AssetCancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AssetQrToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: >-
        Opaque 256-bit base64url lookup token. It contains no asset id, asset code,
        or PII; it is only a lookup key and never grants permission.
    AssetTag:
      type: object
      additionalProperties: false
      required: [enterpriseName, assetName, assetCode, qrToken, qrCode]
      description: >-
        Printable label data: enterprise name, asset name, permanent asset code, and
        an opaque QR code payload. The token is not an authorization credential.
      properties:
        enterpriseName:
          type: string
        assetName:
          type: string
        assetCode:
          type: string
        qrToken:
          $ref: '#/components/schemas/AssetQrToken'
        qrCode:
          type: string
          description: QR payload containing only the opaque access token lookup key.
    AssetTagReprintRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AssetTagReplaceRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AssetTagPrintSelection:
      type: object
      additionalProperties: false
      required: [assetId, version]
      properties:
        assetId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
    AssetTagBatchPrintRequest:
      type: object
      additionalProperties: false
      required: [assets]
      properties:
        assets:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/AssetTagPrintSelection'
    AssetTagPrintJobStatus:
      type: string
      enum: [QUEUED, COMPLETED, FAILED]
    AssetTagPrintJob:
      type: object
      additionalProperties: false
      required: [jobId, status, assetCode]
      properties:
        jobId:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/AssetTagPrintJobStatus'
        assetCode:
          type: string
        tag:
          $ref: '#/components/schemas/AssetTag'
    AssetTagBatchPrintItem:
      type: object
      additionalProperties: false
      required: [assetId, assetCode]
      properties:
        assetId:
          $ref: '#/components/schemas/Id'
        assetCode:
          type: string
        tag:
          $ref: '#/components/schemas/AssetTag'
    AssetTagBatchPrintJob:
      type: object
      additionalProperties: false
      required: [jobId, status, items]
      properties:
        jobId:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/AssetTagPrintJobStatus'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AssetTagBatchPrintItem'
    AssetTagPrintJobResult:
      oneOf:
        - $ref: '#/components/schemas/AssetTagPrintJob'
        - $ref: '#/components/schemas/AssetTagBatchPrintJob'
      description: >-
        Recoverable result envelope for either a single or batch print job. QUEUED,
        COMPLETED, and FAILED states remain queryable after the initial response.
    AssetTagReplacementResult:
      type: object
      additionalProperties: false
      required: [tag, assetVersion]
      description: The rotated tag plus the asset version produced by the atomic update.
      properties:
        tag:
          $ref: '#/components/schemas/AssetTag'
        assetVersion:
          type: integer
          format: int64
          minimum: 0
    AssetQrAccessResult:
      type: object
      additionalProperties: false
      required: [assetCode, assetName, lifecycle, exception, cardStage]
      description: >-
        Authenticated QR lookup summary. A SCRAPPED asset exposes necessary status
        only; service phone, private files, and sensitive historical details are never
        included. The QR token is a lookup key, not a permission.
      properties:
        assetCode:
          type: string
        assetName:
          type: string
        lifecycle:
          $ref: '#/components/schemas/AssetLifecycle'
        exception:
          $ref: '#/components/schemas/AssetException'
        cardStage:
          $ref: '#/components/schemas/AssetCardStage'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          writeOnly: true
    SessionResponse:
      type: object
      required: [csrfToken, idleExpiresAt, absoluteExpiresAt, requiresInitialPasswordChange, user]
      properties:
        csrfToken:
          type: string
        idleExpiresAt:
          $ref: '#/components/schemas/Instant'
        absoluteExpiresAt:
          $ref: '#/components/schemas/Instant'
        requiresInitialPasswordChange:
          type: boolean
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, username, status, roles, requiresInitialPasswordChange]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
        status:
          $ref: '#/components/schemas/SystemAccountStatus'
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Role'
        requiresInitialPasswordChange:
          type: boolean
    PermissionSnapshot:
      type: object
      required: [userId, permissions, dataScopes]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        permissions:
          type: array
          items:
            type: string
        dataScopes:
          type: array
          items:
            type: string
    OrganizationReference:
      type: object
      required: [id, version]
      description: A versioned reference used for tree writes and concurrency validation.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
    OrganizationCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        parentOrganization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Omit for a root organization; otherwise id and version are both required.
    OrganizationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        parentOrganization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Omit to retain the current parent; otherwise id and version are both required.
