        - INBOUND_IDEMPOTENCY_CONFLICT
      x-invariants: >-
        Only the creator may cancel DRAFT or PENDING_ADMIN_DECISION. Cancellation and an
        administrator decision race on the same receipt version; only the first legal
        action wins. DRAFT cancellation touches no lock. Pending-decision cancellation
        must release every receipt business lock, return each cardStage to DRAFT, close
