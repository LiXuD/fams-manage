        Submission atomically acquires one business lock per asset, changes cardStage to
        PENDING_INBOUND, and leaves lifecycle WAITING_INBOUND and current custody empty.
        The receipt enters PENDING_ADMIN_DECISION in the all-ASSET_ADMIN shared pool; its
        administrator deadline uses the frozen parameter and calendar snapshot, while
        current processor remains unset. Asset business lock and warehouse processing
        ownership are independent controls. The same idempotent request returns the
        original result. Application restart, logout, or client timeout never releases
        submitted locks or creates a second todo.
