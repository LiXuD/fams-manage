      x-actor:
        required: true
        roles: [WAREHOUSE_OPERATOR]
      x-version:
        required: true
        precondition: >-
          If-Match-Version must equal the DRAFT receipt version; every asset and target
          reference version is rechecked at the submission instant.
      x-transaction:
        boundary: >-
          Revalidate the complete receipt and all assets, acquire every active business
          lock, advance every card stage, create one shared approval todo, persist the
          deadline and audit, and commit as one short transaction. A failure at any item
          causes full rollback: no receipt, asset, lock, todo, or success-audit effect remains.
      x-audit-event:
        event: INBOUND_SUBMITTED
      x-error-codes:
        - INBOUND_NOT_FOUND
        - INBOUND_NOT_CREATOR
        - INBOUND_NOT_DRAFT
        - INBOUND_VERSION_CONFLICT
        - INBOUND_ASSET_INCOMPLETE
        - INBOUND_ASSET_VERSION_CONFLICT
        - INBOUND_ASSET_LOCK_CONFLICT
        - INBOUND_REFERENCE_VERSION_CONFLICT
        - INBOUND_MASTER_DATA_DISABLED
