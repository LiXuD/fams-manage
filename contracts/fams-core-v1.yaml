      description: PENDING until the current processor records one successful physical acceptance.
    InboundReceiptItem:
      type: object
      additionalProperties: false
      required: [id, executionStatus, asset, assetSnapshot, targetWarehouse, targetLocation, warehouseSnapshot, locationSnapshot]
      description: >-
        Persisted item with versioned identities and immutable code/name snapshots for
        the asset, warehouse, and location selected for this receipt. businessLock is
        absent in DRAFT and present while a submitted receipt owns the active asset lock.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        executionStatus:
          $ref: '#/components/schemas/InboundReceiptItemExecutionStatus'
        asset:
          $ref: '#/components/schemas/InboundAssetReference'
        assetSnapshot:
          $ref: '#/components/schemas/InboundAssetSnapshot'
        targetWarehouse:
          $ref: '#/components/schemas/InboundTargetReference'
        targetLocation:
          $ref: '#/components/schemas/InboundTargetReference'
        warehouseSnapshot:
          $ref: '#/components/schemas/InboundCatalogSnapshot'
        locationSnapshot:
          $ref: '#/components/schemas/InboundCatalogSnapshot'
        businessLock:
          $ref: '#/components/schemas/InboundAssetBusinessLock'
        acceptance:
          $ref: '#/components/schemas/InboundAcceptanceRecord'
    InboundAssetBusinessLock:
      type: object
      additionalProperties: false
      required: [assetId, businessType, businessId, businessItemId, lockVersion, acquiredAt]
      description: >-
        Persistent active lock acquired at receipt submission. It survives restart,
        client timeout, and logout until a legal decision, cancellation, or acceptance
        transition releases it; it is independent of warehouse processing ownership.
      properties:
        assetId:
          $ref: '#/components/schemas/Id'
        businessType:
          type: string
          enum: [INBOUND]
        businessId:
          $ref: '#/components/schemas/Id'
        businessItemId:
          $ref: '#/components/schemas/Id'
        lockVersion:
          type: integer
          format: int64
          minimum: 0
        acquiredAt:
          $ref: '#/components/schemas/Instant'
    InboundReceiptSnapshot:
      type: object
      additionalProperties: false
      required: [parameterVersionId, businessDate, timezone, adminDecisionDeadlineWorkdays, warehouseClaimDeadlineWorkdays, warehouseFirstExecutionDeadlineWorkdays]
      description: >-
        Effective parameter and business-date snapshot for the receipt. While DRAFT,
        businessDate and snapshot.businessDate change atomically; parameter version,
        timezone, and deadline-day settings remain those captured at creation. A
        successful submission freezes every snapshot field for all later states.
      properties:
        parameterVersionId:
          $ref: '#/components/schemas/Id'
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        timezone:
          type: string
          minLength: 1
        adminDecisionDeadlineWorkdays:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
        warehouseClaimDeadlineWorkdays:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
        warehouseFirstExecutionDeadlineWorkdays:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
    InboundReceiptCreateRequest:
      type: object
      additionalProperties: false
      required: [businessDate, items]
      description: >-
        Creator-only draft input. The server assigns the permanent INBOUND_RECEIPT
        business number; callers cannot provide receiptNumber or status.
      properties:
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        defaultTargetWarehouse:
          $ref: '#/components/schemas/InboundTargetReference'
          description: Optional batch default overridden by an item's targetWarehouse.
        defaultTargetLocation:
          $ref: '#/components/schemas/InboundTargetReference'
          description: Optional batch default overridden by an item's targetLocation.
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/InboundReceiptItemInput'
        notes:
          type: string
          maxLength: 2000
    InboundReceiptUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Creator-only PATCH for a DRAFT receipt. Omitted fields remain unchanged; status,
        receiptNumber, creator, and parameterVersionId are never client-editable. A
        businessDate change updates the receipt businessDate and snapshot.businessDate
        atomically; successful submission freezes that date against later writes.
      properties:
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        defaultTargetWarehouse:
          $ref: '#/components/schemas/InboundTargetReference'
        defaultTargetLocation:
          $ref: '#/components/schemas/InboundTargetReference'
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/InboundReceiptItemInput'
        notes:
          type: string
          maxLength: 2000
    InboundReceiptCancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    InboundDecisionResult:
      type: string
      enum: [APPROVED, REJECTED]
    InboundApproveRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVED]
        comment:
          type: string
          maxLength: 1000
    InboundRejectRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [REJECTED]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    InboundDecisionRequest:
      description: One administrator approval, or a rejection with a required reason.
      oneOf:
        - $ref: '#/components/schemas/InboundApproveRequest'
        - $ref: '#/components/schemas/InboundRejectRequest'
    InboundApprovalScopeItem:
      type: object
      additionalProperties: false
      required: [receiptItemId, asset, targetWarehouse, targetLocation]
      properties:
        receiptItemId:
          $ref: '#/components/schemas/Id'
        asset:
          $ref: '#/components/schemas/InboundAssetReference'
        targetWarehouse:
          $ref: '#/components/schemas/InboundTargetReference'
        targetLocation:
          $ref: '#/components/schemas/InboundTargetReference'
    InboundApprovalScope:
      type: object
      additionalProperties: false
      required: [receiptVersion, items]
      description: Immutable approved or rejected scope captured from one submitted receipt version.
      properties:
        receiptVersion:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InboundApprovalScopeItem'
    InboundDecision:
      type: object
      additionalProperties: false
      required: [id, result, decidedReceiptVersion, decidedBy, decidedAt, scope]
      description: The one effective administrator decision for a submitted receipt version.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        result:
          $ref: '#/components/schemas/InboundDecisionResult'
        decidedReceiptVersion:
          type: integer
          format: int64
          minimum: 0
        decidedBy:
          $ref: '#/components/schemas/AssetCreatorReference'
        decidedAt:
          $ref: '#/components/schemas/Instant'
        comment:
          type: string
        scope:
          $ref: '#/components/schemas/InboundApprovalScope'
    InboundProcessingOwnership:
      type: object
      additionalProperties: false
      required: [processor, claimedAt, ownershipVersion]
      description: >-
        Persistent whole-receipt warehouse write ownership. It is separate from asset
        business locks and survives logout, timeout, device changes, and application restart.
      properties:
        processor:
          $ref: '#/components/schemas/AssetCreatorReference'
        claimedAt:
          $ref: '#/components/schemas/Instant'
        ownershipVersion:
          type: integer
          format: int64
          minimum: 0
        archivedAt:
          $ref: '#/components/schemas/Instant'
          description: Present when a terminal receipt archives this ownership and removes write authority.
    InboundAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [assetVersion, lockVersion, observedAssetCode]
      properties:
        assetVersion:
          type: integer
          format: int64
          minimum: 0
        lockVersion:
          type: integer
          format: int64
          minimum: 0
        observedAssetCode:
          type: string
          minLength: 1
          maxLength: 128
        notes:
          type: string
          maxLength: 1000
    InboundAcceptanceRecord:
      type: object
      additionalProperties: false
      required: [id, receiptItemId, assetId, acceptedBy, acceptedAt, businessDate, receiptVersionBefore, assetVersionBefore, assetVersionAfter, lockVersion, observedAssetCode, storageCustody]
      description: Immutable physical acceptance fact for one receipt item and one asset.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        receiptItemId:
          $ref: '#/components/schemas/Id'
        assetId:
          $ref: '#/components/schemas/Id'
        acceptedBy:
          $ref: '#/components/schemas/AssetCreatorReference'
        acceptedAt:
          $ref: '#/components/schemas/Instant'
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        receiptVersionBefore:
          type: integer
          format: int64
          minimum: 0
        assetVersionBefore:
          type: integer
          format: int64
          minimum: 0
        assetVersionAfter:
          type: integer
          format: int64
          minimum: 0
        lockVersion:
          type: integer
          format: int64
          minimum: 0
        observedAssetCode:
          type: string
        storageCustody:
          $ref: '#/components/schemas/AssetCustodySummary'
        notes:
          type: string
    InboundAcceptedAsset:
      type: object
      additionalProperties: false
      required: [id, assetCode, lifecycle, exception, cardStage, version, currentCustody, inboundBusinessDate]
      description: Minimal post-acceptance asset result; the full asset ledger remains separately scoped.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        assetCode:
          type: string
        lifecycle:
          $ref: '#/components/schemas/AssetLifecycle'
        exception:
          $ref: '#/components/schemas/AssetException'
        cardStage:
          $ref: '#/components/schemas/AssetCardStage'
        version:
          type: integer
          format: int64
          minimum: 0
        currentCustody:
          $ref: '#/components/schemas/AssetCustodySummary'
        inboundBusinessDate:
          $ref: '#/components/schemas/BusinessDate'
    InboundAcceptanceResult:
      type: object
      additionalProperties: false
      required: [receipt, item, asset]
      properties:
        receipt:
          $ref: '#/components/schemas/InboundReceipt'
        item:
          $ref: '#/components/schemas/InboundReceiptItem'
        asset:
          $ref: '#/components/schemas/InboundAcceptedAsset'
    InboundReceipt:
      type: object
      additionalProperties: false
      required: [id, receiptNumber, status, businessDate, createdBy, createdAt, version, parameterVersionId, snapshot, items]
      description: >-
        Inbound receipt aggregate. receiptNumber is a server-assigned permanent business
        number from the INBOUND_RECEIPT rule; every asset and target warehouse/location
        reference has a versioned code/name snapshot retained for history. No multi-level
        approval or procurement acceptance is implied.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        receiptNumber:
          type: string
          minLength: 1
          description: Server-assigned permanent business number; clients never provide it.
        status:
          $ref: '#/components/schemas/InboundReceiptStatus'
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        createdBy:
          $ref: '#/components/schemas/AssetCreatorReference'
        createdAt:
          $ref: '#/components/schemas/Instant'
        submittedAt:
          $ref: '#/components/schemas/Instant'
          description: First successful submission instant, retained after cancellation or rejection.
        adminDecisionDueAt:
          $ref: '#/components/schemas/Instant'
          description: Deadline computed at submission from the frozen parameter/calendar snapshot.
        warehouseClaimDueAt:
          $ref: '#/components/schemas/Instant'
          description: Deadline computed at approval from the frozen parameter/calendar snapshot.
        decision:
          $ref: '#/components/schemas/InboundDecision'
          description: The one effective administrator decision; absent before a decision wins.
        currentProcessor:
          $ref: '#/components/schemas/InboundProcessingOwnership'
          description: >-
            Unique whole-receipt warehouse owner; absent until an explicit claim wins.
            A terminal receipt retains it with archivedAt solely as history and write access is revoked.
        warehouseFirstExecutionDueAt:
          $ref: '#/components/schemas/Instant'
          description: First-execution deadline computed at claim from the frozen calendar snapshot.
        version:
          type: integer
          format: int64
          minimum: 0
        parameterVersionId:
          $ref: '#/components/schemas/Id'
        snapshot:
          $ref: '#/components/schemas/InboundReceiptSnapshot'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InboundReceiptItem'
        notes:
          type: string
        cancelledAt:
          $ref: '#/components/schemas/Instant'
        cancellationReason:
          type: string
        completedAt:
          $ref: '#/components/schemas/Instant'
    PageInboundReceipt:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InboundReceipt'
paths:
  /attachments/{objectId}/download-grant:
    parameters:
      - name: objectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Attachment]
      operationId: issueAttachmentDownloadGrant
      x-business-write: false
      x-exception-rationale: Stateless short-lived grant issuance after current authorization; no business data or version is mutated.
      summary: Issue a sixty-second address for a CLEAN attachment after current business authorization.
      description: The grant binds the object, account and current authorization version; session authentication remains required.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Short-lived same-origin download address.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAtEpochSecond]
                properties:
                  url: { type: string }
                  expiresAtEpochSecond: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /asset-import-batches/template:
    get:
      tags: [AssetImport]
      operationId: getAssetImportTemplate
      summary: Download the visible XLSX asset import template and instructions.
      x-actor: { required: true, roles: [WAREHOUSE_OPERATOR] }
      responses:
        '200':
          description: XLSX workbook with asset columns and a visible instruction sheet.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /asset-import-batches:
    post:
      tags: [AssetImport]
      operationId: uploadAssetImportBatch
      summary: Persist one immutable XLSX import source under an idempotency key.
      x-business-write: true
      x-actor: { required: true, roles: [WAREHOUSE_OPERATOR] }
      x-non-applicable: [version]
      x-exception-rationale: A new upload has no existing aggregate version; the actor and request key deduplicate its immutable source.
      x-transaction:
        boundary: Persist the immutable source, upload identity, and batch event together; replay returns the same batch.
      x-audit-event: { event: ASSET_IMPORT_UPLOADED }
      x-error-codes: [ASSET_IMPORT_FILE_LIMIT, ASSET_IMPORT_INVALID_XLSX, ASSET_IMPORT_UPLOAD_CONFLICT]
      x-required-error-statuses: [400, 401, 403, 409, 413]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created batch or matching replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: XLSX exceeds the 20 MB upload boundary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /asset-import-batches/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AssetImport]
      operationId: getAssetImportBatch
      summary: Read the caller's current import batch and preview version.
      x-actor: { required: true, roles: [WAREHOUSE_OPERATOR] }
      responses:
        '200':
          description: Owned batch status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /asset-import-batches/{batchId}/preview:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [AssetImport]
      operationId: previewAssetImportBatch
      summary: Replace an unconfirmed row preflight using the selected column mapping.
      x-business-write: true
      x-actor: { required: true, roles: [WAREHOUSE_OPERATOR] }
      x-version:
        required: true
        precondition: If-Match-Version equals the current previewVersion; competing mappings cannot silently overwrite a preview.
      x-non-applicable: [idempotency]
      x-exception-rationale: Preview is replaceable by the same actor and protected by expected previewVersion; a lost response is recovered through GET.
      x-transaction:
        boundary: Lock the owned batch, replace all row results, increment previewVersion, and append one batch event atomically.
      x-audit-event: { event: ASSET_IMPORT_PREVIEWED }
      x-error-codes: [ASSET_IMPORT_MAPPING_INVALID, ASSET_IMPORT_VERSION_CONFLICT, ASSET_IMPORT_LOCKED]
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetImportMappingRequest' }
      responses:
        '200':
          description: Ready and error row counts with the first 100 cell errors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /asset-import-batches/{batchId}/columns:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AssetImport]
      operationId: getAssetImportColumns
      summary: Read the uploaded XLSX header for interactive field mapping.
      x-actor: { required: true, roles: [WAREHOUSE_OPERATOR] }
      responses:
        '200':
          description: Caller-owned visible uploaded columns.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportColumnList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /asset-import-batches/{batchId}/rows:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AssetImport]
      operationId: listAssetImportRows
      summary: Page through preflight rows, optionally selecting ready or error rows.
      x-actor: { required: true, roles: [WAREHOUSE_OPERATOR] }
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [READY, ERROR] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Caller-owned row page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportRowPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /asset-import-batches/{batchId}/preflight-report:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AssetImport]
      operationId: downloadAssetImportPreflightReport
      summary: Download caller-owned preflight results with original values and cell errors.
      x-actor: { required: true, roles: [WAREHOUSE_OPERATOR] }
      responses:
        '200':
          description: UTF-8 CSV; publication results are a later operation.
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /attachments/{objectId}/content:
    parameters:
      - name: objectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Attachment]
      operationId: readAttachmentContent
      summary: Recheck current permissions and scan state before reading immutable attachment bytes.
      parameters:
        - name: grant
          in: query
          required: true
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Attachment content with no-store, nosniff and an encoded attachment filename.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Attachment storage is unavailable. }
  /inbound-receipts/{receiptId}/attachments:
    parameters:
      - $ref: '#/components/parameters/InboundReceiptId'
    get:
      tags: [Attachment]
      operationId: listInboundAttachments
      summary: List active attachment metadata within current inbound read permissions.
      responses:
        '200':
          description: Attachment metadata; no file paths or download grants.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        objectId: { type: string, format: uuid }
                        filename: { type: string }
                        contentType: { type: string }
                        sizeBytes: { type: integer, format: int64 }
                        scanStatus: { type: string, enum: [CLEAN, INFECTED, UNAVAILABLE] }
                        businessVersion: { type: integer, format: int64 }
                        createdAt: { type: string, format: date-time }
                        revisionNumber: { type: integer, minimum: 1 }
                        previousObjectId: { type: string, format: uuid, nullable: true }
                        nextObjectId: { type: string, format: uuid, nullable: true }
                        correctionReason: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Inbound]
      operationId: uploadInboundAttachment
      x-error-codes: [INBOUND_ATTACHMENT_READ_ONLY, INBOUND_VERSION_CONFLICT]
      x-required-error-statuses: [400, 401, 403, 404, 409, 413, 503]
      summary: Append quarantined evidence to a writable inbound receipt.
      x-business-write: true
      x-audit-event:
        event: ATTACHMENT_UPLOADED
      x-actor:
        required: true
        roles: [WAREHOUSE_OPERATOR]
      x-version:
        required: true
        precondition: Current receipt version; replay uses the original request version.
      x-transaction:
        boundary: Register metadata, reserve quotas, advance receipt version and record replay atomically.
      x-invariants: >-
        Only a draft creator or current exclusive warehouse processor may append evidence.
        Revalidate current account authorization after scanning and before registration.
        Submitted and completed evidence is immutable. An uploader's same key and payload
        returns the original attachment and original scan result; different payload conflicts.
        No download grant is returned. Only CLEAN attachments can later obtain download grants.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Registered quarantined attachment, or the original idempotent result.
          content:
            application/json:
              schema:
                type: object
                required: [objectId, filename, contentType, sizeBytes, scanStatus, businessVersion]
                properties:
                  objectId: { type: string, format: uuid }
                  filename: { type: string }
                  contentType: { type: string }
                  sizeBytes: { type: integer, format: int64 }
                  scanStatus: { type: string, enum: [CLEAN, INFECTED, UNAVAILABLE] }
                  businessVersion: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: Multipart request exceeds the upload limit.
        '503':
          description: Quarantine storage could not accept the upload.
  /inbound-receipts/{receiptId}/attachments/{objectId}/corrections:
    parameters:
      - $ref: '#/components/parameters/InboundReceiptId'
      - name: objectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Inbound]
      operationId: correctInboundAttachment
      x-error-codes: [INBOUND_ATTACHMENT_READ_ONLY, INBOUND_VERSION_CONFLICT]
      x-required-error-statuses: [400, 401, 403, 404, 409, 413, 503]
      summary: Append an immutable correction version to a writable inbound attachment.
      x-business-write: true
      x-audit-event:
        event: ATTACHMENT_CORRECTED
      x-actor:
        required: true
        roles: [WAREHOUSE_OPERATOR]
      x-version:
        required: true
        precondition: Current receipt version; replay uses the original request version.
      x-transaction:
        boundary: Register metadata, reserve quotas, advance receipt version and record replay atomically.
      x-invariants: >-
        Only a draft creator or current exclusive warehouse processor may append evidence.
        Revalidate current account authorization after scanning and before registration.
        Submitted and completed evidence is immutable. An uploader's same key and payload
        returns the original attachment and original scan result; different payload, original attachment or correction reason conflicts.
        Original evidence remains unchanged and retained versions count toward quotas.
        No download grant is returned. Only CLEAN attachments can later obtain download grants.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, reason]
              properties:
                file: { type: string, format: binary }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: Registered quarantined attachment, or the original idempotent result.
          content:
            application/json:
              schema:
                type: object
                required: [objectId, filename, contentType, sizeBytes, scanStatus, businessVersion]
                properties:
                  objectId: { type: string, format: uuid }
                  filename: { type: string }
                  contentType: { type: string }
                  sizeBytes: { type: integer, format: int64 }
