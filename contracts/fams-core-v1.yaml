        A WAREHOUSE_OPERATOR may read its own DRAFT card. A DRAFT owned by another account
        and a card cancelled before first submission are returned as ASSET_NOT_FOUND unless
        the caller is their creator. ASSET_ADMIN and WAREHOUSE_OPERATOR receive the
        enterprise business view for PENDING_INBOUND and ACTIVE cards. AUDIT_READ_ONLY is
