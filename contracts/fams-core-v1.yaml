  /asset-import-batches:
    post:
      tags: [AssetImport]
      operationId: uploadAssetImportBatch
      summary: Persist one immutable XLSX import source under an idempotency key.
      x-business-write: true
      x-actor: { required: true, roles: [WAREHOUSE_OPERATOR] }
      x-non-applicable: [version]
      x-exception-rationale: A new upload has no existing aggregate version; the actor and request key deduplicate its immutable source.
      x-transaction:
        boundary: Persist the immutable source, upload identity, and batch event together; replay returns the same batch.
      x-audit-event: { event: ASSET_IMPORT_UPLOADED }
      x-error-codes: [ASSET_IMPORT_FILE_LIMIT, ASSET_IMPORT_INVALID_XLSX, ASSET_IMPORT_UPLOAD_CONFLICT]
      x-required-error-statuses: [400, 401, 403, 409, 413]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created batch or matching replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: XLSX exceeds the 20 MB upload boundary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /asset-import-batches/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AssetImport]
      operationId: getAssetImportBatch
      summary: Read the caller's current import batch and preview version.
      x-actor: { required: true, roles: [WAREHOUSE_OPERATOR] }
      responses:
        '200':
          description: Owned batch status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /asset-import-batches/{batchId}/preview:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [AssetImport]
      operationId: previewAssetImportBatch
      summary: Replace an unconfirmed row preflight using the selected column mapping.
      x-business-write: true
      x-actor: { required: true, roles: [WAREHOUSE_OPERATOR] }
      x-version:
        required: true
        precondition: If-Match-Version equals the current previewVersion; competing mappings cannot silently overwrite a preview.
      x-non-applicable: [idempotency]
      x-exception-rationale: Preview is replaceable by the same actor and protected by expected previewVersion; a lost response is recovered through GET.
      x-transaction:
        boundary: Lock the owned batch, replace all row results, increment previewVersion, and append one batch event atomically.
      x-audit-event: { event: ASSET_IMPORT_PREVIEWED }
      x-error-codes: [ASSET_IMPORT_MAPPING_INVALID, ASSET_IMPORT_VERSION_CONFLICT, ASSET_IMPORT_LOCKED]
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetImportMappingRequest' }
      responses:
        '200':
          description: Ready and error row counts with the first 100 cell errors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /asset-import-batches/{batchId}/columns:
