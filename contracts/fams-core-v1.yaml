  /assets/{assetId}/copy:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [Assets]
      operationId: copyAsset
      summary: Copy a visible non-cancelled asset into independent numbered drafts.
      x-business-write: true
      x-actor:
        required: true
        roles: [WAREHOUSE_OPERATOR]
      x-version:
        required: true
        precondition: If-Match-Version must equal the source asset version and its reference snapshot must still be current.
      x-transaction:
        boundary: Reserve the requested number segment and persist every independent card atomically; failure cannot leave a partial set of cards.
      x-audit-event:
        event: ASSET_DRAFT_COPIED
      x-error-codes: [ASSET_COPY_QUANTITY_INVALID, ASSET_NOT_FOUND, ASSET_SOURCE_CANCELLED, ASSET_REFERENCE_VERSION_CONFLICT, ASSET_CODE_ALLOCATION_CONFLICT]
      x-invariants: >-
        Quantity is from 1 through 100. A DRAFT source is visible to and copyable by only
        its creator; another account receives ASSET_NOT_FOUND. For PENDING_INBOUND or ACTIVE
        sources, a warehouse operator may copy any asset visible through the enterprise
        business view, including in-stock and in-use assets; source creator does not restrict
        those submitted cards, and a source business lock does not block a read-only copy.
        The source version, stage-aware data scope, and reference snapshot are still checked.
        Each new card receives an
        independent permanent assetCode, is owned by the calling warehouse operator,
        and starts as DRAFT. Copy only category, brand, manufacturer, model, unit,
        and extension values; never copy serial, status, planned or formal custody,
        organization, usage mode, responsibility, attachments, or history. A failed
        number segment may leave a permanent gap, but the transaction never leaves a
        partial card set. A CANCELLED source is rejected.
