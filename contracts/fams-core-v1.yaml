    parameters:
      - $ref: '#/components/parameters/NumberingRuleId'
    post:
      tags: [MasterData]
      operationId: enableNumberingRule
      summary: Enable a numbering rule after namespace and category checks.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the stored numbering-rule version.
      x-transaction:
        boundary: Validate current-target overlap and category prefixes, then enable and audit in one short transaction.
      x-audit-event:
        event: NUMBERING_RULE_ENABLED
      x-error-codes: [NUMBERING_RULE_ALREADY_ENABLED, NUMBERING_RULE_TARGET_CONFLICT, NUMBERING_CATEGORY_PREFIX_MISSING, NUMBERING_CATEGORY_PREFIX_CONFLICT, NUMBERING_MODE_NOT_ALLOWED_FOR_TARGET, NUMBERING_RULE_FIXED_PREFIX_NOT_ALLOWED]
      x-allowed-target-modes: ['ASSET:ENTERPRISE', 'ASSET:CATEGORY_PREFIX', 'INBOUND_RECEIPT:ENTERPRISE']
      x-rejected-target-modes: ['INBOUND_RECEIPT:CATEGORY_PREFIX']
      x-rejected-prefix-combinations: ['CATEGORY_PREFIX:fixedPrefix']
      x-combination-validation: >-
        CATEGORY_PREFIX is valid only for ASSET and derives its prefix from the
        active AssetCategory.numberingPrefix. INBOUND_RECEIPT is valid only with
        ENTERPRISE mode because its business number uses an independent enterprise
        sequence. CATEGORY_PREFIX must omit fixedPrefix; ENTERPRISE may optionally
        carry fixedPrefix. Any rejected target or mode combination returns 400.
      x-invariants: Only one current rule may be enabled for each target; overlap returns 409. CATEGORY_PREFIX requires every selectable category to have a legal, non-ambiguous prefix; missing or conflicting prefixes are rejected.
      x-allocation-policy:
        internal-only: true
        failure-gap: Enabling does not reserve numbers; any failed or cancelled allocation gap remains permanent and is never reused.
        preview: Enabling never provides a preview that reserves a number.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogStatusChangeRequest'
      responses:
        '200':
          description: Enabled numbering rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberingRule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /mini/auth/login:
    post:
      tags: [MiniAuth]
      operationId: miniLogin
      summary: Exchange a server-verified WeChat login identity for a bounded session.
      security: []
      x-business-write: false
