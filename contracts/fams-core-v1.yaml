      x-filter-semantics:
        identity: Asset code, name, serial number, category, lifecycle, and exception filters are conjunctive.
        organizations: >-
          Owning organization and using organization are distinct criteria; warehouse and
          location match the current formal custody rather than a planned inbound target.
        responsibility: >-
          Responsible employee selects PERSONAL custody, while department responsible
          employee selects the exclusive SHARED custody executor.
        current-work: >-
          Current processor and business receipt match the active unsettled business relation;
          a receipt id or exact receipt number can be supplied.
        dates: >-
          Inbound and last-inventory date ranges are inclusive at both supplied boundaries.
        alerts: >-
          Borrow overdue and long uninventoried are server-derived business flags evaluated
          from the frozen business rule and calendar inputs applicable to the record.
        authorization: >-
          Every filter is intersected with current permission scope; saved criteria, identifiers,
