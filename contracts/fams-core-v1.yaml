        - $ref: '#/components/parameters/AssetInboundDateFromFilter'
        - $ref: '#/components/parameters/AssetInboundDateToFilter'
        - $ref: '#/components/parameters/AssetLastInventoryDateFromFilter'
        - $ref: '#/components/parameters/AssetLastInventoryDateToFilter'
        - $ref: '#/components/parameters/AssetBorrowOverdueFilter'
        - $ref: '#/components/parameters/AssetLongUninventoriedFilter'
