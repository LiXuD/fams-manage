    DataScopeType:
      type: string
      enum: [SELF, OWN_ORGANIZATION, OWN_ORGANIZATION_AND_DESCENDANTS, SPECIFIED_ORGANIZATIONS, SPECIFIED_WAREHOUSES, ENTERPRISE]
      description: Controlled V1 vocabulary for general data access; it does not replace business-relation checks.
    SensitiveFieldPermission:
      type: string
      enum: [EMPLOYEE_PHONE, ASSET_SERVICE_PHONE, BUSINESS_ATTACHMENT, REPAIR_COST, BULK_EXPORT, SCRAP_ATTACHMENT, SYSTEM_OPERATION_LOG]
      description: Independently granted field or action capabilities; none is implied by record visibility.
    DataScopeGrant:
      type: object
      additionalProperties: false
      required: [scopeType, organizations, warehouses]
      description: >-
        One current general data scope. SPECIFIED_ORGANIZATIONS requires a non-empty
        organizations array and an empty warehouses array; SPECIFIED_WAREHOUSES requires
        the inverse. Other scope types require both arrays empty. Every referenced row and
        version must be current when configured and is re-evaluated on every business read.
      properties:
        scopeType:
          $ref: '#/components/schemas/DataScopeType'
        organizations:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrganizationReference'
        warehouses:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CatalogReference'
    ReferenceStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    UsageMode:
      type: string
      enum: [PERSONAL, SHARED]
    AssetLifecycle:
      type: string
      enum: [WAITING_INBOUND, IN_STOCK, IN_USE, BORROWED, UNDER_REPAIR, FACTORY_REPAIR, PENDING_SCRAP, SCRAPPED]
    AssetException:
      type: string
      enum: [NORMAL, SEARCHING, LOST]
    AssetCardStage:
      type: string
      enum: [DRAFT, PENDING_INBOUND, ACTIVE, CANCELLED]
    AssetCreatorReference:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
    AttachmentReference:
      type: object
      additionalProperties: false
      required: [id, version]
      description: Versioned attachment identity; attachment content and export permissions are separate concerns.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
    AssetCustodySummary:
      type: object
      description: >-
        Read-only formal custody summary. STORAGE is an in-warehouse custody with
        warehouse and location only; PERSONAL has one responsible employee and a
        using organization; SHARED has one department responsible employee and a
        fixed location. Owning organization is kept on the Asset and is distinct
        from usingOrganization. These custody variants are mutually exclusive.
        Planned inbound targets are not current custody.
      oneOf:
        - type: object
          additionalProperties: false
          required: [custodyType, warehouse, location]
          properties:
            custodyType:
              type: string
              enum: [STORAGE]
            warehouse:
              $ref: '#/components/schemas/CatalogReference'
            location:
              $ref: '#/components/schemas/CatalogReference'
        - type: object
          additionalProperties: false
          required: [custodyType, usingOrganization, responsibleEmployee, location]
          properties:
            custodyType:
              type: string
              enum: [PERSONAL]
            usingOrganization:
              $ref: '#/components/schemas/OrganizationReference'
            responsibleEmployee:
              $ref: '#/components/schemas/EmployeeReference'
            location:
              $ref: '#/components/schemas/CatalogReference'
        - type: object
          additionalProperties: false
          required: [custodyType, usingOrganization, departmentResponsibleEmployee, location]
          properties:
            custodyType:
              type: string
              enum: [SHARED]
            usingOrganization:
              $ref: '#/components/schemas/OrganizationReference'
            departmentResponsibleEmployee:
              $ref: '#/components/schemas/EmployeeReference'
            location:
              $ref: '#/components/schemas/CatalogReference'
    AssetBusinessSummary:
      type: object
      additionalProperties: false
      required: [unsettledBusinessCount, overdueBusinessCount]
      description: Read-only summary of formal custody and current unsettled business relations.
      properties:
        unsettledBusinessCount:
          type: integer
          format: int32
          minimum: 0
        overdueBusinessCount:
          type: integer
          format: int32
          minimum: 0
        latestBusinessReference:
          $ref: '#/components/schemas/Id'
        currentBusinessId:
          $ref: '#/components/schemas/Id'
        currentBusinessNumber:
          type: string
        currentBusinessType:
          type: string
        currentProcessor:
          $ref: '#/components/schemas/AssetCreatorReference'
    Asset:
      type: object
      additionalProperties: false
      required: [id, assetCode, name, lifecycle, exception, cardStage, version, createdBusinessDate, createdAt, parameterVersionId]
      description: >-
        Asset card and ledger read model. planned inbound warehouse and location are
        not formal custody; currentCustody is established only after inbound acceptance.
        Sensitive service fields, attachments, and export are separately authorized.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        assetCode:
          type: string
          description: Server-assigned enterprise-unique permanent code; never reused.
        name:
          type: string
        category:
          $ref: '#/components/schemas/CatalogReference'
        model:
          type: string
        unit:
          type: string
        organization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Owning organization; distinct from any usingOrganization in formal custody.
        usageMode:
          $ref: '#/components/schemas/UsageMode'
          description: Formal PERSONAL or SHARED use; absent while the asset remains in storage.
        plannedInboundWarehouse:
          $ref: '#/components/schemas/CatalogReference'
        plannedInboundLocation:
          $ref: '#/components/schemas/CatalogReference'
        brand:
          $ref: '#/components/schemas/CatalogReference'
        manufacturer:
          $ref: '#/components/schemas/CatalogReference'
        serialNumber:
          type: string
        acquisitionDate:
          $ref: '#/components/schemas/BusinessDate'
        warrantyExpiryDate:
          $ref: '#/components/schemas/BusinessDate'
        serviceProvider:
          type: string
        serviceContact:
