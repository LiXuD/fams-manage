            items:
              type: array
              items:
                $ref: '#/components/schemas/NumberingRule'
    BusinessParameterVersionStatus:
      type: string
      enum: [ACTIVE, SUPERSEDED]
    BusinessParameterSnapshot:
      type: object
      additionalProperties: false
      required:
        - timezone
        - workWeek
        - holidays
        - adjustedWorkdays
        - adminDecisionDeadlineWorkdays
        - warehouseClaimDeadlineWorkdays
        - warehouseFirstExecutionDeadlineWorkdays
        - handoverAcceptanceDeadlineNaturalDays
        - notificationEscalationThresholds
      description: >-
        Immutable business-parameter snapshot. Timezone is a legal IANA ZoneId;
        calendar dates use BusinessDate and instants use UTC Instant. Natural days
        run from 00:00 through 24:00 in this timezone; workday deadlines use this
        snapshot's work week and calendar. Holidays and adjusted workdays must be
        unique and cannot overlap. Existing object deadlines are not recalculated
        when a later snapshot becomes active.
      properties:
        timezone:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9._+-]*(?:/[A-Za-z0-9._+-]+)*$'
          default: Asia/Shanghai
          description: IANA timezone identifier validated by the server's ZoneId database.
        workWeek:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        holidays:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BusinessDate'
        adjustedWorkdays:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BusinessDate'
        adminDecisionDeadlineWorkdays:
          type: integer
          format: int32
          minimum: 1
          default: 2
          x-unit: workdays
          description: Positive administrator decision deadline measured in this version's workdays.
        warehouseClaimDeadlineWorkdays:
          type: integer
          format: int32
          minimum: 1
          default: 1
          x-unit: workdays
          description: Positive warehouse claim deadline measured in this version's workdays.
        warehouseFirstExecutionDeadlineWorkdays:
          type: integer
          format: int32
          minimum: 1
          default: 2
          x-unit: workdays
          description: Positive first-execution deadline measured in this version's workdays.
        handoverAcceptanceDeadlineNaturalDays:
          type: integer
          format: int32
          minimum: 1
          default: 3
          x-unit: natural-days
          description: Positive handover-acceptance deadline measured in natural days in this version's timezone.
        notificationEscalationThresholds:
          $ref: '#/components/schemas/NotificationEscalationThresholds'
          description: Controlled notification thresholds; workday and natural-day units are not converted to one minute value.
    NotificationEscalationThresholds:
      type: object
      additionalProperties: false
      required:
        - administratorUnreadHours
        - onDutyWarehouseOperatorUnreadHours
        - firstExecutionOverdueNaturalDays
        - receiptDueUnreadHours
      description: >-
        Controlled notification escalation thresholds. Hours are elapsed hours;
        natural-days use the parameter version's timezone. These thresholds are
        intentionally not flattened into a single minute value.
      properties:
        administratorUnreadHours:
          type: integer
          format: int32
          minimum: 1
          default: 4
          x-unit: hours
          description: Administrator unread escalation threshold in elapsed hours.
        onDutyWarehouseOperatorUnreadHours:
          type: integer
          format: int32
          minimum: 1
          default: 4
          x-unit: hours
          description: On-duty warehouse-operator unread escalation threshold in elapsed hours.
        firstExecutionOverdueNaturalDays:
          type: integer
          format: int32
          minimum: 1
          default: 1
          x-unit: natural-days
          description: Escalate one natural day after the first-execution deadline is overdue.
        receiptDueUnreadHours:
          type: integer
          format: int32
          minimum: 1
          default: 24
          x-unit: hours
          description: Receipt-due unread escalation threshold in elapsed hours.
    BusinessParameterVersionActor:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          description: System-account username recorded for the atomic audit event.
    BusinessParameterVersionCreateRequest:
      type: object
      additionalProperties: false
      required: [snapshot]
      description: >-
        Full replacement snapshot for a new immutable version. The current version
        is guarded by If-Match-Version; a stale value is a version conflict. There
        is no future scheduled version in V1.
      properties:
        snapshot:
          $ref: '#/components/schemas/BusinessParameterSnapshot'
    BusinessParameterVersion:
      type: object
      additionalProperties: false
      required: [id, version, status, effectiveAt, actor, snapshot]
      description: >-
        Immutable parameter version. A newly created version becomes ACTIVE
        immediately and supersedes the previous version. Newly created business
        objects store parameterVersionId and the computed deadline snapshot; existing
        documents, todos, and deadlines are not recalculated, and historical business
        dates are not reinterpreted when a later timezone changes.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/BusinessParameterVersionStatus'
        effectiveAt:
          $ref: '#/components/schemas/Instant'
        actor:
          $ref: '#/components/schemas/BusinessParameterVersionActor'
        snapshot:
          $ref: '#/components/schemas/BusinessParameterSnapshot'
    PageBusinessParameterVersion:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BusinessParameterVersion'
    ConfigurationAnomalyType:
      type: string
      enum: [NO_ASSET_ADMIN, NO_WAREHOUSE_OPERATOR, SMS_CHANNEL_MISSING, WECHAT_TEMPLATE_MISSING]
    ConfigurationAnomalyStatus:
      type: string
      enum: [OPEN, RESOLVED]
    TodoReference:
      type: object
      additionalProperties: false
      required: [id, kind, parameterVersionId, deadline]
      description: Original pending work is retained with its request, parameter version, and deadline history.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
        parameterVersionId:
          $ref: '#/components/schemas/Id'
        deadline:
          $ref: '#/components/schemas/Instant'
        status:
          type: string
    ConfigurationAnomaly:
      type: object
      additionalProperties: false
      required: [id, type, status, detectedAt, dedupKey, relatedTodos]
      description: >-
        Read-only configuration anomaly. System facts may automatically mark an
        anomaly RESOLVED; resolvedAt is required for RESOLVED and omitted while OPEN.
        There is no manual ignore, delete, or close operation, and related todos are
        retained with their original request, parameter version, and deadline.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/ConfigurationAnomalyType'
        status:
          $ref: '#/components/schemas/ConfigurationAnomalyStatus'
        detectedAt:
          $ref: '#/components/schemas/Instant'
        resolvedAt:
          type: string
          format: date-time
          description: UTC Instant required when status is RESOLVED and omitted when status is OPEN.
        dedupKey:
          type: string
          minLength: 1
          description: Stable key used to deduplicate an open anomaly.
        relatedTodos:
          type: array
          items:
            $ref: '#/components/schemas/TodoReference'
    PageConfigurationAnomaly:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ConfigurationAnomaly'
    InboundReceiptStatus:
      type: string
      enum: [DRAFT, PENDING_ADMIN_DECISION, REJECTED, WAITING_WAREHOUSE_CLAIM, WAREHOUSE_PROCESSING, COMPLETED, CANCELLED]
      description: V1 receipt states; administrator decision and warehouse acceptance are separate operations.
    InboundAssetReference:
      type: object
      additionalProperties: false
      required: [id, version]
      description: >-
        Versioned asset identity selected for a draft. The server validates that the
        card is DRAFT, WAITING_INBOUND, NORMAL, and has no active business lock.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
    InboundTargetReference:
      type: object
      additionalProperties: false
      required: [id, version]
      description: >-
        Versioned warehouse or location identity. The server requires an enabled
        reference and checks that the final location belongs to the target warehouse.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
    InboundAssetSnapshot:
      type: object
      additionalProperties: false
      required: [assetCode, assetName]
      description: Server-captured asset code and name snapshot retained on the receipt item.
      properties:
        assetCode:
          type: string
          minLength: 1
        assetName:
          type: string
          minLength: 1
    InboundCatalogSnapshot:
      type: object
      additionalProperties: false
      required: [code, name]
      description: Server-captured code and name snapshot for an inbound target reference.
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    InboundReceiptItemInput:
      type: object
      additionalProperties: false
      required: [asset]
      description: >-
        Draft item input. A request may provide default targets and override them per
        item; before persistence every item must have an effective warehouse and location.
      properties:
        asset:
          $ref: '#/components/schemas/InboundAssetReference'
        targetWarehouse:
          $ref: '#/components/schemas/InboundTargetReference'
        targetLocation:
          $ref: '#/components/schemas/InboundTargetReference'
    InboundReceiptItemExecutionStatus:
      type: string
      enum: [PENDING, ACCEPTED]
      description: PENDING until the current processor records one successful physical acceptance.
    InboundReceiptItem:
      type: object
      additionalProperties: false
      required: [id, executionStatus, asset, assetSnapshot, targetWarehouse, targetLocation, warehouseSnapshot, locationSnapshot]
      description: >-
        Persisted item with versioned identities and immutable code/name snapshots for
        the asset, warehouse, and location selected for this receipt. businessLock is
        absent in DRAFT and present while a submitted receipt owns the active asset lock.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        executionStatus:
          $ref: '#/components/schemas/InboundReceiptItemExecutionStatus'
        asset:
          $ref: '#/components/schemas/InboundAssetReference'
        assetSnapshot:
          $ref: '#/components/schemas/InboundAssetSnapshot'
        targetWarehouse:
          $ref: '#/components/schemas/InboundTargetReference'
        targetLocation:
          $ref: '#/components/schemas/InboundTargetReference'
        warehouseSnapshot:
          $ref: '#/components/schemas/InboundCatalogSnapshot'
        locationSnapshot:
          $ref: '#/components/schemas/InboundCatalogSnapshot'
        businessLock:
          $ref: '#/components/schemas/InboundAssetBusinessLock'
        acceptance:
          $ref: '#/components/schemas/InboundAcceptanceRecord'
    InboundAssetBusinessLock:
      type: object
      additionalProperties: false
      required: [assetId, businessType, businessId, businessItemId, lockVersion, acquiredAt]
      description: >-
        Persistent active lock acquired at receipt submission. It survives restart,
        client timeout, and logout until a legal decision, cancellation, or acceptance
        transition releases it; it is independent of warehouse processing ownership.
      properties:
        assetId:
          $ref: '#/components/schemas/Id'
        businessType:
          type: string
          enum: [INBOUND]
        businessId:
          $ref: '#/components/schemas/Id'
        businessItemId:
          $ref: '#/components/schemas/Id'
        lockVersion:
          type: integer
          format: int64
          minimum: 0
        acquiredAt:
          $ref: '#/components/schemas/Instant'
    InboundReceiptSnapshot:
      type: object
      additionalProperties: false
      required: [parameterVersionId, businessDate, timezone, adminDecisionDeadlineWorkdays, warehouseClaimDeadlineWorkdays, warehouseFirstExecutionDeadlineWorkdays]
      description: >-
        Immutable parameter and business-date snapshot captured when the receipt draft
        is created. Later parameter versions do not reinterpret this receipt date or
        reset its administrator decision deadline.
      properties:
        parameterVersionId:
          $ref: '#/components/schemas/Id'
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        timezone:
          type: string
          minLength: 1
        adminDecisionDeadlineWorkdays:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
        warehouseClaimDeadlineWorkdays:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
        warehouseFirstExecutionDeadlineWorkdays:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
    InboundReceiptCreateRequest:
      type: object
      additionalProperties: false
      required: [businessDate, items]
      description: >-
        Creator-only draft input. The server assigns the permanent INBOUND_RECEIPT
        business number; callers cannot provide receiptNumber or status.
      properties:
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        defaultTargetWarehouse:
          $ref: '#/components/schemas/InboundTargetReference'
          description: Optional batch default overridden by an item's targetWarehouse.
        defaultTargetLocation:
          $ref: '#/components/schemas/InboundTargetReference'
          description: Optional batch default overridden by an item's targetLocation.
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/InboundReceiptItemInput'
        notes:
          type: string
          maxLength: 2000
    InboundReceiptUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Creator-only PATCH for a DRAFT receipt. Omitted fields remain unchanged; status,
        receiptNumber, creator, and parameterVersionId are never client-editable.
      properties:
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        defaultTargetWarehouse:
          $ref: '#/components/schemas/InboundTargetReference'
        defaultTargetLocation:
          $ref: '#/components/schemas/InboundTargetReference'
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/InboundReceiptItemInput'
        notes:
          type: string
          maxLength: 2000
    InboundReceiptCancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    InboundDecisionResult:
      type: string
      enum: [APPROVED, REJECTED]
    InboundApproveRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVED]
        comment:
          type: string
          maxLength: 1000
    InboundRejectRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [REJECTED]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    InboundDecisionRequest:
      description: One administrator approval, or a rejection with a required reason.
      oneOf:
        - $ref: '#/components/schemas/InboundApproveRequest'
        - $ref: '#/components/schemas/InboundRejectRequest'
    InboundApprovalScopeItem:
      type: object
      additionalProperties: false
      required: [receiptItemId, asset, targetWarehouse, targetLocation]
      properties:
        receiptItemId:
          $ref: '#/components/schemas/Id'
        asset:
          $ref: '#/components/schemas/InboundAssetReference'
        targetWarehouse:
          $ref: '#/components/schemas/InboundTargetReference'
        targetLocation:
          $ref: '#/components/schemas/InboundTargetReference'
    InboundApprovalScope:
      type: object
      additionalProperties: false
      required: [receiptVersion, items]
      description: Immutable approved or rejected scope captured from one submitted receipt version.
      properties:
        receiptVersion:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InboundApprovalScopeItem'
    InboundDecision:
      type: object
      additionalProperties: false
      required: [id, result, decidedReceiptVersion, decidedBy, decidedAt, scope]
      description: The one effective administrator decision for a submitted receipt version.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        result:
          $ref: '#/components/schemas/InboundDecisionResult'
        decidedReceiptVersion:
          type: integer
          format: int64
          minimum: 0
        decidedBy:
          $ref: '#/components/schemas/AssetCreatorReference'
        decidedAt:
          $ref: '#/components/schemas/Instant'
        comment:
          type: string
        scope:
          $ref: '#/components/schemas/InboundApprovalScope'
    InboundProcessingOwnership:
      type: object
      additionalProperties: false
      required: [processor, claimedAt, ownershipVersion]
      description: >-
        Persistent whole-receipt warehouse write ownership. It is separate from asset
        business locks and survives logout, timeout, device changes, and application restart.
      properties:
        processor:
          $ref: '#/components/schemas/AssetCreatorReference'
        claimedAt:
          $ref: '#/components/schemas/Instant'
        ownershipVersion:
          type: integer
          format: int64
          minimum: 0
        archivedAt:
          $ref: '#/components/schemas/Instant'
          description: Present when a terminal receipt archives this ownership and removes write authority.
    InboundAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [assetVersion, lockVersion, observedAssetCode]
      properties:
        assetVersion:
          type: integer
          format: int64
          minimum: 0
        lockVersion:
          type: integer
          format: int64
          minimum: 0
        observedAssetCode:
          type: string
          minLength: 1
          maxLength: 128
        notes:
          type: string
          maxLength: 1000
    InboundAcceptanceRecord:
      type: object
      additionalProperties: false
      required: [id, receiptItemId, assetId, acceptedBy, acceptedAt, businessDate, receiptVersionBefore, assetVersionBefore, assetVersionAfter, lockVersion, observedAssetCode, storageCustody]
      description: Immutable physical acceptance fact for one receipt item and one asset.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        receiptItemId:
          $ref: '#/components/schemas/Id'
        assetId:
          $ref: '#/components/schemas/Id'
        acceptedBy:
          $ref: '#/components/schemas/AssetCreatorReference'
        acceptedAt:
          $ref: '#/components/schemas/Instant'
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        receiptVersionBefore:
          type: integer
          format: int64
          minimum: 0
        assetVersionBefore:
          type: integer
          format: int64
          minimum: 0
        assetVersionAfter:
          type: integer
          format: int64
          minimum: 0
        lockVersion:
          type: integer
          format: int64
          minimum: 0
        observedAssetCode:
          type: string
        storageCustody:
          $ref: '#/components/schemas/AssetCustodySummary'
        notes:
          type: string
    InboundAcceptedAsset:
      type: object
      additionalProperties: false
      required: [id, assetCode, lifecycle, exception, cardStage, version, currentCustody, inboundBusinessDate]
      description: Minimal post-acceptance asset result; the full asset ledger remains separately scoped.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        assetCode:
          type: string
        lifecycle:
          $ref: '#/components/schemas/AssetLifecycle'
        exception:
          $ref: '#/components/schemas/AssetException'
        cardStage:
          $ref: '#/components/schemas/AssetCardStage'
        version:
          type: integer
          format: int64
          minimum: 0
        currentCustody:
          $ref: '#/components/schemas/AssetCustodySummary'
        inboundBusinessDate:
          $ref: '#/components/schemas/BusinessDate'
    InboundAcceptanceResult:
      type: object
      additionalProperties: false
      required: [receipt, item, asset]
      properties:
        receipt:
          $ref: '#/components/schemas/InboundReceipt'
        item:
          $ref: '#/components/schemas/InboundReceiptItem'
        asset:
          $ref: '#/components/schemas/InboundAcceptedAsset'
    InboundReceipt:
      type: object
      additionalProperties: false
      required: [id, receiptNumber, status, businessDate, createdBy, createdAt, version, parameterVersionId, snapshot, items]
      description: >-
        Inbound receipt aggregate. receiptNumber is a server-assigned permanent business
        number from the INBOUND_RECEIPT rule; every asset and target warehouse/location
        reference has a versioned code/name snapshot retained for history. No multi-level
        approval or procurement acceptance is implied.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        receiptNumber:
          type: string
          minLength: 1
          description: Server-assigned permanent business number; clients never provide it.
        status:
          $ref: '#/components/schemas/InboundReceiptStatus'
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        createdBy:
          $ref: '#/components/schemas/AssetCreatorReference'
        createdAt:
          $ref: '#/components/schemas/Instant'
        submittedAt:
          $ref: '#/components/schemas/Instant'
          description: First successful submission instant, retained after cancellation or rejection.
        adminDecisionDueAt:
          $ref: '#/components/schemas/Instant'
          description: Deadline computed at submission from the frozen parameter/calendar snapshot.
        warehouseClaimDueAt:
          $ref: '#/components/schemas/Instant'
          description: Deadline computed at approval from the frozen parameter/calendar snapshot.
        decision:
          $ref: '#/components/schemas/InboundDecision'
          description: The one effective administrator decision; absent before a decision wins.
        currentProcessor:
          $ref: '#/components/schemas/InboundProcessingOwnership'
          description: >-
            Unique whole-receipt warehouse owner; absent until an explicit claim wins.
            A terminal receipt retains it with archivedAt solely as history and write access is revoked.
        warehouseFirstExecutionDueAt:
          $ref: '#/components/schemas/Instant'
          description: First-execution deadline computed at claim from the frozen calendar snapshot.
        version:
          type: integer
          format: int64
          minimum: 0
        parameterVersionId:
          $ref: '#/components/schemas/Id'
        snapshot:
          $ref: '#/components/schemas/InboundReceiptSnapshot'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InboundReceiptItem'
        notes:
          type: string
        cancelledAt:
          $ref: '#/components/schemas/Instant'
        cancellationReason:
          type: string
        completedAt:
          $ref: '#/components/schemas/Instant'
    PageInboundReceipt:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InboundReceipt'
paths:
  /inbound-receipts:
    get:
      tags: [Inbound]
      operationId: listInboundReceipts
      summary: List inbound receipts within the fixed role and relationship scopes.
      x-actor:
        required: true
        roles: [ASSET_ADMIN, WAREHOUSE_OPERATOR, AUDIT_READ_ONLY]
      x-data-scope: >-
        WAREHOUSE_OPERATOR sees only own DRAFT receipts plus every approved receipt and
        its execution status; ASSET_ADMIN sees every submitted receipt and its history;
        AUDIT_READ_ONLY requires an explicit authorized audit scope. SYSTEM_ADMIN has no
        automatic inbound business access.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/InboundReceiptStatusFilter'
        - $ref: '#/components/parameters/InboundReceiptNumberFilter'
      responses:
        '200':
          description: Scoped inbound-receipt page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInboundReceipt'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Inbound]
      operationId: createInboundReceipt
      summary: Create a creator-owned inbound receipt draft with a server business number.
      x-business-write: true
      x-actor:
        required: true
        roles: [WAREHOUSE_OPERATOR]
      x-version:
        required: true
        precondition: Every asset, warehouse, and location reference version must be current.
      x-transaction:
        boundary: >-
          Validate creator-owned DRAFT assets, duplicate selection, active warehouse and
          location versions, and warehouse membership; allocate the permanent server
          business number, persist target snapshots, and audit in one short transaction.
          Draft creation does not acquire an asset business lock.
      x-audit-event:
        event: INBOUND_DRAFT_CREATED
      x-error-codes:
        - INBOUND_ASSET_NOT_FOUND
        - INBOUND_ASSET_NOT_CREATOR
        - INBOUND_ASSET_NOT_DRAFT
        - INBOUND_ASSET_LOCKED
        - INBOUND_DUPLICATE_ASSET
        - INBOUND_REFERENCE_VERSION_CONFLICT
        - INBOUND_MASTER_DATA_DISABLED
        - INBOUND_WAREHOUSE_LOCATION_MISMATCH
        - INBOUND_NUMBERING_RULE_UNAVAILABLE
        - INBOUND_IDEMPOTENCY_CONFLICT
      x-invariants: >-
        Only the creator may place their unsubmitted asset card in this DRAFT receipt.
        Every asset must be cardStage DRAFT, lifecycle WAITING_INBOUND, exception NORMAL,
        and free of an active business lock. The server allocates the permanent business
        number. Each effective warehouse and location is explicit and saved with an
        immutable code/name snapshot; defaults may be overridden per item.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundReceiptCreateRequest'
      responses:
        '201':
          description: Created creator-owned inbound receipt draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundReceipt'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inbound-receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/InboundReceiptId'
    get:
      tags: [Inbound]
      operationId: getInboundReceipt
      summary: Read an inbound receipt within its fixed role and relationship scope.
      x-actor:
        required: true
        roles: [ASSET_ADMIN, WAREHOUSE_OPERATOR, AUDIT_READ_ONLY]
      x-data-scope: >-
        WAREHOUSE_OPERATOR sees only an own DRAFT receipt or any approved receipt and its
        execution status; ASSET_ADMIN sees every submitted receipt and its history;
        AUDIT_READ_ONLY requires an explicit authorized audit scope. SYSTEM_ADMIN has no
        automatic inbound business access.
      responses:
        '200':
          description: Scoped inbound-receipt detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundReceipt'
