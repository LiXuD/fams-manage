      x-data-scope: >-
        A WAREHOUSE_OPERATOR sees its own DRAFT cards, while a DRAFT owned by any other
        account is absent from the list. ASSET_ADMIN and WAREHOUSE_OPERATOR receive the
        enterprise business view only for PENDING_INBOUND and ACTIVE cards. A card
        cancelled before first submission remains visible only to its creator. Detail,
