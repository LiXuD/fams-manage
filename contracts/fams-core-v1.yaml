openapi: 3.0.4
info:
  title: FAMS core first-slice contract
  version: 1.0.0
  description: >-
    Public wire foundation, authentication, and identity/account MasterData
    boundaries for the first FAMS design package. Asset, inbound, and later
    product paths are added in bounded contract increments.
servers:
  - url: /api/v1
    description: Versioned FAMS API root.
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: System-account authentication and session boundaries.
  - name: MasterData
    description: Organization, employee, and system-account configuration boundaries.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FAMS_SESSION
      description: Secure, HttpOnly session cookie; bearer tokens are not accepted.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token paired with the session cookie.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same key and payload returns the original result; a different payload conflicts.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit CSRF token paired with the secure session cookie.
      schema:
        type: string
        minLength: 16
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      description: Optimistic version precondition for an existing aggregate.
      schema:
        type: integer
        format: int64
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SystemAccountId:
      name: systemAccountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoleName:
      name: role
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Role'
    AssetCategoryId:
      name: assetCategoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ManufacturerId:
      name: manufacturerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    NumberingRuleId:
      name: numberingRuleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadRequest:
      description: Request validation or state precondition failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Session is absent, expired, or disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role, CSRF, or data/business relation is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version, uniqueness, idempotency, or lock conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested identity or account resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Login or other request rate limit has been reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Id:
      type: string
      pattern: '^[0-9]+$'
      description: Signed MySQL BIGINT represented as a decimal JSON string.
      example: '9007199254740993'
    Instant:
      type: string
      format: date-time
      description: Java Instant on the wire as an RFC 3339 value normalized to UTC Z.
      example: '2026-09-13T08:15:00Z'
    BusinessDate:
      type: string
      format: date
      description: Calendar date with no timezone conversion.
      example: '2026-09-13'
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Decimal money text with explicit two-place scale.
      example: '1200.00'
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    AuditEvent:
      type: object
      required: [eventId, eventType, actorId, occurredAt]
      properties:
        eventId:
          $ref: '#/components/schemas/Id'
        eventType:
          type: string
        actorId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          $ref: '#/components/schemas/Instant'
        aggregateId:
          $ref: '#/components/schemas/Id'
    Role:
      type: string
      enum: [EMPLOYEE, DEPARTMENT_ASSET_MANAGER, ASSET_ADMIN, WAREHOUSE_OPERATOR, TECH_ASSISTANT, AUDIT_READ_ONLY, SYSTEM_ADMIN]
    ReferenceStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    UsageMode:
      type: string
      enum: [PERSONAL, SHARED]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          writeOnly: true
    SessionResponse:
      type: object
      required: [csrfToken, idleExpiresAt, absoluteExpiresAt, requiresInitialPasswordChange, user]
      properties:
        csrfToken:
          type: string
        idleExpiresAt:
          $ref: '#/components/schemas/Instant'
        absoluteExpiresAt:
          $ref: '#/components/schemas/Instant'
        requiresInitialPasswordChange:
          type: boolean
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, username, status, roles, requiresInitialPasswordChange]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
        status:
          $ref: '#/components/schemas/SystemAccountStatus'
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Role'
        requiresInitialPasswordChange:
          type: boolean
    PermissionSnapshot:
      type: object
      required: [userId, permissions, dataScopes]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        permissions:
          type: array
          items:
            type: string
        dataScopes:
          type: array
          items:
            type: string
    OrganizationReference:
      type: object
      required: [id, version]
      description: A versioned reference used for tree writes and concurrency validation.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
    OrganizationCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        parentOrganization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Omit for a root organization; otherwise id and version are both required.
    OrganizationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        parentOrganization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Omit to retain the current parent; otherwise id and version are both required.
    Organization:
      type: object
      required: [id, code, name, status, version, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        parentOrganization:
          $ref: '#/components/schemas/OrganizationReference'
        status:
          $ref: '#/components/schemas/ReferenceStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Instant'
        updatedAt:
          $ref: '#/components/schemas/Instant'
    PageOrganization:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Organization'
    DisableOrganizationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    EmployeeCreateRequest:
      type: object
      additionalProperties: false
      required: [employeeNo, displayName, organization]
      properties:
        employeeNo:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        organization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Employee's organization id and current organization version.
        phone:
          type: string
          maxLength: 32
          x-sensitive: true
    EmployeeUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        employeeNo:
          type: string
          minLength: 1
          maxLength: 64
          description: Employee number remains unique when changed by an administrator.
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        organization:
          $ref: '#/components/schemas/OrganizationReference'
          description: New organization id and current organization version for a transfer.
        phone:
          type: string
          maxLength: 32
          x-sensitive: true
    Employee:
      type: object
      required: [id, employeeNo, displayName, organization, status, version, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        employeeNo:
          type: string
        displayName:
          type: string
        organization:
          $ref: '#/components/schemas/OrganizationReference'
        phone:
          type: string
          x-sensitive: true
        status:
          $ref: '#/components/schemas/ReferenceStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Instant'
        updatedAt:
          $ref: '#/components/schemas/Instant'
    PageEmployee:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Employee'
    DisableEmployeeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    EnableEmployeeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    EmployeeReference:
      type: object
      required: [id, version]
      description: A versioned employee reference used for account creation validation.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
    SystemAccountStatus:
      type: string
      enum: [ENABLED, DISABLED, LOCKED]
      default: ENABLED
    SystemAccountCreateRequest:
      type: object
      additionalProperties: false
      required: [username, employee, initialPassword]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        employee:
          $ref: '#/components/schemas/EmployeeReference'
          description: Employee id and current employee version for relation validation.
        initialPassword:
          type: string
          minLength: 12
          writeOnly: true
          description: Administrator-supplied temporary password; never returned by any response.
    SystemAccount:
      type: object
      additionalProperties: false
      required: [id, username, employeeId, status, version, requiresInitialPasswordChange, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
        employeeId:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/SystemAccountStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        requiresInitialPasswordChange:
          type: boolean
        failedLoginCount:
          type: integer
          format: int32
          minimum: 0
        configurationWarnings:
          type: array
          description: Atomic configuration anomalies retained for administrator follow-up.
          items:
            type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        updatedAt:
          $ref: '#/components/schemas/Instant'
    PageSystemAccount:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SystemAccount'
    SystemAccountStatusChangeRequest:
      type: object
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [ENABLE, DISABLE, UNLOCK]
        reason:
          type: string
          minLength: 1
          maxLength: 500
    InitialPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [newInitialPassword, reason]
      properties:
        newInitialPassword:
          type: string
          minLength: 12
          writeOnly: true
          description: Administrator-supplied temporary password; never returned by any response.
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RoleConfiguration:
      type: object
      description: Fixed V1 role-permission baseline; this resource is read-only and has no write endpoint.
      required: [role, permissions, businessScope, systemAdminBusinessPermissions]
      properties:
        role:
          type: string
          enum: [EMPLOYEE, DEPARTMENT_ASSET_MANAGER, ASSET_ADMIN, WAREHOUSE_OPERATOR, TECH_ASSISTANT, AUDIT_READ_ONLY, SYSTEM_ADMIN]
        permissions:
          type: array
          description: Fixed V1 business permissions; callers cannot dynamically grant or revoke entries.
          items:
            type: string
        businessScope:
          type: string
          enum: [PERSONAL, DEPARTMENT, DEPARTMENT_AND_DESCENDANTS, SPECIFIED_ORGANIZATION, SPECIFIED_WAREHOUSE, ENTERPRISE_WIDE, NONE]
          description: Controlled data-scope vocabulary for the fixed V1 role baseline.
        systemAdminBusinessPermissions:
          type: boolean
          enum: [false]
          default: false
          description: Always false for V1; SYSTEM_ADMIN role configuration alone grants no business approval or execution rights.
        configurationWarnings:
          type: array
          description: Read-only warning state when no configured handler remains; no authorization downgrade is automatic.
          items:
            type: string
    RoleConfigurationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RoleConfiguration'
    SystemAccountRoleRequest:
      type: object
      required: [role, reason]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    CatalogReference:
      type: object
      additionalProperties: false
      required: [id, version]
      description: Versioned reference used to validate a catalog relation at write time.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
    ExtensionFieldTemplate:
      type: object
      additionalProperties: false
      required: [key, label, type]
      description: A bounded extension-field definition owned by an asset category.
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
        label:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum: [TEXT, NUMBER, DATE, BOOLEAN]
        'required':
          type: boolean
          default: false
    CatalogStatusChangeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AssetCategoryCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        parentCategory:
          $ref: '#/components/schemas/CatalogReference'
          description: Omit for a root category; otherwise id and version are required.
        description:
          type: string
          maxLength: 500
        suggestedUnit:
          type: string
          maxLength: 32
        numberingPrefix:
          type: string
          maxLength: 32
        extensionFieldTemplate:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ExtensionFieldTemplate'
    AssetCategoryUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: PATCH fields; status changes use the explicit enable or disable operation.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        parentCategory:
          $ref: '#/components/schemas/CatalogReference'
          description: Omit to retain the parent; id and version are required when supplied.
        description:
          type: string
          maxLength: 500
        suggestedUnit:
          type: string
          maxLength: 32
        numberingPrefix:
          type: string
          maxLength: 32
        extensionFieldTemplate:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ExtensionFieldTemplate'
    AssetCategory:
      type: object
      additionalProperties: false
      required: [id, code, name, status, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        parentCategory:
          $ref: '#/components/schemas/CatalogReference'
        status:
          $ref: '#/components/schemas/ReferenceStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        description:
          type: string
        suggestedUnit:
          type: string
        numberingPrefix:
          type: string
        extensionFieldTemplate:
          type: array
          items:
            $ref: '#/components/schemas/ExtensionFieldTemplate'
    PageAssetCategory:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AssetCategory'
    AssetCategoryActiveReference:
      type: object
      additionalProperties: false
      required: [id, code, name, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        suggestedUnit:
          type: string
        numberingPrefix:
          type: string
    AssetCategoryActiveReferencePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AssetCategoryActiveReference'
    BrandCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        defaultManufacturer:
          $ref: '#/components/schemas/CatalogReference'
          description: Optional manufacturer id and version used as the default relation.
        description:
          type: string
          maxLength: 500
    BrandUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: PATCH fields; status changes use the explicit enable or disable operation.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        defaultManufacturer:
          $ref: '#/components/schemas/CatalogReference'
          description: Optional manufacturer id and current version; disabled manufacturers are rejected.
        description:
          type: string
          maxLength: 500
    Brand:
      type: object
      additionalProperties: false
      required: [id, code, name, status, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/ReferenceStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        defaultManufacturer:
          $ref: '#/components/schemas/CatalogReference'
        description:
          type: string
    PageBrand:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Brand'
    BrandActiveReference:
      type: object
      additionalProperties: false
      required: [id, code, name, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        defaultManufacturerId:
          $ref: '#/components/schemas/Id'
          description: Omitted when the historical default manufacturer is disabled; brand history is not rewritten.
    BrandActiveReferencePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BrandActiveReference'
    ManufacturerCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 500
    ManufacturerUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: PATCH fields; status changes use the explicit enable or disable operation.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 500
    Manufacturer:
      type: object
      additionalProperties: false
      required: [id, code, name, status, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/ReferenceStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        description:
          type: string
    PageManufacturer:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Manufacturer'
    ManufacturerActiveReference:
      type: object
      additionalProperties: false
      required: [id, code, name, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
    ManufacturerActiveReferencePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ManufacturerActiveReference'
    WarehouseCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 500
    WarehouseUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: PATCH fields; status changes use the explicit enable or disable operation.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
