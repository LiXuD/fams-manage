openapi: 3.0.4
info:
  title: FAMS core first-slice contract
  version: 1.0.0
  description: >-
    Public wire foundation and authentication boundary for the first FAMS design
    package. Master data, asset, and inbound paths are added in later bounded
    contract increments.
servers:
  - url: /api/v1
    description: Versioned FAMS API root.
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: System-account authentication and session boundaries.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FAMS_SESSION
      description: Secure, HttpOnly session cookie; bearer tokens are not accepted.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token paired with the session cookie.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same key and payload returns the original result; a different payload conflicts.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit CSRF token paired with the secure session cookie.
      schema:
        type: string
        minLength: 16
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      description: Optimistic version precondition for an existing aggregate.
      schema:
        type: integer
        format: int64
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
  responses:
    BadRequest:
      description: Request validation or state precondition failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Session is absent, expired, or disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role, CSRF, or data/business relation is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version, uniqueness, idempotency, or lock conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Login or other request rate limit has been reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Id:
      type: string
      pattern: '^[0-9]+$'
      description: Signed MySQL BIGINT represented as a decimal JSON string.
      example: '9007199254740993'
    Instant:
      type: string
      format: date-time
      description: Java Instant on the wire as an RFC 3339 value normalized to UTC Z.
      example: '2026-09-13T08:15:00Z'
    BusinessDate:
      type: string
      format: date
      description: Calendar date with no timezone conversion.
      example: '2026-09-13'
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Decimal money text with explicit two-place scale.
      example: '1200.00'
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    AuditEvent:
      type: object
      required: [eventId, eventType, actorId, occurredAt]
      properties:
        eventId:
          $ref: '#/components/schemas/Id'
        eventType:
          type: string
        actorId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          $ref: '#/components/schemas/Instant'
        aggregateId:
          $ref: '#/components/schemas/Id'
    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED, LOCKED]
    Role:
      type: string
      enum: [EMPLOYEE, DEPARTMENT_ASSET_MANAGER, ASSET_ADMIN, WAREHOUSE_OPERATOR, TECH_ASSISTANT, AUDIT_READ_ONLY, SYSTEM_ADMIN]
    ReferenceStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    UsageMode:
      type: string
      enum: [PERSONAL, SHARED]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          writeOnly: true
    SessionResponse:
      type: object
      required: [csrfToken, idleExpiresAt, absoluteExpiresAt, requiresInitialPasswordChange, user]
      properties:
        csrfToken:
          type: string
        idleExpiresAt:
          $ref: '#/components/schemas/Instant'
        absoluteExpiresAt:
          $ref: '#/components/schemas/Instant'
        requiresInitialPasswordChange:
          type: boolean
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, username, status, roles, requiresInitialPasswordChange]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Role'
        requiresInitialPasswordChange:
          type: boolean
    PermissionSnapshot:
      type: object
      required: [userId, permissions, dataScopes]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        permissions:
          type: array
          items:
            type: string
        dataScopes:
          type: array
          items:
            type: string
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Establish a session with a system account.
      security: []
      x-business-write: false
      x-exception-rationale: Version and idempotency are N/A because authentication has no existing business aggregate; the login attempt is still audited.
      x-non-applicable: [version, idempotency]
      x-transaction:
        boundary: Create or rotate the session and record the security audit atomically.
      x-audit-event:
        event: AUTH_LOGIN_ATTEMPT
      x-security-failure-policy: Unknown, disabled, locked, and wrong-password attempts use the same externally visible failure shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session metadata.
          headers:
            Set-Cookie:
              description: FAMS_SESSION cookie with Secure; HttpOnly; SameSite=Lax; Path=/api attributes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password:
    post:
      tags: [Auth]
      operationId: changeInitialPassword
      summary: Complete the mandatory initial password change for an enabled session.
      x-business-write: true
      x-actor:
        required: true
        source: Current enabled session user.
      x-version:
        required: true
        precondition: Current enabled session is valid and the initial password change is still required.
      x-transaction:
        boundary: Rotate the session, invalidate the old session, update password state, and audit atomically.
      x-audit-event:
        event: AUTH_INITIAL_PASSWORD_CHANGED
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Rotated SessionResponse; the old session is invalidated after the initial password change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Read the current system account and role snapshot.
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/permissions:
    get:
      tags: [Auth]
      operationId: getMyPermissions
      summary: Read effective permissions and data scope.
      responses:
        '200':
          description: Effective permission snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSnapshot'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session.
      x-business-write: false
      x-exception-rationale: Version and idempotency are N/A because logout invalidates the session rather than changing a business aggregate.
      x-non-applicable: [version, idempotency]
      x-transaction:
        boundary: Invalidate the current session, clear its cookie, and record the security audit atomically.
      x-audit-event:
        event: AUTH_LOGOUT
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session ended and the FAMS_SESSION cookie is cleared with Max-Age=0.
          headers:
            Set-Cookie:
              description: FAMS_SESSION=; Max-Age=0; Secure; HttpOnly; SameSite=Lax; Path=/api.
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
