      - $ref: '#/components/parameters/SystemAccountId'
      - $ref: '#/components/parameters/RoleName'
    get:
      tags: [AccountAdmin]
      operationId: getSystemAccountAuthorization
      summary: Read current controlled scopes and sensitive-field permissions for one account role.
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-authorization-policy: >-
        This resource configures only current general scopes and independent sensitive fields.
        The fixed role action baseline remains immutable. Account, employee, or role invalidation
        removes effective access immediately even when the historical configuration is retained.
      responses:
        '200':
          description: Current account-role authorization configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemAccountAuthorization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [AccountAdmin]
      operationId: replaceSystemAccountAuthorization
      summary: Atomically replace controlled scopes and sensitive-field permissions for one account role.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: >-
          If-Match-Version is zero only when no generation has ever existed; otherwise it
          equals the latest ACTIVE or REVOKED generation number. The account and fixed role
          membership must be current.
      x-transaction:
        boundary: >-
          Validate the current account, fixed role membership, allowed scope combinations,
          organization and warehouse versions, supersede the latest generation, then insert a
          new ACTIVE authorization generation with a new id and complete immutable child grants.
          Advance account auth_epoch, invalidate sessions immediately, and audit atomically.
      x-audit-event:
        event: SYSTEM_ACCOUNT_AUTHORIZATION_REPLACED
      x-error-codes:
        - SYSTEM_ACCOUNT_NOT_FOUND
        - SYSTEM_ACCOUNT_ROLE_NOT_GRANTED
        - AUTHORIZATION_VERSION_CONFLICT
        - AUTHORIZATION_SCOPE_INVALID
        - AUTHORIZATION_REFERENCE_VERSION_CONFLICT
        - AUTHORIZATION_REFERENCE_DISABLED
        - AUTHORIZATION_FIELD_NOT_ALLOWED
        - AUTHORIZATION_IDEMPOTENCY_CONFLICT
      x-invariants: >-
        Fixed role actions never become dynamically editable. ASSET_ADMIN all-submitted-request
        visibility and WAREHOUSE_OPERATOR all-approved-request visibility remain fixed and are
        unioned independently of general scopes. Field permission does not grant record access,
        record access does not grant a sensitive field, and disabled referenced scope rows stop
        contributing immediately. Prior generations and children remain history;
        same scopes and field permissions can be granted again under a later authorization id.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemAccountAuthorizationReplaceRequest'
      responses:
        '200':
          description: Replaced account-role authorization and invalidated stale sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemAccountAuthorization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system-accounts/{systemAccountId}/authorization/{role}/revoke:
    parameters:
      - $ref: '#/components/parameters/SystemAccountId'
      - $ref: '#/components/parameters/RoleName'
    post:
      tags: [AccountAdmin]
      operationId: revokeSystemAccountAuthorization
      summary: Revoke all configurable scopes and sensitive-field permissions for one account role.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match-Version equals the current ACTIVE authorization version.
      x-transaction:
        boundary: >-
          Supersede the current ACTIVE generation, insert a new REVOKED authorization generation
          with a new id and no child grants, advance account auth_epoch, invalidate sessions
          immediately, preserve fixed role membership, and write the audit event atomically.
      x-audit-event:
        event: SYSTEM_ACCOUNT_AUTHORIZATION_REVOKED
      x-error-codes:
        - SYSTEM_ACCOUNT_NOT_FOUND
        - SYSTEM_ACCOUNT_ROLE_NOT_GRANTED
        - AUTHORIZATION_NOT_FOUND
        - AUTHORIZATION_ALREADY_REVOKED
        - AUTHORIZATION_VERSION_CONFLICT
        - AUTHORIZATION_IDEMPOTENCY_CONFLICT
      x-invariants: >-
        Revocation removes only configurable current scopes and sensitive fields. It does not
        edit the fixed role baseline or silently remove role membership, but effective access
        from this configuration ends immediately. Historical generations and child facts remain
        immutable and auditable; a later replacement may regrant the same values under a new id.
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemAccountAuthorizationRevokeRequest'
      responses:
        '200':
          description: Revoked authorization with empty current grants and retained history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemAccountAuthorization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

