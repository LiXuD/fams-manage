      x-sensitive-fields-policy: Service phone, attachments, and export require separate authorization.
      x-detail-sections:
        - BASIC_INFORMATION
        - CURRENT_CUSTODY
        - TAG_AND_ATTACHMENTS
        - USE_BORROW_TRANSFER
        - INVENTORY
        - REPAIR_AND_FACTORY
        - LOSS_AND_RECOVERY
        - SCRAP
        - OPERATION_LOG
      x-history-navigation: >-
        The nine stable sections are the PC detail information architecture. Later domain
        contracts populate their business sections without widening this asset read model.
        Only authorized fields are returned, sensitive fields remain separately gated, and
        every original document link requires fresh permission evaluation when followed.
      responses:
        '200':
          description: Asset card details with formal custody and unsettled-business summary.
