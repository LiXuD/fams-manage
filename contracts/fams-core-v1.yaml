openapi: 3.0.4
info:
  title: FAMS core first-slice contract
  version: 1.0.0
  description: >-
    Contract-first design package for authentication, master data, asset cards,
    labels, and daily inbound receipt handling. This is a design boundary;
    product controllers and persistence implementations are intentionally absent.
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: System-account authentication and session boundaries.
  - name: MasterData
    description: Organization, employee, classification, warehouse, and parameter data.
  - name: Assets
    description: Asset cards, labels, and ledger views.
  - name: Inbound
    description: Daily inbound receipt approval and warehouse execution.
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Establish a session with a system account.
      x-business-write: false
      x-exception-rationale: Version and idempotency are N/A because authentication has no existing business aggregate; the login attempt is still audited.
      x-non-applicable: [version, idempotency]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/password:
    post:
      tags: [Auth]
      operationId: changeInitialPassword
      summary: Complete the mandatory first-password change.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ACCOUNT]
      x-version:
        required: true
        precondition: Session user version is current.
      x-transaction:
        boundary: Update password state and security audit atomically.
      x-audit-event:
        event: AUTH_INITIAL_PASSWORD_CHANGED
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Updated authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Read the current system account and role snapshot.
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/permissions:
    get:
      tags: [Auth]
      operationId: getMyPermissions
      summary: Read effective permissions and data scope.
      responses:
        '200':
          description: Effective permission snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session.
      x-business-write: false
      x-exception-rationale: Version and idempotency are N/A because logout invalidates the session rather than changing a business aggregate.
      x-non-applicable: [version, idempotency]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session ended.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /organizations:
    get:
      tags: [MasterData]
      operationId: listOrganizations
      summary: List organizations in the tenant.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Organization page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrganization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [MasterData]
      operationId: createOrganization
      summary: Create an organization.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: Parent organization version is current when supplied.
      x-transaction:
        boundary: Insert organization and audit event atomically.
      x-audit-event:
        event: ORGANIZATION_CREATED
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Created organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [MasterData]
      operationId: getOrganization
      summary: Read an organization.
      responses:
        '200':
          description: Organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MasterData]
      operationId: updateOrganization
      summary: Update an organization without silently rewriting asset responsibility.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match version must equal the stored organization version.
      x-transaction:
        boundary: Conditional update and audit event are one short transaction.
      x-audit-event:
        event: ORGANIZATION_UPDATED
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees:
    get:
      tags: [MasterData]
      operationId: listEmployees
      summary: List employees and their active status.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Employee page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEmployee'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MasterData]
      operationId: createEmployee
      summary: Create an employee account relation.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: Organization and employee identity versions are current.
      x-transaction:
        boundary: Insert employee and audit event atomically.
      x-audit-event:
        event: EMPLOYEE_CREATED
      x-required-error-statuses: [400, 401, 403, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '201':
          description: Created employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [MasterData]
      operationId: getEmployee
      summary: Read an employee.
      responses:
        '200':
          description: Employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MasterData]
      operationId: updateEmployee
      summary: Update employee status or organization relation.
      x-business-write: true
      x-actor:
        required: true
        roles: [SYSTEM_ADMIN]
      x-version:
        required: true
        precondition: If-Match version must equal the stored employee version.
      x-transaction:
        boundary: Conditional employee update and audit event are one transaction.
      x-audit-event:
        event: EMPLOYEE_UPDATED
      x-required-error-statuses: [400, 401, 403, 404, 409]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '200':
          description: Updated employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories:
