openapi: 3.0.4
info:
  title: FAMS core first-slice contract
  version: 1.0.0
  description: >-
    Public wire foundation, authentication, identity/account administration, and MasterData
    boundaries for the first FAMS design package. Asset, inbound, and later
    product paths are added in bounded contract increments.
servers:
  - url: /api/v1
    description: Versioned FAMS API root.
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: System-account authentication and session boundaries.
  - name: MasterData
    description: Organization, employee, and catalog configuration boundaries.
  - name: AccountAdmin
    description: System-account, fixed-role, and controlled-authorization configuration boundaries.
  - name: Assets
    description: Asset-card and ledger read boundaries; business mutations remain scoped to warehouse operators.
  - name: AssetImport
    description: Warehouse-operator asset import upload and row preflight boundaries.
  - name: Inbound
    description: Inbound receipt draft and lifecycle boundaries; approval and warehouse execution are later slices.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FAMS_SESSION
      description: Secure, HttpOnly session cookie; bearer tokens are not accepted.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token paired with the session cookie.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same key and payload returns the original result; a different payload conflicts.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit CSRF token paired with the secure session cookie.
      schema:
        type: string
        minLength: 16
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      description: Optimistic version precondition for an existing aggregate.
      schema:
        type: integer
        format: int64
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SystemAccountId:
      name: systemAccountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoleName:
      name: role
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Role'
    AssetCategoryId:
      name: assetCategoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ManufacturerId:
      name: manufacturerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    NumberingRuleId:
      name: numberingRuleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BusinessParameterVersionId:
      name: parameterVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ConfigurationAnomalyId:
      name: anomalyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AssetSavedFilterId:
      name: savedFilterId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    QrToken:
      name: token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AssetQrToken'
    PrintJobId:
      name: printJobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InboundReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InboundReceiptItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InboundReceiptStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InboundReceiptStatus'
    InboundReceiptNumberFilter:
      name: receiptNumber
      in: query
      required: false
      schema:
        type: string
    AssetCodeFilter:
      name: assetCode
      in: query
      required: false
      schema:
        type: string
    AssetNameFilter:
      name: name
      in: query
      required: false
      schema:
        type: string
    SerialNumberFilter:
      name: serialNumber
      in: query
      required: false
      schema:
        type: string
    AssetCategoryFilter:
      name: assetCategoryId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetLifecycleFilter:
      name: lifecycle
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AssetLifecycle'
    AssetExceptionFilter:
      name: exception
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AssetException'
    AssetWarehouseFilter:
      name: warehouseId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetLocationFilter:
      name: locationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetOrganizationFilter:
      name: organizationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetUsageModeFilter:
      name: usageMode
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UsageMode'
    AssetUsingOrganizationFilter:
      name: usingOrganizationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetResponsibleEmployeeFilter:
      name: responsibleEmployeeId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetDepartmentResponsibleEmployeeFilter:
      name: departmentResponsibleEmployeeId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetCurrentProcessorFilter:
      name: currentProcessorId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    AssetBusinessReferenceFilter:
      name: businessReference
      in: query
      required: false
      description: Exact business receipt id or business number.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AssetInboundDateFromFilter:
      name: inboundDateFrom
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusinessDate'
    AssetInboundDateToFilter:
      name: inboundDateTo
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusinessDate'
    AssetLastInventoryDateFromFilter:
      name: lastInventoryDateFrom
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusinessDate'
    AssetLastInventoryDateToFilter:
      name: lastInventoryDateTo
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusinessDate'
    AssetBorrowOverdueFilter:
      name: borrowOverdue
      in: query
      required: false
      schema:
        type: boolean
    AssetLongUninventoriedFilter:
      name: longUninventoried
      in: query
      required: false
      schema:
        type: boolean
    AssetTimelineEventTypeFilter:
      name: eventType
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: Request validation or state precondition failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Session is absent, expired, or disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role, CSRF, or data/business relation is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version, uniqueness, idempotency, or lock conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested identity or account resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Login or other request rate limit has been reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Id:
      type: string
      pattern: '^[0-9]+$'
      description: Signed MySQL BIGINT represented as a decimal JSON string.
      example: '9007199254740993'
    Instant:
      type: string
      format: date-time
      description: Java Instant on the wire as an RFC 3339 value normalized to UTC Z.
      example: '2026-09-13T08:15:00Z'
    BusinessDate:
      type: string
      format: date
      description: Calendar date with no timezone conversion.
      example: '2026-09-13'
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Decimal money text with explicit two-place scale.
      example: '1200.00'
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    AuditEvent:
      type: object
      required: [eventId, eventType, actorId, occurredAt]
      properties:
        eventId:
          $ref: '#/components/schemas/Id'
        eventType:
          type: string
        actorId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          $ref: '#/components/schemas/Instant'
        aggregateId:
          $ref: '#/components/schemas/Id'
    Role:
      type: string
      enum: [EMPLOYEE, DEPARTMENT_ASSET_MANAGER, ASSET_ADMIN, WAREHOUSE_OPERATOR, TECH_ASSISTANT, AUDIT_READ_ONLY, SYSTEM_ADMIN]
    DataScopeType:
      type: string
      enum: [SELF, OWN_ORGANIZATION, OWN_ORGANIZATION_AND_DESCENDANTS, SPECIFIED_ORGANIZATIONS, SPECIFIED_WAREHOUSES, ENTERPRISE]
      description: Controlled V1 vocabulary for general data access; it does not replace business-relation checks.
    SensitiveFieldPermission:
      type: string
      enum: [EMPLOYEE_PHONE, ASSET_SERVICE_PHONE, BUSINESS_ATTACHMENT, REPAIR_COST, BULK_EXPORT, SCRAP_ATTACHMENT, SYSTEM_OPERATION_LOG]
      description: Independently granted field or action capabilities; none is implied by record visibility.
    DataScopeGrant:
      type: object
      additionalProperties: false
      required: [scopeType, organizations, warehouses]
      description: >-
        One current general data scope. SPECIFIED_ORGANIZATIONS requires a non-empty
        organizations array and an empty warehouses array; SPECIFIED_WAREHOUSES requires
        the inverse. Other scope types require both arrays empty. Every referenced row and
        version must be current when configured and is re-evaluated on every business read.
      properties:
        scopeType:
          $ref: '#/components/schemas/DataScopeType'
        organizations:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrganizationReference'
        warehouses:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CatalogReference'
    ReferenceStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    UsageMode:
      type: string
      enum: [PERSONAL, SHARED]
    AssetLifecycle:
      type: string
      enum: [WAITING_INBOUND, IN_STOCK, IN_USE, BORROWED, UNDER_REPAIR, FACTORY_REPAIR, PENDING_SCRAP, SCRAPPED]
    AssetException:
      type: string
      enum: [NORMAL, SEARCHING, LOST]
    AssetCardStage:
      type: string
      enum: [DRAFT, PENDING_INBOUND, ACTIVE, CANCELLED]
    AssetCreatorReference:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
    AttachmentReference:
      type: object
      additionalProperties: false
      required: [id, version]
      description: Versioned attachment identity; attachment content and export permissions are separate concerns.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 0
    AssetCustodySummary:
      type: object
      description: >-
        Read-only formal custody summary. STORAGE is an in-warehouse custody with
        warehouse and location only; PERSONAL has one responsible employee and a
        using organization; SHARED has one department responsible employee and a
        fixed location. Owning organization is kept on the Asset and is distinct
        from usingOrganization. These custody variants are mutually exclusive.
        Planned inbound targets are not current custody.
      oneOf:
        - type: object
          additionalProperties: false
          required: [custodyType, warehouse, location]
          properties:
            custodyType:
              type: string
              enum: [STORAGE]
            warehouse:
              $ref: '#/components/schemas/CatalogReference'
            location:
              $ref: '#/components/schemas/CatalogReference'
        - type: object
          additionalProperties: false
          required: [custodyType, usingOrganization, responsibleEmployee, location]
          properties:
            custodyType:
              type: string
              enum: [PERSONAL]
            usingOrganization:
              $ref: '#/components/schemas/OrganizationReference'
            responsibleEmployee:
              $ref: '#/components/schemas/EmployeeReference'
            location:
              $ref: '#/components/schemas/CatalogReference'
        - type: object
          additionalProperties: false
          required: [custodyType, usingOrganization, departmentResponsibleEmployee, location]
          properties:
            custodyType:
              type: string
              enum: [SHARED]
            usingOrganization:
              $ref: '#/components/schemas/OrganizationReference'
            departmentResponsibleEmployee:
              $ref: '#/components/schemas/EmployeeReference'
            location:
              $ref: '#/components/schemas/CatalogReference'
    AssetBusinessSummary:
      type: object
      additionalProperties: false
      required: [unsettledBusinessCount, overdueBusinessCount]
      description: Read-only summary of formal custody and current unsettled business relations.
      properties:
        unsettledBusinessCount:
          type: integer
          format: int32
          minimum: 0
        overdueBusinessCount:
          type: integer
          format: int32
          minimum: 0
        latestBusinessReference:
          $ref: '#/components/schemas/Id'
        currentBusinessId:
          $ref: '#/components/schemas/Id'
        currentBusinessNumber:
          type: string
        currentBusinessType:
          type: string
        currentProcessor:
          $ref: '#/components/schemas/AssetCreatorReference'
    Asset:
      type: object
      additionalProperties: false
      required: [id, assetCode, name, lifecycle, exception, cardStage, version, createdBusinessDate, createdAt, parameterVersionId]
      description: >-
        Asset card and ledger read model. planned inbound warehouse and location are
        not formal custody; currentCustody is established only after inbound acceptance.
        Sensitive service fields, attachments, and export are separately authorized.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        assetCode:
          type: string
          description: Server-assigned enterprise-unique permanent code; never reused.
        name:
          type: string
        category:
          $ref: '#/components/schemas/CatalogReference'
        model:
          type: string
        unit:
          type: string
        organization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Owning organization; distinct from any usingOrganization in formal custody.
        usageMode:
          $ref: '#/components/schemas/UsageMode'
          description: Formal PERSONAL or SHARED use; absent while the asset remains in storage.
        plannedInboundWarehouse:
          $ref: '#/components/schemas/CatalogReference'
        plannedInboundLocation:
          $ref: '#/components/schemas/CatalogReference'
        brand:
          $ref: '#/components/schemas/CatalogReference'
        manufacturer:
          $ref: '#/components/schemas/CatalogReference'
        serialNumber:
          type: string
        acquisitionDate:
          $ref: '#/components/schemas/BusinessDate'
        warrantyExpiryDate:
          $ref: '#/components/schemas/BusinessDate'
        serviceProvider:
          type: string
        serviceContact:
          type: string
        servicePhone:
          type: string
          x-sensitive: true
        source:
          type: string
        notes:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentReference'
          x-sensitive: true
        extensionValues:
          type: object
          additionalProperties: true
        lifecycle:
          $ref: '#/components/schemas/AssetLifecycle'
        exception:
          $ref: '#/components/schemas/AssetException'
        cardStage:
          $ref: '#/components/schemas/AssetCardStage'
        version:
          type: integer
          format: int64
          minimum: 0
        createdBusinessDate:
          $ref: '#/components/schemas/BusinessDate'
        createdAt:
          $ref: '#/components/schemas/Instant'
        parameterVersionId:
          $ref: '#/components/schemas/Id'
        creator:
          $ref: '#/components/schemas/AssetCreatorReference'
        currentCustody:
          $ref: '#/components/schemas/AssetCustodySummary'
        openBusinessSummary:
          $ref: '#/components/schemas/AssetBusinessSummary'
        inboundBusinessDate:
          $ref: '#/components/schemas/BusinessDate'
        lastInventoryBusinessDate:
          $ref: '#/components/schemas/BusinessDate'
    PageAsset:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Asset'
    AssetTimelineEvent:
      type: object
      additionalProperties: false
      required: [id, eventType, occurredAt, summary, sourceBusinessType, sourceBusinessId]
      description: >-
        Read-only asset history projection. A link identifies an original business
        document but never bypasses current authorization or sensitive-field policy.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        eventType:
          type: string
        occurredAt:
          $ref: '#/components/schemas/Instant'
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        summary:
          type: string
        sourceBusinessType:
          type: string
        sourceBusinessId:
          $ref: '#/components/schemas/Id'
        sourceBusinessNumber:
          type: string
        actor:
          $ref: '#/components/schemas/AssetCreatorReference'
        detailLink:
          type: string
          description: Relative link to the original document, subject to fresh authorization.
    PageAssetTimelineEvent:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AssetTimelineEvent'
    AssetFilterCriteria:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Typed reusable asset-ledger criteria. Persistence never captures or grants a data
        scope; execution always intersects these values with current permission.
      properties:
        assetCode:
          type: string
        name:
          type: string
        serialNumber:
          type: string
        assetCategoryId:
          $ref: '#/components/schemas/Id'
        lifecycle:
          $ref: '#/components/schemas/AssetLifecycle'
        exception:
          $ref: '#/components/schemas/AssetException'
        usageMode:
          $ref: '#/components/schemas/UsageMode'
        warehouseId:
          $ref: '#/components/schemas/Id'
        locationId:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        usingOrganizationId:
          $ref: '#/components/schemas/Id'
        responsibleEmployeeId:
          $ref: '#/components/schemas/Id'
        departmentResponsibleEmployeeId:
          $ref: '#/components/schemas/Id'
        currentProcessorId:
          $ref: '#/components/schemas/Id'
        businessReference:
          type: string
          minLength: 1
          maxLength: 128
        inboundDateFrom:
          $ref: '#/components/schemas/BusinessDate'
        inboundDateTo:
          $ref: '#/components/schemas/BusinessDate'
        lastInventoryDateFrom:
          $ref: '#/components/schemas/BusinessDate'
        lastInventoryDateTo:
          $ref: '#/components/schemas/BusinessDate'
        borrowOverdue:
          type: boolean
        longUninventoried:
          type: boolean
    AssetSavedFilter:
      type: object
      additionalProperties: false
      required: [id, ownerAccountId, name, criteria, version, createdAt, updatedAt]
      description: Personal asset-ledger preference owned by exactly one system account.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        ownerAccountId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        criteria:
          $ref: '#/components/schemas/AssetFilterCriteria'
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Instant'
        updatedAt:
          $ref: '#/components/schemas/Instant'
    PageAssetSavedFilter:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AssetSavedFilter'
    AssetSavedFilterCreateRequest:
      type: object
      additionalProperties: false
      required: [name, criteria]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        criteria:
          $ref: '#/components/schemas/AssetFilterCriteria'
    AssetSavedFilterUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        criteria:
          $ref: '#/components/schemas/AssetFilterCriteria'
    AssetCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: >-
        Warehouse-operator draft input. Only name is required; non-critical fields
        may be completed before inbound submission and all references carry id/version.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        category:
          $ref: '#/components/schemas/CatalogReference'
        model:
          type: string
          maxLength: 128
        unit:
          type: string
          maxLength: 32
        organization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Owning organization reference; distinct from formal custody usage.
        plannedInboundWarehouse:
          $ref: '#/components/schemas/CatalogReference'
        plannedInboundLocation:
          $ref: '#/components/schemas/CatalogReference'
        brand:
          $ref: '#/components/schemas/CatalogReference'
        manufacturer:
          $ref: '#/components/schemas/CatalogReference'
        serialNumber:
          type: string
          maxLength: 128
        acquisitionDate:
          $ref: '#/components/schemas/BusinessDate'
        warrantyExpiryDate:
          $ref: '#/components/schemas/BusinessDate'
        serviceProvider:
          type: string
          maxLength: 256
        serviceContact:
          type: string
          maxLength: 128
        servicePhone:
          type: string
          maxLength: 32
          x-sensitive: true
        source:
          type: string
          maxLength: 128
        notes:
          type: string
          maxLength: 2000
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentReference'
          x-sensitive: true
        extensionValues:
          type: object
          additionalProperties: true
    AssetUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        PATCH draft fields. A DRAFT creator may update all fields listed here. After
        inbound submission only descriptive fields are eligible for a warehouse
        operator correction; status, identity, ownership, custody, and responsibility
        changes use controlled business processes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        category:
          $ref: '#/components/schemas/CatalogReference'
        model:
          type: string
          maxLength: 128
        unit:
          type: string
          maxLength: 32
        organization:
          $ref: '#/components/schemas/OrganizationReference'
          description: Owning organization reference; distinct from formal custody usage.
        plannedInboundWarehouse:
          $ref: '#/components/schemas/CatalogReference'
        plannedInboundLocation:
          $ref: '#/components/schemas/CatalogReference'
        brand:
          $ref: '#/components/schemas/CatalogReference'
        manufacturer:
