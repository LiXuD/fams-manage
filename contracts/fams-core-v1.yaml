        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: 'Employee/device quota, cooldown or binding lock reached.' }
        '503': { description: Real WeChat or SMS adapter unavailable; no binding performed. }
