# D6-02B is an isolated compatibility probe, not a product surface.
spring.autoconfigure.exclude=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/runtime_compatibility
spring.flyway.clean-disabled=true
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.name=FAMS_D6_02B_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# Keep the probe bounded and deterministic while it runs against task-owned MySQL.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2500
