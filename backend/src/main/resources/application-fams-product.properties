# Real product profile. Credentials are supplied by the runtime environment.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/d6_04
fams.security.employee-phone-key=${FAMS_EMPLOYEE_PHONE_KEY:${fams.security.idempotency-hmac-key}}
spring.flyway.clean-disabled=true
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
mybatis.configuration.map-underscore-to-camel-case=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2500
